# SA0 前置解析用詞典(資料層,專案可用 .spec-dev.yaml 的 lexicon.extra_* 擴充)
version: 1
ngram: [2, 5]                 # CJK n-gram 長度範圍
boundary_filter: true         # 邊界熵:左(右)鄰字唯一且延伸詞同頻 → 碎片,丟棄
min_freq: 2                   # 低於此詞頻且不在詞典/詞彙表 → 降級
# 動作詞(動詞):命中即歸「動作候選」;複合詞含這些字串也算(重新送出 ⊃ 送出)
verbs: [出貨, 下單, 付款, 預約, 兌換, 報到, 釋放, 扣除, 到期, 退款, 送出, 送審, 核准, 退回, 修改, 重送, 重新送出, 提醒, 指派, 建立, 新增, 刪除, 查詢, 查看, 通知, 審核, 發布, 上傳, 下載, 取消, 確認, 登入, 登出, 匯入, 匯出, 儲存, 更新, 顯示, 處理, 填寫, 選擇, 設定, 啟用, 停用, 派發, 簽核, 駁回, 撤回, 結案]
# 角色後綴:結尾命中即歸「角色候選」
role_suffixes: [者, 員, 主管, 系統, 管理員, 人員, 客戶, 會員, 使用者, 排程]
# 狀態值前綴:命中歸「狀態值」(是屬性,不是實體)
status_prefixes: [待, 已, 未, 可, 不可]
# 切分字:CJK 連續字串先在這些字切開,再做 n-gram(避免「核准或退回」產生「准或退回」)
split_chars: [的, 了, 或, 與, 並, 及, 和, 時, 再, 就, 則, 且, 也, 都, 才, 被, 把, 將, 讓, 對, 向, 從, 到, 給, 要, 能, 會, 須, 應, 得, 可, 不, 是, 在, 有, 無, 每, 該, 此, 其, 之, 為, 而, 但, 若, 當, 各, 另, 仍, 已, 未, 待]
# 受保護詞:含切分字但本身是詞的(會員、會議室、時段…),切分前先整詞保護。動詞詞典與專案詞彙表的詞也自動保護。
protect_words: [會員, 會議, 會議室, 會計, 時段, 時間, 時程, 到期, 報到, 到貨, 可用, 不良, 待辦, 已讀]
# 停用字:n-gram 首尾不得為這些字;整詞在列表也丟
stop_chars: [後, 前, 中, 內, 上, 下, 一, 個, 次, 位, 筆, 字, 分, 秒, 人, 直, 接]
stop_words: [目前, 必須, 想要, 想知道, 要求, 目標, 以內, 以上, 以下, 直到, 至少, 超過, 期間, 所有, 任何, 每天, 當天, 隔天, 之後, 之前, 以後, 如果, 可以, 可能, 不可, 包含, 進入, 完成, 進行, 使用, 提供, 顯示為, 三個月, 直接, 時間, 平均, 處理, 上線, 四層, 單一, 只有, 一律, 規範, 概觀, 參考, 文件, 開發]
# 狀態值:以這些字開頭(待審核 / 已核准)視為狀態值;放回詞裡用 status_prefixes 判斷,所以 split_chars 裡的 已/未/待 只在非詞首時切
# 文件類型權重:重要性 = Σ 出現 × 章節權重 × 文件權重
doc_weights: {pm_spec: 1.0, mock: 1.0, ref: 0.4}
# 英文:忽略的 token(HTTP 動詞、常見詞)
en_ignore: [GET, POST, PUT, DELETE, PATCH, THE, AND, FOR, WITH, API, ID, PM, RD, SA, UML]
# 章節權重:標題含關鍵字時,該節每次出現乘以此權重
section_weights: {功能需求: 3, 驗收: 2, 非功能: 2, 使用者: 2, 情境: 2, 背景: 1, 目標: 1}
promote_top_ratio: 0.6        # 權重排序前 60%(且詞頻 ≥ min_freq)或有詞彙表符號 → 升;只出現在 ref 的 → 降
