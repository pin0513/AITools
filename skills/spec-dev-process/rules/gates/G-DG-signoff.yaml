id: G-DG-signoff
version: 1
category: gate
stage: S6
name: 圖的人工簽核
description: 人工簽核記在 spec-review/audit/signoff.md(SSOT),一張圖 × 一個確認事項(是不是要的 / 測得出來 / 做得出來,見 rules/review/duties.yaml)一列;以事情區分,不以人區分。「不需要」(附理由)算做完。任一項退回 → FAIL;核准後內容又變(hash 不同)→ WARN;未簽核 → 依 config reviewer.require_signoff 決定 INFO 或 WARN
predicate: signoff_findings
params: {}
outcomes:
  rejected:      {status: FAIL, message: "{diagram}「{duty}」被 {by} 退回:{note}", action: "依備註修正後重新簽核"}
  stale:         {status: WARN, message: "{diagram}「{duty}」通過後內容已變更(簽核 {signed} → 目前 {current})", action: "看板上重新確認並簽核"}
  upstream:      {status: WARN, message: "{diagram}「{duty}」在 v{signed_v} 通過後,它依據的上游已變:{keys}", action: "看板「版本」分頁看 diff,重看後再確認"}
  pending:       {status: INFO, message: "{diagram}「{duty}」尚未確認"}
  pending_required: {status: WARN, message: "{diagram}「{duty}」尚未確認(專案要求簽核)", action: "看板上確認並簽核"}
