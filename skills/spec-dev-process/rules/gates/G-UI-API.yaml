id: G-UI-API
version: 1
category: gate
stage: S5
name: UI 與 API 各自的顆粒度對得上
description: |
  UI spec 的顆粒度是畫面元素(按鈕、欄位、連結,ui/41「畫面元素」表),API spec 的顆粒度是 endpoint(api/40「介面清單」)。
  核對:元素呼叫的 endpoint 存在;mock 上可互動的元素都列在表上、表上的元素 mock 裡找得到;每個 endpoint 有呼叫者
  (UI 元素,或在「呼叫者」欄註明排程 / 外部);有動作的元素要對到 AC。沒有「畫面元素」表就不核對(純後端或還沒寫)。
predicate: ui_api
params: {non_ui_callers: [排程, 外部, 系統, job, batch, external, scheduler, webhook]}
outcomes:
  linked:            {status: INFO, message: "{screen} {element} → {apis} → {cmps} · AC {acs}"}
  api_missing:       {status: FAIL, message: "{screen} {element} 呼叫 {api},但介面清單沒有這個 endpoint", action: "api/40 補 endpoint,或修正元素的「呼叫 API」"}
  ac_missing:        {status: FAIL, message: "{screen} {element} 對應的 {ac} 不存在", action: "修正 AC ID"}
  no_ac:             {status: WARN, message: "{screen} {element}({action})有動作但沒有對應 AC", action: "補對應 AC,或在 10 補一條 AC"}
  mock_uncovered:    {status: WARN, message: "mock {mock} 的 {tag} {ref}「{text}」沒有列在畫面元素表", action: "ui/41「畫面元素」補一列(不做也要列,動作寫「無」)"}
  not_in_mock:       {status: WARN, message: "{screen} {element} 在 mock {mock} 找不到", action: "元素寫 mock 的 #id 或 name;或確認 mock 是否過期"}
  api_no_caller:     {status: WARN, message: "{api} {method} {path} 沒有任何畫面元素呼叫", action: "補呼叫它的元素,或在介面清單「呼叫者」欄註明排程 / 外部"}
