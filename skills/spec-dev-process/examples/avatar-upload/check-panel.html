.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;white-space:pre}

.log div{padding:0 6px;white-space:pre}.log .low{background:var(--warnbg)}.log .fail{background:var(--failbg)}.log .dead{text-decoration:line-through;color:var(--muted)}
details>summary{cursor:pointer;list-style:none;user-select:none}details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";color:var(--muted)}details[open]>summary::before{content:"▾ "}
input[type=search]{font:inherit;padding:2px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}
.pre{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted);white-space:pre-wrap}
.two{display:grid;grid-template-columns:1fr 1.6fr;gap:12px}@media(max-width:900px){.two{grid-template-columns:1fr}}

.evg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr)}
.evg>div{padding:10px 12px;min-width:0;border-right:1px solid var(--line)}.evg>div:last-child{border-right:0}
.evg h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
@media(max-width:900px){.evg{grid-template-columns:minmax(0,1fr)}.evg>div{border-right:0;border-bottom:1px solid var(--line)}}
.loc{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted);word-break:break-all}
.dg{overflow-x:auto;border:1px solid var(--line);border-radius:4px;padding:4px;margin:4px 0 8px;background:var(--bg)}
.lookup{display:grid;gap:6px;margin:0 0 10px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--head)}
.lookup input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box}
.lkout{display:grid;gap:8px;max-height:60vh;overflow:auto}
.tw{overflow-x:auto}.tw table{width:auto;min-width:100%}.tw table td,.tw table th{white-space:normal;min-width:4.5em}.tw td.loc,.tw th{white-space:nowrap;word-break:normal}.st{white-space:nowrap}
.dg svg{max-width:none!important;height:auto}
.chain{font-size:12px;line-height:1.7}.chain .n{display:inline-block;padding:0 6px;border:1px solid var(--line);border-radius:4px;background:var(--head);font-family:ui-monospace,Menlo,monospace}.chain .m{color:var(--accent);font-family:ui-monospace,Menlo,monospace}.chain .ev{color:var(--muted)}
ul{margin:4px 0;padding-left:18px}
</style>

O_LARGE\n  else\n    C->>H: Send(UploadAvatarCommand)\n    H->>V: Validate(stream)\n    H->>S: SaveAsync(stream)\n    alt Blob 逾時 x3\n      S-->>H: StorageUnavailable\n      H-->>C: Failure\n      C-->>M: 503\n    else\n      S-->>H: BlobRef\n      H->>A: ReplaceAvatar(Avatar)\n      A-->>H: AvatarReplaced\n      H-->>C: Result(url)\n      C-->>M: 200 {url}\n    end\n  end"}, {"id": "ERD-001", "kind": "erd", "file": "50-data-model.md", "line": 5, "heading": "ERD-001", "req": "*", "reqs": [], "mermaid": "erDiagram\n  Member ||--o| MemberAvatar : has\n  MemberAvatar {\n    uniqueidentifier MemberId PK\n    nvarchar BlobPath\n    datetime2 UpdatedAt\n  }"}], "sources": {"pm_spec": null, "mocks": [], "refs": []}, "ac_text": {"AC-001-1": {"text": "# AC-001-1 成功上傳\nGiven 已登入會員,選擇 3MB 的 jpg\nWhen 送出上傳\nThen 回應 200 並回傳頭像 URL,個人頁顯示新頭像", "line": 12}, "AC-001-2": {"text": "# AC-001-2 檔案過大\nGiven 已登入會員,選擇 6MB 的 png\nWhen 送出上傳\nThen 回應 400 AVATAR_TOO_LARGE,舊頭像不變", "line": 17}, "AC-001-3": {"text": "# AC-001-3 儲存服務失敗\nGiven Blob 儲存服務逾時\nWhen 送出上傳\nThen 回應 503,舊頭像不變,記錄警報", "line": 22}, "AC-002-1": {"text": "# AC-002-1 裁切結果\nGiven 選擇 1200x800 圖片並框選 600x600\nWhen 確認裁切\nThen 送出的圖片為 600x600;框選小於 200x200 時不可確認", "line": 27}, "AC-003-1": {"text": "# AC-003-1 顯示\nGiven 會員沒有上傳過頭像\nWhen 開啟個人頁\nThen 顯示預設圖", "line": 32}}, "uc_text": {"UC-001": {"heading": "UC-001 上傳大頭貼(REQ-001)", "line": 4, "text": "- 主要參與者:會員\n- 觸發:會員在個人頁點「更換頭像」並選檔\n- 前置條件:已登入;檔案為 jpg/png\n- 後置條件(成功保證):Member.Avatar 指向新 BlobRef;舊 Blob 排程刪除;失敗時 Member.Avatar 不變\n- 主流程:\n  1. 會員送出檔案\n  2. 系統檢查格式與大小(≤ 5MB)\n  3. 系統存入 Blob,取得 BlobRef\n  4. 系統更新 Member.Avatar\n  5. 回傳頭像 URL\n- 替代流程:無\n- 例外流程:2a 檔案過大 → 400;3a Blob 逾時 → 重試 3 次後 503,Avatar 不變\n\n```mermaid\nflowchart TD\n  A[送出檔案] --> B{格式/大小 OK?}\n  B -->|否| E1[400 AVATAR_TOO_LARGE]\n  B -->|是| C[存 Blob]\n  C -->|逾時 x3| E2[503,Avatar 不變]\n  C -->|成功| D[更新 Member.Avatar] --> F[200 + URL]\n```"}, "UC-002": {"heading": "UC-002 裁切頭像(REQ-002)", "line": 27, "text": "- 主要參與者:會員\n- 觸發:選檔後進入裁切畫面\n- 前置條件:已選檔\n- 後置條件(成功保證):送出的影像為正方形且邊長 ≥ 200px\n- 主流程:\n  1. 顯示圖片與框選框\n  2. 會員拖曳框選\n  3. 確認後前端裁切並送出\n- 替代流程:取消 → 回到選檔\n- 例外流程:框選 < 200px → 確認鈕停用"}, "UC-003": {"heading": "UC-003 顯示頭像(REQ-003)", "line": 39, "text": "- 主要參與者:任何瀏覽個人頁的人\n- 觸發:開啟個人頁\n- 前置條件:無\n- 後置條件(成功保證):有頭像顯示 SAS URL;無頭像顯示預設圖\n- 主流程:\n  1. 查詢 Member.Avatar\n  2. 有 → 產生 SAS URL;無 → 預設圖 URL"}}, "screens": [], "ui_validation": [], "doc_paths": {"00-overview.md": "00-overview.md", "10-requirements.md": "10-requirements.md", "20-domain-model.md": "20-domain-model.md", "30-architecture-c4.md": "30-architecture-c4.md", "40-api-contracts.md": "40-api-contracts.md", "50-data-model.md": "50-data-model.md", "60-test-design.md": "60-test-design.md"}, "sa_files": [], "sa_artifacts": [], "sa_entities": [], "sa_roles": [], "sa_word_count": 0, "survey": [], "extract_errors": [], "boundary_checks": [{"rule": "B1", "rule_version": 1, "outcome": "linked", "target": "REQ-001", "status": "PASS", "evidence": "link → CMP-001, CMP-002, CMP-003, CMP-004", "action": "", "ids": ["REQ-001", "CMP-001", "CMP-002", "CMP-003", "CMP-004"]}, {"rule": "B1", "rule_version": 1, "outcome": "linked", "target": "REQ-002", "status": "PASS", "evidence": "link → CMP-003, CMP-005", "action": "", "ids": ["REQ-002", "CMP-003", "CMP-005"]}, {"rule": "B1", "rule_version": 1, "outcome": "linked", "target": "REQ-003", "status": "PASS", "evidence": "link → CMP-006", "action": "", "ids": ["REQ-003", "CMP-006"]}, {"rule": "B1", "rule_version": 1, "outcome": "linked", "target": "NFR-001", "status": "PASS", "evidence": "link → CMP-001", "action": "", "ids": ["NFR-001", "CMP-001"]}, {"rule": "B1", "rule_version": 1, "outcome": "linked", "target": "NFR-002", "status": "PASS", "evidence": "link → CMP-001, CMP-004", "action": "", "ids": ["NFR-002", "CMP-001", "CMP-004"]}, {"rule": "B2", "rule_version": 1, "outcome": "allowed", "target": "CMP-001", "status": "PASS", "evidence": "Api → CMP-002 (Application)", "action": "", "ids": ["CMP-001", "CMP-002"]},     var n=document.createElement('div');
    n.setAttribute('role','status');
    n.style.cssText='position:sticky;top:0;z-index:9;padding:8px 12px;background:var(--warnbg);color:var(--warn);border-bottom:1px solid var(--line);font-size:13px';
    n.textContent='圖表引擎(mermaid)無法從 CDN 載入,圖以原始碼顯示。封閉網路請用 spec-dev.py all --offline 產生內嵌版面板。';
    document.body.prepend(n);
  }
  if(window.mermaid){boot();return}
  var s=document.createElement('script');
  s.src='https://unpkg.com/mermaid@11.4.1/dist/mermaid.min.js';
  s.onload=function(){window.mermaid?boot():fail()};
  s.onerror=fail;
  document.head.appendChild(s);
})();
</script>
</body>
</html>
