<!doctype html>

<head>
<meta charset="utf-8">

<title>RD Spec 核對面板</title>
<style>
:root{--bg:#fff;--fg:#1f2328;--muted:#656d76;--line:#d0d7de;--head:#f6f8fa;--pass:#1a7f37;--warn:#9a6700;--fail:#cf222e;--passbg:#dafbe1;--warnbg:#fff8c5;--failbg:#ffebe9;--accent:#0969da}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--fg:#e6edf3;--muted:#8b949e;--line:#30363d;--head:#161b22;--pass:#3fb950;--warn:#d29922;--fail:#f85149;--passbg:#12261e;--warnbg:#2b2411;--failbg:#3a1d1f;--accent:#58a6ff}}
:root[data-theme="dark"]{--bg:#0d1117;--fg:#e6edf3;--muted:#8b949e;--line:#30363d;--head:#161b22;--pass:#3fb950;--warn:#d29922;--fail:#f85149;--passbg:#12261e;--warnbg:#2b2411;--failbg:#3a1d1f;--accent:#58a6ff}
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:0;padding:8px 12px;background:var(--head);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.sub{color:var(--muted);font-size:12px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.kpi{border:1px solid var(--line);border-radius:6px;padding:8px 10px}.kpi b{display:block;font-size:22px;line-height:1.1}.kpi span{font-size:12px;color:var(--muted)}
.kpi.fail b{color:var(--fail)}.kpi.warn b{color:var(--warn)}.kpi.pass b{color:var(--pass)}
section{border:1px solid var(--line);border-radius:6px;margin:12px 0;overflow:hidden}
.body{padding:10px 12px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}th{background:var(--head);font-weight:600;white-space:nowrap}
.grp th{text-align:center;font-size:11px;color:var(--muted)}
.cell{text-align:center;white-space:nowrap}.cell.empty{color:var(--line)}
.st{display:inline-block;padding:0 6px;border-radius:10px;font-size:11px;font-weight:600}
.PASS{background:var(--passbg);color:var(--pass)}.WARN{background:var(--warnbg);color:var(--warn)}.FAIL{background:var(--failbg);color:var(--fail)}.INFO{background:var(--head);color:var(--muted)}
tr.row{cursor:pointer}tr.row:hover td{background:var(--head)}tr.detail td{background:var(--bg);padding:10px 14px}
tr.detail .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:800px){tr.detail .grid{grid-template-columns:1fr}}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;white-space:pre}
.log{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.7}
.log div{padding:0 6px;white-space:pre}.log .low{background:var(--warnbg)}.log .fail{background:var(--failbg)}.log .dead{text-decoration:line-through;color:var(--muted)}
details>summary{cursor:pointer;list-style:none;user-select:none}details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";color:var(--muted)}details[open]>summary::before{content:"▾ "}
input[type=search]{font:inherit;padding:2px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}
.pre{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted);white-space:pre-wrap}
.two{display:grid;grid-template-columns:1fr 1.6fr;gap:12px}@media(max-width:900px){.two{grid-template-columns:1fr}}
small{color:var(--muted)}.mermaid{background:var(--bg);margin:6px 0;overflow-x:auto}.mermaid svg{max-width:100%;height:auto}
.evtbl{table-layout:fixed}.evtbl td{word-break:break-word;vertical-align:top}
.chain{font-size:12px;line-height:1.7}.chain .n{display:inline-block;padding:0 6px;border:1px solid var(--line);border-radius:4px;background:var(--head);font-family:ui-monospace,Menlo,monospace}.chain .m{color:var(--accent);font-family:ui-monospace,Menlo,monospace}.chain .ev{color:var(--muted)}
ul{margin:4px 0;padding-left:18px}
</style>
</head>

 in ReviewerIds] / add ReviewRecord\n  Pending --> Rejected: Reject [actor in ReviewerIds, reason>=10] / add ReviewRecord, notify submitter\n  Rejected --> Pending: Resubmit [actor == SubmitterId] / ResubmitCount++\n  Approved --> [*]"}, {"id": "STM-UI-001", "kind": "state", "file": "20-domain-model.md", "line": 78, "heading": "STM-UI-001 紀錄頁按鈕(REQ-001)", "req": "REQ-001", "mermaid": "stateDiagram-v2\n  [*] --> Pending\n  Pending --> Approved: 200 approve\n  Pending --> Rejected: 200 reject\n  Rejected --> Pending: 200 resubmit\n  note right of Pending: 修改=disabled;審核者看到核准/退回\n  note right of Rejected: 修改=enabled;重新送出=visible\n  note right of Approved: 全部 disabled"}, {"id": "CLS-001", "kind": "class", "file": "20-domain-model.md", "line": 101, "heading": "CLS-001 FormSubmission(REQ-002)", "req": "REQ-002", "mermaid": "classDiagram\n  class FormSubmission {\n    +Guid Id\n    +Guid FormId\n    +Guid SubmitterId\n    +SubmissionStatus Status\n    +int ResubmitCount\n    +Approve(reviewerId) ReviewRecord\n    +Reject(reviewerId, reason) SubmissionRejected\n    +Resubmit(answers)\n  }\n  class ReviewRecord { +Guid ReviewerId +Decision +string Reason +DateTime ReviewedAt }\n  class ReviewReminder { +Guid ReviewerId +DateOnly Date }\n  FormSubmission \"1\" *-- \"*\" ReviewRecord\n  FormSubmission \"1\" *-- \"*\" ReviewReminder"}, {"id": "C4-L1", "kind": "c4-context", "file": "30-architecture-c4.md", "line": 5, "heading": "C4-L1", "req": "*", "mermaid": "C4Context\n  Person(sub, \"填寫者\")\n  Person(rev, \"審核者\")\n  System(sys, \"表單系統\")\n  System_Ext(smtp, \"SMTP\")\n  Rel(sub, sys, \"送審、重送\")\n  Rel(rev, sys, \"核准、退回\")\n  Rel(sys, smtp, \"退回通知、逾時提醒\", \"INotifier\")"}, {"id": "C4-L2", "kind": "c4-container", "file": "30-architecture-c4.md", "line": 18, "heading": "C4-L2", "req": "*", "mermaid": "C4Container\n  Container(web, \"Forms Web\", \"React\", \"FormFill(modify)、ReviewPanel(new)\")\n  Container(api, \"Forms API\", \".NET 8\", \"Api/Application/Domain/Infrastructure\")\n  Container(job, \"ReviewReminderJob\", \".NET Hosted Service\", \"每日 09:00\")\n  ContainerDb(db, \"SQL Server\", \"\", \"Form, FormSubmission, ReviewRecord, ReviewReminder\")\n  System_Ext(smtp, \"SMTP\", \"\")\n  Rel(web, api, \"HTTPS\")\n  Rel(api, db, \"EF Core\")\n  Rel(job, db, \"EF Core\")\n  Rel(api, smtp, \"INotifier\")\n  Rel(job, smtp, \"INotifier\")"}, {"id": "C4-L3", "kind": "c4-component", "file": "30-architecture-c4.md", "line": 49, "heading": "C4-L3", "req": "*", "mermaid": "C4Component\n  Component(c1, \"SubmissionsController\", \"Api\")\n  Component(c2, \"ApproveSubmissionCommandHandler\", \"Application\")\n  Component(c3, \"RejectSubmissionCommandHandler\", \"Application\")\n  Component(c4, \"ResubmitSubmissionCommandHandler\", \"Application\")\n  Component(c9, \"PendingReviewsQueryHandler\", \"Application\")\n  Component(c8, \"ReviewReminderJob\", \"Application\")\n  Component(c5, \"FormSubmission\", \"Domain\")\n  Component(c6, \"SqlFormSubmissionRepository\", \"Infrastructure\", \"IFormSubmissionRepository\")\n  Component(c7, \"EmailNotifier\", \"Infrastructure\", \"INotifier\")\n  Component(c10, \"WorkdayCalendar\", \"Infrastructure\", \"IWorkdayCalendar\")\n  Rel(c1, c2, \"Send\") Rel(c1, c3, \"Send\") Rel(c1, c4, \"Send\") Rel(c1, c9, \"Send\")\n  Rel(c2, c5, \"Approve\") Rel(c3, c5, \"Reject\") Rel(c4, c5, \"Resubmit\")\n  Rel(c2, c6, \"\") Rel(c3, c6, \"\") Rel(c4, c6, \"\") Rel(c9, c6, \"\")\n  Rel(c3, c7, \"notify submitter\")\n  Rel(c8, c6, \"ListOverdue\") Rel(c8, c7, \"remind\") Rel(c8, c10, \"workdays\")"}, {"id": "SEQ-001", "kind": "sequence", "file": "30-architecture-c4.md", "line": 99, "heading": "SEQ-001 審核(UC-002 / REQ-002)", "req": "REQ-002", "mermaid": "sequenceDiagram\n  actor R as Reviewer\n  participant C as SubmissionsController\n  participant H as RejectSubmissionCommandHandler\n  participant Repo as IFormSubmissionRepository\n  participant S as FormSubmission\n  participant N as INotifier\n  R->>C: POST /submissions/{id}/reject {reason}\n  C->>H: Send(RejectSubmissionCommand)\n  H->>Repo: GetAsync(id)\n  alt Status != Pending\n    H-->>C: InvalidState\n    C-->>R: 409\n  else actor not in Form.ReviewerIds\n    H-->>C: Forbidden\n    C-->>R: 403\n  else\n    H->>S: Reject(actor, reason)\n    alt reason < 10\n      S-->>H: DomainException REASON_TOO_SHORT\n      C-->>R: 400\n    else\n      S-->>H: SubmissionRejected\n      H->>Repo: SaveAsync\n      H->>N: NotifyAsync(submitter, \"rejected\")\n      C-->>R: 200\n    end\n  end"}, {"id": "SEQ-002", "kind": "sequence", "file": "30-architecture-c4.md", "line": 131, "heading": "SEQ-002 逾時提醒(UC-004 / REQ-004)", "req": "REQ-004", "mermaid": "sequenceDiagram\n  participant J as ReviewReminderJob\n  participant W as IWorkdayCalendar\n  participant Repo as IFormSubmissionRepository\n  participant S as FormSubmission\n  participant N as INotifier\n  J->>W: Subtract(today, 3)\n  J->>Repo: ListOverdueAsync(cutoff)\n  loop each submission\n    J->>S: RemindersDueToday(reviewerIds, today)\n    loop each reviewer not yet reminded\n      J->>N: NotifyAsync(reviewer, \"overdue\")\n      alt notify fails\n        J->>J: log, skip reminder record\n      else\n        J->>S: AddReminder(reviewer, today)\n      end\n    end\n    J->>Repo: SaveAsync\n  end"}, {"id": "ERD-001", "kind": "erd", "file": "50-data-model.md", "line": 5, "heading": "ERD-001", "req": "*", "mermaid": "erDiagram\n  Form ||--o{ FormSubmission : has\n  FormSubmission ||--o{ ReviewRecord : reviewed\n  FormSubmission ||--o{ ReviewReminder : reminded\n  Form {\n    uniqueidentifier Id PK\n    nvarchar ReviewerIds\n  }\n  FormSubmission {\n    uniqueidentifier Id PK\n    int Status\n    int ResubmitCount\n  }\n  ReviewRecord {\n    uniqueidentifier Id PK\n    uniqueidentifier SubmissionId FK\n    uniqueidentifier ReviewerId\n    int Decision\n    nvarchar Reason\n    datetime2 ReviewedAt\n  }\n  ReviewReminder {\n    uniqueidentifier SubmissionId FK\n    uniqueidentifier ReviewerId\n    date Date\n  }"}], "sources": {"pm_spec": {"path": "specs/in-progress/issue-c/pm-spec.md", "exists": true, "sections": [{"anchor": "PM§issue-c 表單審核流程(PM spec)", "title": "issue-c 表單審核流程(PM spec)", "level": 1, "line": 1, "text": ""}, {"anchor": "PM§1", "title": "背景與目標", "level": 2, "line": 3, "text": "表單填寫送出後目前直接生效(issue-b)。部門主管要求送出的表單必須經審核才算完成。目標:上線後三個月內,需審核表單的平均處理時間 < 2 個工作天。"}, {"anchor": "PM§2", "title": "使用者與情境", "level": 2, "line": 6, "text": "- 填寫者:送出表單後想知道審核進度;被退回時要能修改後重送。\n- 審核者:每天看待審清單,核准或退回並寫理由。\n- 系統:逾時未審核要提醒審核者。"}, {"anchor": "PM§3", "title": "功能需求", "level": 2, "line": 11, "text": ""}, {"anchor": "PM§3.1", "title": "送審", "level": 3, "line": 12, "text": "填寫者送出表單後,該筆填寫紀錄進入「待審核」。待審核期間填寫者不可修改內容。"}, {"anchor": "PM§3.2", "title": "審核", "level": 3, "line": 15, "text": "審核者可對待審核紀錄「核准」或「退回」。退回必須填理由(至少 10 字)。核准或退回後要留下審核紀錄(誰、何時、結果、理由)。"}, {"anchor": "PM§3.3", "title": "退回後重送", "level": 3, "line": 18, "text": "被退回的紀錄,填寫者可修改答案後重新送出,再次進入待審核。已核准的紀錄不可再修改。"}, {"anchor": "PM§3.4", "title": "逾時提醒", "level": 3, "line": 21, "text": "待審核超過 3 個工作天,系統每天提醒審核者一次,直到處理完畢。"}, {"anchor": "PM§4", "title": "非功能需求", "level": 2, "line": 24, "text": "- 審核操作要快。\n- 審核紀錄要保留,不可刪除。\n- 只有被指派為該表單審核者的人可以審核。"}, {"anchor": "PM§5", "title": "驗收條件", "level": 2, "line": 29, "text": "- 送出後狀態顯示「待審核」,編輯按鈕不可用。\n- 退回未填理由或理由少於 10 字,送出被拒絕。\n- 核准後可在紀錄頁看到審核者與時間。\n- 逾時 3 個工作天的待審核紀錄,審核者隔天收到提醒。"}], "lines": 33}, "mocks": [{"path": "specs/in-progress/issue-c/mock/approval.html", "exists": true, "html": "<!doctype html><html lang=\"zh-Hant\"><meta charset=\"utf-8\"><title>mock: 審核</title>\n<body style=\"font-family:system-ui\">\n<h2>填寫紀錄 #1234 <span id=\"status\" data-state=\"pending\">待審核</span></h2>\n<!-- 狀態:pending(待審核) / approved(已核准) / rejected(已退回) -->\n<section id=\"answers\"><label>部門 <input name=\"dept\" disabled></label></section>\n<section id=\"submitter-actions\"><button id=\"edit\" disabled>修改</button><button id=\"resubmit\" hidden>重新送出</button></section>\n<section id=\"reviewer-actions\">\n  <button id=\"approve\">核准</button>\n  <button id=\"reject\">退回</button>\n  <textarea id=\"reason\" placeholder=\"退回理由(至少 10 字)\" minlength=\"10\"></textarea>\n</section>\n<section id=\"history\"><h3>審核紀錄</h3><ul><li>2026-10-01 王審核 退回:缺少附件說明</li></ul></section>\n</body></html>\n"}], "refs": [{"path": "specs/in-progress/issue-c/refs.md", "exists": true}, {"path": "docs/architectures/overview.md", "exists": true}, {"path": "docs/guidelines/coding.md", "exists": true}]}, "ac_text": {"AC-001-1": {"text": "# AC-001-1 送出後待審核\nGiven 已發布表單,填寫者填妥必填欄位\nWhen 送出\nThen 回 200,紀錄狀態 = Pending,個人頁顯示「待審核」", "line": 13}, "AC-001-2": {"text": "# AC-001-2 待審核不可修改\nGiven 狀態 = Pending 的紀錄\nWhen 填寫者嘗試修改答案\nThen 回 409 SUBMISSION_LOCKED,答案不變", "line": 18}, "AC-002-1": {"text": "# AC-002-1 核准\nGiven 狀態 = Pending,操作者是該表單指派審核者\nWhen 核准\nThen 狀態 = Approved,新增 ReviewRecord(審核者、時間、Approved)", "line": 23}, "AC-002-2": {"text": "# AC-002-2 退回理由不足\nGiven 狀態 = Pending\nWhen 退回且理由 < 10 字\nThen 回 400 REASON_TOO_SHORT,狀態不變,無 ReviewRecord", "line": 28}, "AC-002-3": {"text": "# AC-002-3 退回\nGiven 狀態 = Pending,理由 ≥ 10 字\nWhen 退回\nThen 狀態 = Rejected,新增 ReviewRecord(含理由),通知填寫者", "line": 33}, "AC-003-1": {"text": "# AC-003-1 重送\nGiven 狀態 = Rejected,填寫者修改答案\nWhen 重新送出\nThen 狀態 = Pending,ResubmitCount + 1", "line": 38}, "AC-003-2": {"text": "# AC-003-2 已核准不可改\nGiven 狀態 = Approved\nWhen 填寫者嘗試修改或重送\nThen 回 409 SUBMISSION_LOCKED", "line": 43}, "AC-004-1": {"text": "# AC-004-1 逾時提醒\nGiven 狀態 = Pending 已超過 3 個工作天,今日尚未提醒\nWhen 每日排程執行\nThen 對每位指派審核者發出提醒,寫入 ReviewReminder", "line": 48}, "AC-004-2": {"text": "# AC-004-2 同日不重複\nGiven 今日已提醒\nWhen 排程再次執行\nThen 不再發出提醒", "line": 53}}, "uc_text": {"UC-001": {"heading": "UC-001 送審(REQ-001)", "line": 4, "text": "- 主要參與者:Submitter\n- 觸發:填寫者送出答案\n- 前置條件:表單已發布;必填欄位齊全(issue-b 既有規則)\n- 後置條件(成功保證):FormSubmission.Status = Pending;SubmittedAt 更新;填寫者端不可編輯\n- 主流程:\n  1. 建立 FormSubmission(既有)\n  2. Status 設為 Pending(新)\n- 替代流程:無\n- 例外流程:必填缺漏 → 400(既有)"}, "UC-002": {"heading": "UC-002 審核(REQ-002)", "line": 15, "text": "- 主要參與者:Reviewer\n- 觸發:審核者在待審清單選一筆,核准或退回\n- 前置條件:Status = Pending;操作者 ∈ Form.ReviewerIds\n- 後置條件(成功保證):Status ∈ {Approved, Rejected};新增一筆不可變 ReviewRecord;Rejected 時填寫者收到通知\n- 主流程:\n  1. 載入 FormSubmission 與 Form\n  2. 檢查操作者是指派審核者\n  3. Approve 或 Reject(reason)\n  4. 儲存;Rejected → INotifier 通知填寫者\n- 替代流程:無\n- 例外流程:3a 理由 < 10 字 → 400 REASON_TOO_SHORT;2a 非審核者 → 403;1a Status ≠ Pending → 409\n\n```mermaid\nflowchart TD\n  A[載入紀錄] --> B{Status = Pending?}\n  B -->|否| E1[409 INVALID_STATE]\n  B -->|是| C{操作者是審核者?}\n  C -->|否| E2[403]\n  C -->|核准| D[Status=Approved + ReviewRecord]\n  C -->|退回| F{理由 ≥ 10 字?}\n  F -->|否| E3[400 REASON_TOO_SHORT]\n  F -->|是| G[Status=Rejected + ReviewRecord] --> H[通知填寫者]\n```"}, "UC-003": {"heading": "UC-003 重送(REQ-003)", "line": 40, "text": "- 主要參與者:Submitter\n- 觸發:填寫者修改答案後重新送出\n- 前置條件:Status = Rejected;操作者 = SubmitterId\n- 後置條件(成功保證):Status = Pending;ResubmitCount + 1;Answers 更新\n- 主流程:\n  1. 載入 FormSubmission\n  2. 驗證答案(既有必填規則)\n  3. Resubmit(answers)\n- 替代流程:無\n- 例外流程:Status ∈ {Pending, Approved} → 409 SUBMISSION_LOCKED"}, "UC-004": {"heading": "UC-004 逾時提醒(REQ-004)", "line": 52, "text": "- 主要參與者:System(每日排程)\n- 觸發:每日 09:00\n- 前置條件:無\n- 後置條件(成功保證):每筆逾時 Pending 紀錄,今日對每位審核者恰好提醒一次,且寫入 ReviewReminder\n- 主流程:\n  1. 查詢 Pending 且 SubmittedAt + 3 工作天 < 今日 的紀錄\n  2. 排除今日已提醒者\n  3. 經 INotifier 發提醒;寫 ReviewReminder\n- 替代流程:無\n- 例外流程:INotifier 失敗 → 記 log、該筆不寫 ReviewReminder,隔日重試"}}, "sa_files": ["sa/01-break-words.md", "sa/02-entities-relations.md", "sa/03-roles.md", "sa/04-usecase.md", "sa/05-activity.md", "sa/06-sequence.md", "sa/07-state.md", "survey-mapping.md"], "sa_artifacts": [{"id": "CLS-SA-001", "kind": "class", "file": "sa/02-entities-relations.md", "line": 23, "heading": "CLS-SA-001 實體關係(REQ-001)", "req": "REQ-001", "mermaid": "classDiagram\n  class Form { +Id +Title +Status +OwnerId +ReviewerIds }\n  class FormSubmission { +Id +FormId +SubmitterId +Answers +Status +ResubmitCount +Submit() +Approve() +Reject() +Resu h+=`<div class="kpis">
<div class="kpi"><b>${K.req_count}</b><span>需求 (REQ+NFR)</span></div>
<div class="kpi"><b>${K.component_count}</b><span>技術元件</span></div>
<div class="kpi"><b>${K.test_count}</b><span>測試元件</span></div>
<div class="kpi ${K.boundary_fail?'fail':(K.boundary_warn?'warn':'pass')}"><b>${K.boundary_pass}/${K.boundary_total}</b><span>技術邊界 PASS · FAIL ${K.boundary_fail} · WARN ${K.boundary_warn}</span></div>
<div class="kpi ${K.uncovered_req?'fail':'pass'}"><b>${K.uncovered_req}</b><span>未覆蓋需求 ${(K.uncovered_ids||[]).join(' ')}</span></div>
<div class="kpi ${K.open_gaps?'warn':'pass'}"><b>${K.open_gaps}</b><span>待 PM 確認缺口 · assumed ${K.assumed}</span></div></div>`;

// ---- E. 證據鏈:PM 證據 → 轉換證據(預設隱藏)→ RD 證據,全部內嵌 ----
const SRC=T.sources||{},PMS=(SRC.pm_spec&&SRC.pm_spec.sections)||[],MOCKS=SRC.mocks||[],ACT=T.ac_text||{},UCT=T.uc_text||{};
const pmFile=SRC.pm_spec?SRC.pm_spec.path:'';
const pmSec=src=>{if(!src)return null;const key=String(src).trim();return PMS.find(x=>x.anchor===key)||PMS.find(x=>key.startsWith(x.anchor+' ')||key.startsWith(x.anchor+'('))||PMS.find(x=>key.startsWith(x.anchor))||null};
const loc=(f,l)=>`<span class="mono" style="color:var(--muted)">${esc(f)}${l?':L'+l:''}</span>`;
const mockView=m=>m.html?`<iframe sandbox="" srcdoc="${esc(m.html)}" style="width:100%;height:240px;border:1px solid var(--line);border-radius:4px;background:#fff"></iframe>`:(m.data_uri?`<img src="${m.data_uri}" style="max-width:100%;border:1px solid var(--line)">`:(m.text?`<pre class="pre">${esc(m.text)}</pre>`:`<small>${m.exists?'(無法內嵌)':'(檔案不存在)'}</small>`));
const artsOf=r=>({sa:(T.sa_artifacts||[]).filter(a=>a.req===r.id),rd:(T.artifacts||[]).filter(a=>a.req===r.id)});
const mocksOf=r=>{const ids=new Set([r.id,...artsOf(r).sa.map(a=>a.id),...artsOf(r).rd.map(a=>a.id)]);return MOCKS.filter(m=>(T.io_map||[]).some(row=>row.in.includes(m.path.split('/').pop())&&row.out.some(o=>[...ids].some(i=>o.includes(i)))))};
if(PMS.length||MOCKS.length){
h+=`<section><h2>E. 證據鏈 <small>PM 證據 → 轉換證據(▸ 預設隱藏)→ RD 證據 · 全部內嵌,不用切畫面</small></h2><div class="body">`;
h+=`<details><summary>PM 素材全文 <small>${esc(pmFile)} ${SRC.pm_spec&&SRC.pm_spec.lines?SRC.pm_spec.lines+' 行':''} · mock ${MOCKS.length} · 參考 ${(SRC.refs||[]).length}</small></summary>
<div class="grid">${PMS.length?`<div><pre class="pre" style="color:var(--fg)">${PMS.map(x=>`${'#'.repeat(x.level)} ${esc(x.anchor)} ${esc(x.title)}  <small>(L${x.line})</small>\n${esc(x.text)}\n`).join('\n')}</pre></div>`:'<div><small>00-overview.md「## 來源」未指定 PM spec 路徑,或檔案不存在</small></div>'}
<div>${MOCKS.map(m=>`<b>${esc(m.path)}</b>${mockView(m)}`).join('')}${(SRC.refs||[]).length?`<b>參考</b><ul>${SRC.refs.map(r=>`<li class="mono">${esc(r.path)}${r.exists?'':' <small>(不存在)</small>'}</li>`).join('')}</ul>`:''}</div></div></details>`;
h+=`<table class="evtbl"><colgroup><col style="width:32%"><col style="width:30%"><col style="width:38%"></colgroup><tr><th>證據鏈 · PM 證據(文字 / 圖 · 位置)</th><th>分析鏈 ▸ · 邏輯鏈 ▸(預設收合)</th><th>證據鏈 · RD 證據(AC / UC / 元件 / 測試 · 位置)</th></tr>`;
const chainOf=r=>{const logs=live.filter(e=>e.req===r.id).sort((a,b)=>a.seq-b.seq);
  return logs.map(e=>`<div><span class="n">${esc(e.in)}</span> ─<span class="m">[${esc(e.stage)} ${esc(e.method)}${e.rule?' · '+esc(e.rule):''}]</span>→ <span class="n">${esc(e.out)}</span> <span class="ev">ev=${esc(e.evidence||'?')}${(e.gaps||[]).length?' gap: '+esc(e.gaps.join('; ')):''}${e.note?' · '+esc(e.note):''}</span></div>`).join('')||'<small>(無 log)</small>'};
const logicOf=r=>{const ids=idsOf(r);const cs=cmpsOf(r);for(const c of cs)ids.add(c);
  const g=G.filter(x=>(x.ids||[]).some(i=>ids.has(i))),b=BC.filter(x=>(x.ids||[]).some(i=>ids.has(i)));
  const row=(st,rule,target,ev,act)=>`<tr><td>${badge(st)}</td><td><small>${esc(rule)}</small></td><td><small>${esc(target)}</small></td><td><small>${esc(ev)}${act?'<br>處置:'+esc(act):''}</small></td></tr>`;
  const all=[...g.map(x=>row(x.level,x.rule,(x.ids||[])[0]||'',x.msg,x.action)),...b.map(x=>row(x.status,x.rule,x.target,x.evidence,x.action))];
  const why=status(r)==='PASS'?`所有命中規則皆 PASS/INFO(${b.length} 條邊界、${g.length} 條 Gate)`:(status(r)==='FAIL'?'有規則 FAIL,見下':'有規則 WARN,見下');
  return `<small>${why}</small><table>${all.join('')||'<tr><td><small>無</small></td></tr>'}</table>`};
for(const r of (T.requirements||[])){
  const sec=pmSec(r.source),mk=mocksOf(r),A=artsOf(r),st=status(r);
  const pm=sec?`${loc(pmFile,sec.line)}<br><b>${esc(sec.anchor)} ${esc(sec.title)}</b><pre class="pre" style="color:var(--fg)">${esc(sec.text)}</pre>`:`<small>來源錨點「${esc(r.source)}」在 PM spec 找不到對應段落</small>`;
  const pmMock=mk.map(m=>`<details><summary><small>mock · ${esc(m.path.split('/').pop())}</small></summary>${mockView(m)}</details>`).join('');
  const roles=(T.sa_roles||[]).filter(x=>x.reqs.includes(r.id)),cs=cmpsOf(r);
  const ents=(T.sa_entities||[]).filter(e=>e.en&&cs.some(c=>(cmp[c]?.name||'').includes(e.en)));
  const logs=live.filter(e=>e.req===r.id);
  const mid=`<details><summary><b>分析鏈</b> <small>${logs.length} 步 · 角色動作 ${roles.length} · 實體 ${ents.length} · SA 圖 ${A.sa.length} · RD 圖 ${A.rd.length}</small></summary>
    ${roles.length?`<small><b>SA3 角色→動作</b></small><ul>${roles.map(x=>`<li><small>${esc(x.role)} → ${esc(x.action)} <i>${esc(x.flow)}</i></small></li>`).join('')}</ul>`:''}
    ${ents.length?`<small><b>SA2 實體</b> ${ents.map(e=>esc(e.name)+'('+esc(e.en)+')').join('、')}</small><br>`:''}
    <small><b>方法論步驟</b></small><div class="chain">${chainOf(r)}</div>
    ${A.sa.map(mer).join('')}${A.rd.map(mer).join('')}</details>
    <details><summary><b>邏輯鏈</b> <small>為什麼是 ${st}</small></summary>${logicOf(r)}</details>`;
  const acRows=r.acs.map(a=>{const t=ACT[a];const ls=(T.ac_links||[]).filter(l=>l.ac===a);const tt=(T.tests||[]).filter(x=>x.acs.includes(a));
    return `<div style="margin:4px 0;padding:4px 6px;border-left:3px solid var(--line)"><b>${esc(a)}</b> ${t?loc('10-requirements.md',t.line):''}<pre class="pre" style="color:var(--fg);margin:2px 0">${esc(t?t.text:(r.measure?'量測:'+r.measure+(r.stimulus_source?' · 刺激來源:'+r.stimulus_source:''):'(無 gherkin)'))}</pre>
      <small>元件:${ls.length?ls.map(l=>`${esc(l.component)} <i>${esc(l.role)}</i> ${loc('30',l.line)}`).join(' · '):(r.binds?.length?'NFR 綁定 '+r.binds.map(esc).join(', '):badge('WARN'))}</small><br>
      <small>測試:${tt.length?tt.map(x=>`${esc(x.id)} ${loc('60',x.line)}`).join(' · '):badge('FAIL')+' 無'}</small></div>`}).join('');
  const ucs=Object.entries(UCT).filter(([k,v])=>v.heading.includes(r.id)).map(([k,v])=>`<details><summary><small>${esc(v.heading)} ${loc('20-domain-model.md',v.line)}</small></summary><pre class="pre" style="color:var(--fg)">${esc(v.text)}</pre></details>`).join('');
  const apis=(T.apis||[]).filter(a=>a.reqs.includes(r.id)||a.nfrs.includes(r.id)).map(a=>`<small>${esc(a.id)} ${esc(a.method)} <span class="mono">${esc(a.path)}</span> ${loc('40',a.line)}</small>`).join('<br>');
  h+=`<tr><td>${badge(st)} <b>${esc(r.id)}</b> <small>${esc(r.title)}</small><br>${pm}${pmMock}</td><td>${mid}</td><td>${loc(r.file||'10-requirements.md',r.line)}${acRows}${ucs}${apis}</td></tr>`;
}
h+=`</table></div></section>`;
}
h+=`<div class="two"><section><h2>A. 輸入 ↔ 輸出</h2><div class="body"><table><tr><th>PM spec / mock</th><th>RD spec 產物</th></tr>`;
for(const m of (T.io_map||[]))h+=`<tr><td>${esc(m.in)}</td><td>${m.out.map(esc).join(', ')}</td></tr>`;
h+=`</table>${(T.gaps||[]).length?`<details><summary>待 PM 確認缺口 (${T.gaps.length})</summary><table><tr><th>#</th><th>問題</th><th>影響</th><th>暫時假設</th></tr>${T.gaps.map(g=>`<tr><td>${esc(g.n)}</td><td>${esc(g.question)}</td><td>${g.reqs.map(esc).join(', ')}</td><td>${esc(g.assumption)}</td></tr>`).join('')}</table></details>`:''}</div></section>
<section><h2>Gate 問題 <small>FAIL ${G.filter(g=>g.level==='FAIL').length} · WARN ${G.filter(g=>g.level==='WARN').length} · INFO ${G.filter(g=>g.level==='INFO').length}</small></h2><div class="body">`;
const gRow=g=>`<tr><td>${badge(g.level)}</td><td><small>${esc(g.rule)}</small></td><td>${esc(g.msg)}</td></tr>`;
const gBad=G.filter(g=>g.level!=='INFO'),gInfo=G.filter(g=>g.level==='INFO');
h+=gBad.length?`<table>${gBad.map(gRow).join('')}</table>`:'<small>無 FAIL/WARN</small>';
if(gInfo.length)h+=`<details><summary>INFO(已驗證/齊全)${gInfo.length} 筆</summary><table>${gInfo.map(gRow).join('')}</table></details>`;
h+=`</div></section></div>`;

// ---- SA 建模素材(分析 log 圖,預設收合)----
const SA=T.sa_artifacts||[],SAF=T.sa_files||[];
if(SAF.length){
  const byFile={};for(const a of SA)(byFile[a.file]=byFile[a.file]||[]).push(a);
  h+=`<section><h2>SA 建模素材 <small>${SAF.length} 個步驟檔 · ${SA.length} 張圖 · 實體 ${(T.sa_entities||[]).length} · 角色動作 ${(T.sa_roles||[]).length} · 斷詞 ${T.sa_word_count||0}</small></h2><div class="body">`;
  h+=`<details><summary>實體(SA2)</summary><table><tr><th>實體</th><th>英文</th><th>屬性</th><th>來源詞</th></tr>${(T.sa_entities||[]).map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.en)}</td><td><small>${esc(e.attrs)}</small></td><td><small>${esc(e.source)}</small></td></tr>`).join('')}</table></details>`;
  h+=`<details><summary>角色與動作(SA3)</summary><table><tr><th>角色</th><th>動作</th><th>流程</th><th>REQ</th></tr>${(T.sa_roles||[]).map(r=>`<tr><td>${esc(r.role)}</td><td>${esc(r.action)}</td><td><small>${esc(r.flow)}</small></td><td>${r.reqs.map(esc).join(', ')}</td></tr>`).join('')}</table></details>`;
  for(const f of SAF){const arts=byFile[f]||[];h+=`<details><summary>${esc(f)} <small>${arts.length} 張圖</small></summary>${arts.map(mer).join('')||'<small>(無圖)</small>'}</details>`}
  h+=`</div></section>`;
}
// ---- 詞彙表(跨 spec)----
const GL=T.glossary||{};
if((GL.terms||[]).length){
  h+=`<section><h2>詞彙表(跨 spec) <small>${GL.terms.length} 詞 · 衝突 ${(GL.conflicts||[]).length} · ${esc(GL.path||'')}</small></h2><div class="body">`;
  if((GL.conflicts||[]).length)h+=`<table><tr><th>名詞</th><th>符號 A</th><th>來源 A</th><th>符號 B</th><th>來源 B</th></tr>${GL.conflicts.map(c=>`<tr><td>${badge('FAIL')} ${esc(c.term)}</td><td>${esc(c.symbol_a)}</td><td><small>${esc(c.source_a)}</small></td><td>${esc(c.symbol_b)}</td><td><small>${esc(c.source_b)}</small></td></tr>`).join('')}</table>`;
  h+=`<details><summary>全部詞彙</summary><table><tr><th>名詞</th><th>符號</th><th>定義</th><th>來源 spec</th><th>來源</th></tr>${GL.terms.map(t=>`<tr><td>${esc(t.term)}</td><td class="mono">${esc(t.symbol)}</td><td><small>${esc(t.definition)}</small></td><td><small>${(t.specs||[]).map(esc).join(', ')}</small></td><td class="mono"><small>${esc(t.source)}</small></td></tr>`).join('')}</table></details></div></section>`;
}
// ---- Survey Mapping ----
const SV=T.survey||[];
if(SV.length){
  const cnt=s=>SV.filter(r=>r.status===s).length;
  h+=`<section><h2>Survey Mapping <small>模型 ↔ codebase · existing ${cnt('existing')} · modify ${cnt('modify')} · new ${cnt('new')}</small></h2><div class="body"><table><tr><th>模型元素</th><th>類型</th><th>狀態</th><th>對應 codebase</th><th>證據</th><th>說明</th></tr>`;
  for(const r of SV){const g=G.find(x=>x.rule==='G-SV-evidence'&&(x.ids||[]).includes(r.element));h+=`<tr><td>${esc(r.element)}</td><td><small>${esc(r.kind)}</small></td><td><span class="st ${r.status==='new'?'WARN':(r.status==='modify'?'WARN':'PASS')}" style="${r.status==='new'?'background:var(--head);color:var(--fg)':''}">${esc(r.status)}</span>${g?' '+badge(g.level):''}</td><td><small>${esc(r.target)}</small></td><td class="mono">${esc(r.evidence)}</td><td><small>${esc(r.note)}</small></td></tr>`}
  h+=`</table></div></section>`;
}

h+=`<section><h2>B. 需求 × 技術元件 × 測試元件 <small>點列展開明細</small></h2><div class="body"><table>
<tr class="grp"><th rowspan="2">需求</th><th rowspan="2">型態</th><th colspan="${LAYERS.length}">技術元件 (layer)</th><th colspan="${KINDS.length}">測試元件 (kind)</th><th rowspan="2">狀態</th></tr>
<tr>${LAYERS.map(l=>`<th>${l}</th>`).join('')}${KINDS.map(k=>`<th>${k}</th>`).join('')}</tr>`;
for(const r of (T.requirements||[])){

  const lc=LAYERS.map(L=>{const ids=cs.filter(id=>cmp[id]?.layer===L);return `<td class="cell${ids.length?'':' empty'}">${ids.length?ids.map(esc).join('<br>'):'·'}</td>`}).join('');
  const tc=KINDS.map(Kd=>{const ids=ts.filter(t=>t.kind===Kd).map(t=>t.id);return `<td class="cell${ids.length?'':' empty'}">${ids.length?ids.map(esc).join('<br>'):'·'}</td>`}).join('');
  h+=`<tr class="row" data-id="${esc(r.id)}"><td><b>${esc(r.id)}</b><br><small>${esc(r.title)}</small></td><td><small>${(r.types||[]).map(esc).join('<br>')}</small></td>${lc}${tc}<td class="cell">${badge(st)}</td></tr>`;
  const acRows=r.acs.map(a=>{const ls=(T.ac_links||[]).filter(l=>l.ac===a);const tt=(T.tests||[]).filter(t=>t.acs.includes(a)).map(t=>t.id);
    return `<tr><td>${esc(a)}</td><td>${ls.length?ls.map(l=>`${esc(l.component)} <small>${esc(l.role)}</small>`).join('<br>'):(r.binds?.length?'<small>NFR 綁定 '+r.binds.map(esc).join(', ')+'</small>':badge('WARN')+' 未指定元件')}</td><td>${tt.length?tt.map(esc).join(', '):badge('FAIL')+' 無測試'}</td></tr>`}).join('');
  const bcs=bcOf(r),arts=(T.artifacts||[]).filter(a=>a.req===r.id);
  h+=`<tr class="detail" data-for="${esc(r.id)}" hidden><td colspan="${3+LAYERS.length+KINDS.length}"><div class="grid">
<div><b>來源</b> ${esc(r.source)}${r.measure?` · <b>量測</b> ${esc(r.measure)}`:''}<br>
<b>AC → 技術元件(職責)→ 測試</b><table><tr><th>AC</th><th>CMP</th><th>TST</th></tr>${acRows}</table>
<b>技術邊界</b><table>${bcs.map(b=>`<tr><td>${esc(b.rule)}</td><td>${esc(b.target)}</td><td>${badge(b.status)}</td><td>${esc(b.evidence)}${b.action?'<br><small>處置:'+esc(b.action)+'</small>':''}</td></tr>`).join('')||'<tr><td>無</td></tr>'}</table></div>
<div><b>方法論 log</b><div class="log">${live.filter(e=>e.req===r.id).map(logLine).join('')||'<div>(0 筆)</div>'}</div>${arts.map(mer).join('')}</div>
</div></td></tr>`;

const global=(T.artifacts||[]).filter(a=>a.req==='*');
if(global.length){h+=`<section><h2>架構圖 <small>跨需求 ${global.length} 張</small></h2><div class="body">${global.map(mer).join('')}</div></section>`}

document.getElementById('lf').addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#logbox div').forEach(d=>d.style.display=d.dataset.k.toLowerCase().includes(q)?'':'none')});
})();
