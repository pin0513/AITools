.evg h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}

.loc{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted);word-break:break-all}

rces": {"pm_spec": {"path": "specs/in-progress/room-booking/pm-spec.md", "exists": true, "sections": [{"anchor": "PM§Meeting room booking (PM spec)", "title": "Meeting room booking (PM spec)", "level": 1, "line": 1, "text": ""}, {"anchor": "PM§1", "title": "Background and Goals", "level": 2, "line": 3, "text": "An employee books a meeting room by email today and double booking happens weekly. Goal: self-service book with conflict checks and automatic release."}, {"anchor": "PM§2", "title": "Users", "level": 2, "line": 6, "text": "employee: wants to book a meeting room. admin: needs the daily view. system: will release no-show booking records."}, {"anchor": "PM§3", "title": "Functional Requirements", "level": 2, "line": 9, "text": ""}, {"anchor": "PM§3.1", "title": "An employee can book a meeting room without overlapping time slot", "level": 3, "line": 10, "text": "An employee can book a meeting room for a time slot. Two booking records on the same meeting room must not overlap. A new booking is booked and is synced to the calendar service."}, {"anchor": "PM§3.2", "title": "check in within 15 minutes or the system will release the meeting room", "level": 3, "line": 13, "text": "The employee must check in within 15 minutes after the start. Otherwise the system will release the booking, marks it released and updates the calendar service."}, {"anchor": "PM§3.3", "title": "An admin can view daily booking records", "level": 3, "line": 16, "text": "An admin can view all booking records of a day for every meeting room."}, {"anchor": "PM§4", "title": "Non-functional Requirements", "level": 2, "line": 19, "text": "With 100 concurrent requests for the same time slot, exactly one booking succeeds."}, {"anchor": "PM§5", "title": "Acceptance", "level": 2, "line": 22, "text": "- the time slot is free → the employee books the meeting room → a booking is booked\n- the time slot overlaps another booking → the employee books the meeting room → the response is 409 SLOT_TAKEN\n- a booking is booked → the employee checks in within 15 minutes → the booking is checked-in\n- no check in after 15 minutes → the system job runs → the booking is released and the calendar service is updated\n- booking records exist today → the admin opens the daily view → rows are grouped by meeting room"}], "lines": 27}, "mocks": [], "refs": [{"path": "specs/in-progress/room-booking/refs.md", "exists": true}]}, "ac_text": {"AC-001-1": {"text": "# AC-001-1\nGiven the time slot is free\nWhen the employee books the meeting room\nThen a booking is booked", "line": 12}, "AC-001-2": {"text": "# AC-001-2\nGiven the time slot overlaps another booking\nWhen the employee books the meeting room\nThen the response is 409 SLOT_TAKEN", "line": 17}, "AC-002-1": {"text": "# AC-002-1\nGiven a booking is booked\nWhen the employee checks in within 15 minutes\nThen the booking is checked-in", "line": 22}, "AC-002-2": {"text": "# AC-002-2\nGiven no check in after 15 minutes\nWhen the system job runs\nThen the booking is released and the calendar service is updated", "line": 27}, "AC-003-1": {"text": "# AC-003-1\nGiven booking records exist today\nWhen the admin opens the daily view\nThen rows are grouped by meeting room", "line": 32}}, "uc_text": {"UC-001": {"heading": "UC-001 An employee can book a meeting room without overlapping time slot (REQ-001)", "line": 4, "text": "- Primary actor: employee\n- Trigger: the employee books the meeting room\n- Precondition: the time slot is free\n- Postcondition (success guarantee): a booking is booked\n- Main flow:\n  1. the employee books the meeting room\n  2. a booking is booked\n- Alternative flow: none\n- Exception flow: the response is 409 SLOT_TAKEN\n\n```mermaid\nflowchart LR\n  S([\"employee\"]) --> P[\"the employee books the meeting room\"] --> Q[\"a booking is booked\"]\n  P -.-> X[\"the response is 409 SLOT_TAKEN\"]\n```"}, "UC-002": {"heading": "UC-002 check in within 15 minutes or the system will release the meeting room (REQ-002)", "line": 21, "text": "- Primary actor: employee\n- Trigger: the employee checks in within 15 minutes\n- Precondition: a booking is booked\n- Postcondition (success guarantee): the booking is checked-in\n- Main flow:\n  1. the employee checks in within 15 minutes\n  2. the booking is checked-in\n- Alternative flow: none\n- Exception flow: the booking is released and the calendar service is updated\n\n```mermaid\nflowchart LR\n  S([\"employee\"]) --> P[\"the employee checks in within 15 minutes\"] --> Q[\"the booking is checked-in\"]\n  P -.-> X[\"the booking is released and the calendar service is updated\"]\n```"}, "UC-003": {"heading": "UC-003 An admin can view daily booking records (REQ-003)", "line": 38, "text": "- Primary actor: admin\n- Trigger: the admin opens the daily view\n- Precondition: booking records exist today\n- Postcondition (success guarantee): rows are grouped by meeting room\n- Main flow:\n  1. the admin opens the daily view\n  2. rows are grouped by meeting room\n- Alternative flow: none\n- Exception flow: none\n\n```mermaid\nflowchart LR\n  S([\"admin\"]) --> P[\"the admin opens the daily view\"] --> Q[\"rows are grouped by meeting room\"]\n```"}}, "screens": [], "ui_elements": [], "ui_validation": [], "doc_paths": {"00-overview.md": "00-overview.md", "10-requirements.md": "10-requirements.md", "20-domain-model.md": "20-domain-model.md", "30-architecture-c4.md": "30-architecture-c4.md", "40-api-contracts.md": "api/40-api-contracts.md", "50-data-model.md": "api/50-data-model.md", "60-test-design.md": "60-test-design.md"}, "sa_files": ["sa/00-lexicon.md", "sa/01-break-words.md", "sa/02-entities-relations.md", "sa/03-roles.md", "sa/04-usecase.md", "sa/05-activity.md", "sa/06-sequence.md", "sa/07-state.md", "survey-mapping.md"], "sa_artifacts": [{"id": "CLS-SA-001", "kind": "class", "file": "sa/02-entities-relations.md", "line": 17, "heading": "CLS-SA-001 (REQ-001)", "req": "REQ-001", "reqs": ["REQ-001"], "mermaid": "classDiagram\n  class Room\n  class Bo : "# Meeting room booking (PM spec)\n\n## 1 Background and Goals\nAn employee books a meeting room by email today and double booking happens weekly. Goal: self-service book with conflict checks and automatic release.\n\n## 2 Users\nemployee: wants to book a meeting room. admin: needs the daily view. system: will release no-show booking records.\n\n## 3 Functional Requirements\n### 3.1 An employee can book a meeting room without overlapping time slot\nAn employee can book a meeting room for a time slot. Two booking records on the same meeting room must not overlap. A new booking is booked and is synced to the calendar service.\n\n### 3.2 check in within 15 minutes or the system will release the meeting room\nThe employee must check in within 15 minutes after the start. Otherwise the system will release the booking, marks it released and updates the calendar service.\n\n### 3.3 An admin can view daily booking records\nAn admin can view all booking records of a day for every meeting room.\n\n## 4 Non-functional Requirements\nWith 100 concurrent requests for the same time slot, exactly one booking succeeds.\n\n## 5 Acceptance\n- the time slot is free → the employee books the meeting room → a booking is booked\n- the time slot overlaps another booking → the employee books the meeting room → the response is 409 SLOT_TAKEN\n- a booking is booked → the employee checks in within 15 minutes → the booking is checked-in\n- no check in after 15 minutes → the system job runs → the booking is released and the calendar service is updated\n- booking records exist today → the admin opens the daily view → rows are grouped by meeting room\n", "specs/rd/room-booking/spec/00-overview.md": "# Meeting room booking — overview\n\n## Background and Goals\nAn employee books a meeting room by email today and double booking happens weekly. Goal: self-service book with conflict checks and automatic release.\n\n## Scope\nbackend only\n\n## Glossary\n| Term | Definition | Source |\n|---|---|---|\n| meeting room (Room) | meeting room | PM§3.1 |\n| booking (Booking) | booking | PM§3.1 |\n| time slot (TimeSlot) | time slot | PM§3.1 |\n\n## Source Map\n| PM Source | RD Artifact |\n|---|---|\n| PM§1 | 00-overview.md |\n| PM§3.1 | REQ-001, UC-001 |\n| PM§3.2 | REQ-002, UC-002 |\n| PM§3.3 | REQ-003, UC-003 |\n| PM§4 | NFR-001 |\n\n## Sources\n- PM spec: `specs/in-progress/room-booking/pm-spec.md`\n- refs: `specs/in-progress/room-booking/refs.md`\n", "specs/rd/room-booking/spec/10-requirements.md": "# Meeting room booking — requirements\n\n## Requirements\n| ID | Requirement | Type | Source Anchor | AC |\n|---|---|---|---|---|\n| REQ-001 | An employee can book a meeting room without overlapping time slot | functional, domain_rich | PM§3.1 | AC-001-1, AC-001-2 |\n| REQ-002 | check in within 15 minutes or the system will release the meeting room | functional, state_heavy, integration | PM§3.2 | AC-002-1, AC-002-2 |\n| REQ-003 | An admin can view daily booking records | functional | PM§3.3 | AC-003-1 |\n\n## Acceptance Criteria\n```gherkin\n# AC-001-1\nGiven the time slot is free\nWhen the employee books the meeting room\nThen a booking is booked\n\n# AC-001-2\nGiven the time slot overlaps another booking\nWhen the employee books the meeting room\nThen the response is 409 SLOT_TAKEN\n\n# AC-002-1\nGiven a booking is booked\nWhen the employee checks in within 15 minutes\nThen the booking is checked-in\n\n# AC-002-2\nGiven no check in after 15 minutes\nWhen the system job runs\nThen the booking is released and the calendar service is updated\n\n# AC-003-1\nGiven booking records exist today\nWhen the admin opens the daily view\nThen rows are grouped by meeting room\n\n```\n\n## Non-functional Requirements\n| ID | Stimulus | Source | Environment | Artifact | Response | Measure | Bound CMP/API | AC |\n|---|---|---|---|---|---|---|---|---|\n| NFR-001 | With 100 concurrent requests for the same time slot, exactly one booking succeeds. | user | normal load | API-001 | ok | 100 concurrent → 1 success | API-001 | AC-N01-1 |\n\n## Gaps\n| # | Question | Affects REQ | Assumption |\n|---|---|---|---|\n", "specs/rd/room-booking/spec/20-domain-model.md": "# Meeting room booking — domain model\n\n## Use Cases\n### UC-001 An employee can book a meeting room without overlapping time slot (REQ-001)\n- Primary actor: employee\n- Trigger: the employee books the meeting room\n- Precondition: the time slot is free\n- Postcondition (success guarantee): a booking is booked\n- Main flow:\n  1. the employee books the meeting room\n  2. a booking is booked\n- Alternative flow: none\n- Exception flow: the response is 409 SLOT_TAKEN\n\n```mermaid\nflowchart LR\n  S([\"employee\"]) --> P[\"the employee books the meeting room\"] --> Q[\"a booking is booked\"]\n  P -.-> X[\"the response is 409 SLOT_TAKEN\"]\n```\n\n### UC-002 check in within 15 minutes or the system will release the meeting room (REQ-002)\n- Primary actor: employee\n- Trigger: the employee checks in within 15 minutes\n- Precondition: a booking is booked\n- Postcondition (success guarantee): the booking is checked-in\n- Main flow:\n  1. the employee checks in within 15 minutes\n  2. the booking is checked-in\n- Alternative flow: none\n- Exception flow: the booking is released and the calendar service is updated\n\n```mermaid\nflowchart LR\n  S([\"employee\"]) --> P[\"the employee checks in within 15 minutes\"] --> Q[\"the booking is checked-in\"]\n  P -.-> X[\"the booking is released and the calendar service is updated\"]\n```\n\n### UC-003 An admin can view daily booking records (REQ-003)\n- Primary actor: admin\n- Trigger: the admin opens the daily view\n- Precondition: booking records exist today\n- Postcondition (success guarantee): rows are grouped by meeting room\n- Main flow:\n  1. the admin opens the daily view\n  2. rows are grouped by meeting room\n- Alternative flow: none\n- Exception flow: none\n\n```mermaid\nflowchart LR\n  S([\"admin\"]) --> P[\"the admin opens the daily view\"] --> Q[\"rows are grouped by meeting room\"]\n```\n\n## State Machines\n### STM-DOM-001 Booking.Status (REQ-001, REQ-002)\n```mermaid\nstateDiagram-v2\n  [*] --> Booked: BookRoom\n  Booked --> CheckedIn: CheckInBooking\n  Booked --> Released: ReleaseNoShow\n```\n\n## Domain Model\n| Type | Name | Invariant |\n|---|---|---|\n| Aggregate Root | Booking | Status: Booked → CheckedIn → Released |\n| Entity | Room | — |\n| Entity | TimeSlot | — |\n\n### CLS-001 Booking (REQ-001)\n```mermaid\nclassDiagram\n  class Booking { +Id +Status }\n  Room --> Booking : has\n  Room --> TimeSlot : has\n```\n", "specs/rd/room-booking/spec/30-architecture-c4.md": "# Meeting room booking — architecture (C4)\n\n## Context (L1)\n### C4-L1\n```mermaid\nC4Context\n  Person(u, \"employee\")\n  System(sys, \"Meeting room booking\")\n  System_Ext(ext, \"CalendarService\")\n  Rel(u, sys, \"use\")\n  Rel(sys, ext, \"call\")\n```\n\n## Container (L2)\n### C4-L2\n```mermaid\nC4Container\n  Container(api, \"API\", \".NET\", \"\")\n  ContainerDb(db, \"SQL Server\", \"\", \"\")\n```\n\n## Component (L3)\n| ID | Name | Layer | Context | depends | external | Tech |\n|---|---|---|---|---|---|---|\n| CMP-001 | RoomsController | Api | Rooms | CMP-002, CMP-003, CMP-005 |  | ASP.NET Core |\n| CMP-002 | BookRoomCommandHandler | Application | Rooms | CMP-006, CMP-007, CMP-008 |  | MediatR |\n| CMP-003 | CheckInBookingCommandHandler | Application | Rooms | CMP-006, CMP-007 |  | MediatR |\n| CMP-004 | ReleaseNoShowJob | Application | Rooms | CMP-006, CMP-007, CMP-008 |  | ASP.NET Core |\n| CMP-005 | ListDailyBookingsQueryHandler | Application | Rooms | CMP-006, CMP-007 |  | MediatR |\n| CMP-006 | Booking (Aggregate) | Domain | Rooms |  |  |  |\n| CMP-007 | SqlRoomRepository : IRoomRepository | Infrastructure | Rooms |  |  | EF Core |\n| CMP-008 | CalendarServiceClient : ICalendarService | Infrastructure | Rooms |  | CalendarService |  |\n\n### C4-L3\n```mermaid\nflowchart LR\n  CMP001[\"RoomsController<br/>Api\"]\n  |\n| SqlRoomRepository | Adapter | modify | SqlRoomRepository | src/api/Rooms.Infrastructure/SqlRoomRepository.cs:5 | |\n| CalendarServiceClient | Adapter | existing | CalendarServiceClient | src/api/Rooms.Infrastructure/CalendarServiceClient.cs:5 | |\n| RoomsController | Api | modify | RoomsController | src/api/Rooms.Api/Controllers/RoomsController.cs:8 | |\n", "specs/in-progress/room-booking/refs.md": "# refs\n\n- `docs/architectures/overview.md`\n- shape: backend only\n"}, "snippets": {"src/api/Rooms.Domain/Room.cs:5": {"path": "src/api/Rooms.Domain/Room.cs", "start": 1, "lines": ["namespace Rooms.Domain;", "", "// no status in this aggregate yet", "", "public sealed class Room", "{", "    public Guid Id { get; private set; }", "    public int Capacity { get; private set; }", "}"]}, "src/api/Rooms.Domain/Room.cs:8": {"path": "src/api/Rooms.Domain/Room.cs", "start": 2, "lines": ["", "// no status in this aggregate yet", "", "public sealed class Room", "{", "    public Guid Id { get; private set; }", "    public int Capacity { get; private set; }", "}"]}, "src/api/Rooms.Application/ListRoomsQueryHandler.cs:8": {"path": "src/api/Rooms.Application/ListRoomsQueryHandler.cs", "start": 2, "lines": ["using MediatR;", "", "namespace Rooms.Application;", "", "public sealed record ListRoomsQuery(Guid Id) : IRequest<Room?>;", "", "public sealed class ListRoomsQueryHandler(IRoomRepository repo) : IRequestHandler<ListRoomsQuery, Room?>", "{", "    public Task<Room?> Handle(ListRoomsQuery q, CancellationToken ct) => repo.GetAsync(q.Id, ct);", "}"]}, "src/api/Rooms.Infrastructure/SqlRoomRepository.cs:5": {"path": "src/api/Rooms.Infrastructure/SqlRoomRepository.cs", "start": 1, "lines": ["using Rooms.Domain;", "", "namespace Rooms.Infrastructure;", "", "public sealed class SqlRoomRepository : IRoomRepository", "{", "    public Task<Room?> GetAsync(Guid id, CancellationToken ct) => Task.FromResult<Room?>(null);", "    public Task SaveAsync(CancellationToken ct) => Task.CompletedT <script>
(function(){
if(!DATA){document.getElementById('app').innerHTML='<p>尚未注入資料。請執行 spec-dev.py panel &lt;dir&gt;。</p>';return}
const T=DATA.trace,LOG=DATA.log||[],K=DATA.kpis,G=DATA.gate||[],BC=DATA.boundary||[];
const LAYERS=['Api','Application','Domain','Infrastructure'],KINDS=['unit','integration','contract','e2e'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cmp=Object.fromEntries((T.components||[]).map(c=>[c.id,c]));
const apiById=Object.fromEntries((T.apis||[]).map(a=>[a.id,a]));
const superseded=new Set(LOG.filter(e=>e.supersedes!=null).map(e=>e.supersedes));
const live=LOG.filter(e=>!superseded.has(e.seq));
const acOwner={};for(const r of T.requirements)for(const a of r.acs)acOwner[a]=r.id;
const acLinksOf=r=>(T.ac_links||[]).filter(l=>r.acs.includes(l.ac));
const cmpsOf=r=>{const s=new Set(acLinksOf(r).map(l=>l.component));for(const b of (r.binds||[])){if(cmp[b])s.add(b);if(apiById[b])for(const c of apiById[b].component)s.add(c)}return [...s].sort()};
const testsOf=r=>(T.tests||[]).filter(t=>t.acs.some(a=>r.acs.includes(a)));
const idsOf=r=>new Set([r.id,...r.acs]);
const gateOf=r=>{const ids=idsOf(r);return G.filter(g=>(g.ids||[]).some(i=>ids.has(i)))};
const bcOf=r=>{const ids=idsOf(r);for(const c of cmpsOf(r))ids.add(c);return BC.filter(b=>(b.ids||[]).some(i=>ids.has(i)))};
const status=r=>{const g=gateOf(r),b=bcOf(r);if(g.some(x=>x.level==='FAIL')||b.some(x=>x.status==='FAIL'))return'FAIL';if(g.some(x=>x.level==='WARN')||b.some(x=>x.status==='WARN'))return'WARN';return'PASS'};
const badge=s=>`<span class="st ${s}">${s}</span>`;
const fmt=e=>{const gap=(e.gaps||[]).length?`  gap="${e.gaps.join('; ')}"`:'';const note=e.note?`  "${e.note}"`:'';
  return `[${e.req}] ${e.stage} ${String(e.method).padEnd(22)} ${String(e.in).padEnd(28)} → ${String(e.out).padEnd(22)} rule=${String(e.rule).padEnd(4)} ev=${e.evidence||'?'}${gap}${note}`};
const logLine=e=>`<div class="${superseded.has(e.seq)?'dead':(String(e.out).toUpperCase()==='FAIL'?'fail':(e.evidence==='assumed'?'low':''))}" data-k="${esc(e.req+' '+e.stage+' '+e.rule+' '+e.method+' '+(e.evidence||''))}">${esc(fmt(e))}</div>`;
/* ---- 圖與表:預設不展開,看板上只放晶片;點了開 modal 顯示那一張圖 / 那一張表(審計查詢用) ---- */
const DGS={},MODAL={};
const chip=(key,label,sub,icon)=>`<button type="button" class="chip" data-open="${esc(key)}">${icon} ${esc(label)}${sub?` <small>${esc(sub)}</small>`:''}</button>`;
const mer=a=>{DGS[a.id]=a;return chip('dg:'+a.id,a.id,[a.kind,a.file?a.file+(a.line?':'+a.line:''):(a.auto?'自動':'')].filter(Boolean).join(' · '),'◫')};
const pill_=(cls,t)=>`<span class="st ${cls}">${esc(t)}</span>`;
const tbl=(key,title,html,sub)=>{MODAL['tb:'+key]={title,html};return chip('tb:'+key,title,sub,'▦')};
const VR=T.versions||null;
const diffHtml=d=>`<div class="mmeta"><span class="st PASS">+${d.add}</span> <span class="st FAIL">−${d.del}</span>${d.truncated?' <small>(只顯示前 400 行)</small>':''}</div><pre class="diff">${d.lines.map(l=>`<span class="${l.startsWith('@@')?'hk':l.startsWith('+')&&!l.startsWith('+++')?'ad':l.startsWith('-')&&!l.startsWith('---')?'dl':''}">${esc(l)}</span>`).join('\n')}</pre>`;
const diffChip=(v,c)=>{const d=(VR.diffs||{})[v+':'+c.path];const name=c.path.split('/').pop();
  if(!d)return `<span class="chip" title="${esc(c.path)}">${c.status==='new'?'＋':c.status==='removed'?'－':'·'} ${esc(name)} <small>${c.status==='new'?'新增':c.status==='removed'?'移除':''}</small></span>`;
  return tbl(`diff:${v}:${c.path}`,`${c.path} · v${v} 的變更`,`${c.sections&&c.sections.length?`<div class="mmeta"><small>變更段落:</small> ${c.sections.map(s=>`<span class="st WARN">${esc(s)}</span>`).join(' ')}${c.more?` <small>…另 ${c.more} 段</small>`:''}</div>`:''}${diffHtml(d)}`,`+${d.add} −${d.del}`)};
/* 上游鍵 → 那一版改了它的文件 diff:pm: 看 PM spec,req: 看需求文件 */
const keyDiff=(key,v)=>{if(!VR)return esc(key)+' v'+v;const tl=(VR.timeline||[]).find(x=>x.v===v);if(!tl)return esc(key)+' v'+v;
  const c=tl.changed.find(c=>key.startsWith('pm:')?(c.kind==='PM'&&/\.md$/.test(c.path)):/10-requirements\.md$/.test(c.path))||tl.changed[0];
  return c?diffChip(v,c).replace(/(<button[^>]*>)/,`$1${esc(key)} @v${v} · `):esc(key)+' v'+v};

let h='';
h+=`<h1>${esc(T.title)} <small>(${esc(T.feature)})${T.versions&&T.versions.current?` · v${T.versions.current}${T.versions.git?' · '+esc(T.versions.git.commit):''}`:''}</small></h1>
<div class="sub">來源檔:${(T.source_files||[]).map(esc).join(', ')} · 由 spec-dev.py 產生,資料以 md 為準</div>`;
h+=`<div class="kpis">
<div class="kpi"><b>${K.req_count}</b><span>需求 (REQ+NFR)</span></div>
<div class="kpi"><b>${K.component_count}</b><span>技術元件</span></div>
<div class="kpi"><b>${K.test_count}</b><span>測試元件</span></div>
<div class="kpi ${K.boundary_fail?'fail':(K.boundary_warn?'warn':'pass')}"><b>${K.boundary_pass}/${K.boundary_total}</b><span>技術邊界 PASS · FAIL ${K.boundary_fail} · WARN ${K.boundary_warn}</span></div>
<div class="kpi ${K.uncovered_req?'fail':'pass'}"><b>${K.uncovered_req}</b><span>未覆蓋需求 ${(K.uncovered_ids||[]).join(' ')}</span></div>
<div class="kpi ${K.open_gaps?'warn':'pass'}"><b>${K.open_gaps}</b><span>待 PM 確認缺口 · assumed ${K.assumed}</span></div></div>`;

// ---- E. 證據鏈:PM 證據 → 轉換證據(預設隱藏)→ RD 證據,全部內嵌 ----
const SRC=T.sources||{},PMS=(SRC.pm_spec&&SRC.pm_spec.sections)||[],MOCKS=SRC.mocks||[],ACT=T.ac_text||{},UCT=T.uc_text||{};
const pmFile=SRC.pm_spec?SRC.pm_spec.path:'';
const pmSec=src=>{if(!src)return null;const key=String(src).trim();return PMS.find(x=>x.anchor===key)||PMS.find(x=>key.startsWith(x.anchor+' ')||key.startsWith(x.anchor+'('))||PMS.find(x=>key.startsWith(x.anchor))||null};
const loc=(f,l)=>`<span class="loc">${esc(f)}${l?':L'+l:''}</span>`;
const mockView=m=>m.html?`<iframe sandbox="" srcdoc="${esc(m.html)}" style="width:100%;height:240px;border:1px solid var(--line);border-radius:4px;background:#fff"></iframe>`:(m.data_uri?`<img src="${m.data_uri}" style="max-width:100%;border:1px solid var(--line)">`:(m.text?`<pre class="pre">${esc(m.text)}</pre>`:`<small>${m.exists?'(無法內嵌)':'(檔案不存在)'}</small>`));
const artsOf=r=>{const hit=a=>a.req===r.id||(a.reqs||[]).includes(r.id);return {sa:(T.sa_artifacts||[]).filter(hit),rd:(T.artifacts||[]).filter(hit)}};
// ---- 自動圖:每條需求一定有圖(追溯圖 + 元件循序圖),由資料生成,不靠手寫 ----
const LORD=['Page','Component','Store','ApiClient','Api','Application','Domain','Infrastructure'];
const mid=s=>String(s).replace(/[^A-Za-z0-9]/g,'');
const mlab=s=>String(s).replace(/["<>]/g,"'").replace(/\|/g,'/').replace(/;/g,'；').replace(/#/g,'＃').replace(/[{}]/g,m=>m==='{'?'(':')');   // ; 與 # 在 mermaid 是語法字元
// ---- 詞彙 / 分層命名 / 已知資產:查找與關聯 ----
const GLT=(T.glossary&&T.glossary.terms)||[],NMG=(T.glossary&&T.glossary.naming)||[],AS=T.assets||[];
const NMCOL=['UI','API','Application','Domain','Infrastructure','DB'];
const reqText=r=>{const parts=[r.title,(pmSec(r.source)||{}).text||''];for(const a of r.acs){const t=ACT[a];if(t)parts.push(t.text)}
  for(const c of cmpsOf(r))parts.push(cmp[c]?.name||'');return parts.join(' ').toLowerCase()};
const relatedNaming=r=>{const tx=reqText(r);return NMG.filter(n=>(n.symbol&&tx.includes(n.symbol.toLowerCase()))||(n.term&&n.term.length>=2&&tx.includes(String(n.term).toLowerCase())))};
const relatedAssets=(r,keys)=>{const ks=keys.map(k=>String(k).toLowerCase()).filter(k=>k.length>=2);return AS.filter(a=>{const t=(a.heading+' '+a.text).toLowerCase();return ks.some(k=>t.includes(k))})};
const namingTable=rows=>rows.length?`<div class="tw"><table><tr><th>名詞</th><th>符號</th>${NMCOL.map(c=>`<th>${c}</th>`).join('')}</tr>${rows.map(n=>`<tr><td>${esc(n.term)}</td><td class="loc">${esc(n.symbol)}</td>${NMCOL.map(c=>`<td><small>${(n[c]||[]).map(esc).join(', ')}</small></td>`).join('')}</tr>`).join('')}</table></div>`:'<small>(無)</small>';
const assetList=rows=>rows.length?rows.map(a=>`<details><summary><small>${loc(a.path,a.line)} ${esc(a.heading)}</small></summary><pre class="pre" style="color:var(--fg)">${esc(a.text)}</pre></details>`).join(''):'<small>(無)</small>';
const AUTO=T.auto_diagrams||[];
const autoOf=(r,k)=>AUTO.find(a=>a.req===r.id&&a.id.startsWith('AUTO-'+k+'-'));
const narrow=code=>innerWidth<700?code.replace(/^flowchart LR/,'flowchart TD'):code;   /* 窄螢幕由上往下畫 */
const mocksOf=r=>{const ids=new Set([r.id,...artsOf(r).sa.map(a=>a.id),...artsOf(r).rd.map(a=>a.id)]);return MOCKS.filter(m=>(T.io_map||[]).some(row=>row.in.includes(m.path.split('/').pop())&&row.out.some(o=>[...ids].some(i=>o.includes(i)))))};
if(PMS.length||MOCKS.length){
h+=`<section><h2>E. 證據鏈 <small>PM 文字 ↔ 圖(追溯圖、循序圖)↔ RD 文字 · 全部內嵌,不用切畫面</small></h2><div class="body">`;
h+=`<div class="lookup"><label for="lk"><b>查找</b> <small>詞彙 ${GLT.length} · 分層命名 ${NMG.length} · 已知資產 ${AS.length} 段(${[...new Set(AS.map(a=>a.root))].map(esc).join('、')||'無'})</small></label>
  <input type="search" id="lk" placeholder="輸入名詞、符號或關鍵字,例:${esc((NMG[0]||{}).term||'訂單')}" autocomplete="off"><div id="lkout" class="lkout" hidden></div></div>`;
h+=`<details><summary>PM 素材全文 <small>${esc(pmFile)} ${SRC.pm_spec&&SRC.pm_spec.lines?SRC.pm_spec.lines+' 行':''} · mock ${MOCKS.length} · 參考 ${(SRC.refs||[]).length}</small></summary>
<div class="grid">${PMS.length?`<div><pre class="pre" style="color:var(--fg)">${PMS.map(x=>`${'#'.repeat(x.level)} ${esc(x.anchor)} ${esc(x.title)}  <small>(L${x.line})</small>\n${esc(x.text)}\n`).join('\n')}</pre></div>`:'<div><small>00-overview.md「## 來源」未指定 PM spec 路徑,或檔案不存在</small></div>'}
<div>${MOCKS.map(m=>`<b>${esc(m.path)}</b>${mockView(m)}`).join('')}${(SRC.refs||[]).length?`<b>參考</b><ul>${SRC.refs.map(r=>`<li class="mono">${esc(r.path)}${r.exists?'':' <small>(不存在)</small>'}</li>`).join('')}</ul>`:''}</div></div></details>`;
const chainOf=r=>{const logs=live.filter(e=>e.req===r.id).sort((a,b)=>a.seq-b.seq);
  return logs.map(e=>`<div><span class="n">${esc(e.in)}</span> ─<span class="m">[${esc(e.stage)} ${esc(e.method)}${e.rule?' · '+esc(e.rule):''}]</span>→ <span class="n">${esc(e.out)}</span> <span class="ev">ev=${esc(e.evidence||'?')}${(e.gaps||[]).length?' gap: '+esc(e.gaps.join('; ')):''}${e.note?' · '+esc(e.note):''}</span></div>`).join('')||'<small>(無 log)</small>'};
const logicOf=r=>{const ids=idsOf(r);const cs=cmpsOf(r);for(const c of cs)ids.add(c);
  const g=G.filter(x=>(x.ids||[]).some(i=>ids.has(i))),b=BC.filter(x=>(x.ids||[]).some(i=>ids.has(i)));
  const row=(st,rule,target,ev,act)=>`<tr><td>${badge(st)}</td><td><small>${esc(rule)}</small></td><td><small>${esc(target)}</small></td><td><small>${esc(ev)}${act?'<br>處置:'+esc(act):''}</small></td></tr>`;
  const all=[...g.map(x=>row(x.level,x.rule,(x.ids||[])[0]||'',x.msg,x.action)),...b.map(x=>row(x.status,x.rule,x.target,x.evidence,x.action))];
  const why=status(r)==='PASS'?`所有命中規則皆 PASS/INFO(${b.length} 條邊界、${g.length} 條 Gate)`:(status(r)==='FAIL'?'有規則 FAIL,見下':'有規則 WARN,見下');
  return `<small>${why}</small><table>${all.join('')||'<tr><td><small>無</small></td></tr>'}</table>`};
for(const r of (T.requirements||[])){
  const sec=pmSec(r.source),mk=mocksOf(r),A=artsOf(r),st=status(r);
  const pm=sec?`${loc(pmFile,sec.line)}<br><b>${esc(sec.anchor)} ${esc(sec.title)}</b><pre class="pre" style="color:var(--fg)">${esc(sec.text)}</pre>`:`<small>來源錨點「${esc(r.source)}」在 PM spec 找不到對應段落</small>`;
  const pmMock=mk.map(m=>`<details><summary><small>mock · ${esc(m.path.split('/').pop())}</small></summary>${mockView(m)}</details>`).join('');
  const roles=(T.sa_roles||[]).filter(x=>x.reqs.includes(r.id)),cs=cmpsOf(r);
  const ents=(T.sa_entities||[]).filter(e=>e.en&&cs.some(c=>(cmp[c]?.name||'').includes(e.en)));
  const logs=live.filter(e=>e.req===r.id);
  const tr_=autoOf(r,'TRACE'),sq_=autoOf(r,'SEQ');
  const mid_=`<h4>轉換證據 · 圖 <small>點開看</small></h4>
    <div class="chips">${tr_?mer({...tr_,kind:'追溯圖'}):'<small>(無自動追溯圖)</small>'}${sq_?mer({...sq_,kind:'元件循序圖'}):''}${A.sa.map(mer).join('')}${A.rd.map(mer).join('')}</div>

const setHash=open=>history.replaceState(null,'',location.pathname+location.search+'#tab='+curTab+(open?'&open='+encodeURIComponent(open):''));
const showTab=(id,focus)=>{if(!order_.includes(id))id=order_.includes(BOARD.default_tab)?BOARD.default_tab:order_[0];curTab=id;
  for(const b of nav.children){const on=b.dataset.tab===id;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1;if(on&&focus)b.focus()}
  for(const t of order_)document.getElementById('tab-'+t).hidden=t!==id;setHash(mdl.open?mdl.dataset.key:'');runMermaid(document.getElementById('tab-'+id))};
nav.addEventListener('click',e=>{const b=e.target.closest('[role=tab]');if(b)showTab(b.dataset.tab)});
nav.addEventListener('keydown',e=>{const i=order_.indexOf(curTab);if(e.key==='ArrowRight')showTab(order_[(i+1)%order_.length],true);if(e.key==='ArrowLeft')showTab(order_[(i-1+order_.length)%order_.length],true)});
/* modal:一次只看一張圖 / 一張表 / 一個審計項目 */
const mdl=document.createElement('dialog');mdl.id='mdl';mdl.setAttribute('aria-labelledby','mdlt');
mdl.innerHTML='<header><b id="mdlt"></b><span><button type="button" class="mlink" title="複製這張的連結">複製連結</button><button type="button" class="x" aria-label="關閉">✕</button></span></header><div class="mb"></div>';
document.body.appendChild(mdl);
const AUI=(T.audit&&T.audit.items)||[];
window.__DG=Object.fromEntries([...Object.values(DGS),...AUI.filter(i=>i.type==='diagram')].map(a=>[a.id,a.mermaid]));
const openKey=key=>{let title='',html='';
  if(key.startsWith('dg:')){const id=key.slice(3),a=DGS[id]||AUI.find(i=>i.id===id);if(!a)return false;
    title=`${a.id} · ${a.kind||''}`;
    html=`<div class="mmeta">${a.file?loc(a.file,a.line):(a.auto||a.phase==='AUTO'?'自動生成(由表格資料產生)':'')}${(window.__AUDB||{})[id]?` ${chip('aud:'+id,'審計與確認','來源 · 過程 · 目標 · 確認事項 · 提問','☑')}`:''}</div>
      <div class="dg"><pre class="mermaid" data-did="${esc(id)}">${esc(narrow(a.mermaid))}</pre></div><details><summary><small>原始碼</small></summary><pre class="pre">${esc(a.mermaid)}</pre></details>`}
  else if(key.startsWith('aud:')){const b=(window.__AUDB||{})[key.slice(4)];if(!b)return false;title=b.title;html=b.html}
  else if(MODAL[key]){title=MODAL[key].title;html=MODAL[key].html}else return false;
  mdl.querySelector('#mdlt').textContent=title;mdl.querySelector('.mb').innerHTML=html;mdl.dataset.key=key;
  if(!mdl.open)mdl.showModal();mdl.querySelector('.mb').scrollTop=0;runMermaid(mdl);setHash(key);
  mdl.dispatchEvent(new CustomEvent('opened',{detail:key}));return true};
window.__open=openKey;
mdl.querySelector('.x').addEventListener('click',()=>mdl.close());
mdl.addEventListener('close',()=>setHash(''));
mdl.addEventListener('click',e=>{if(e.target===mdl)mdl.close()});
mdl.querySelector('.mlink').addEventListener('click',e=>{const u=location.href;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>{e.target.textContent='已複製'}).catch(()=>{prompt('連結',u)});setTimeout(()=>{e.target.textContent='複製連結'},1500)});
mdl.addEventListener('input',e=>{if(!e.target.classList.contains('mfilter'))return;const q=e.target.value.trim().toLowerCase();
  const tb=e.target.nextElementSibling&&e.target.nextElementSibling.matches('table,.tw')?e.target.nextElementSibling:mdl.querySelector('.mb table');
  for(const tr of [...tb.querySelectorAll('tr')].slice(1))tr.hidden=!!q&&!tr.textContent.toLowerCase().includes(q)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(!b)return;e.preventDefault();openKey(b.dataset.open)});
{const a=hashArgs();showTab(a.tab||'');if(a.open)openKey(a.open)}
(function(){const list=document.getElementById('audlist');if(!list)return;   /* 看板只負責看:篩選 */
  const filt=f=>{for(const d of list.children){const r=+d.dataset.rank;
      d.hidden=!(f==='all'||(f==='todo'&&r<9)||(f.startsWith('duty:')&&d.dataset.todo.split(' ').includes(f.slice(5)))||d.dataset.phase===f||d.dataset.type===f)}
    for(const b of document.querySelectorAll('.audbar button'))b.classList.toggle('on',b.dataset.f===f)};
  document.querySelectorAll('.audbar button').forEach(b=>b.addEventListener('click',()=>filt(b.dataset.f)));filt('todo');
})();
/* ---- 點「檔:行」看原文:用面板內嵌的原文(追蹤中的文件全文、survey 引用的程式碼前後幾行)。dialog 疊在 modal 上面 ---- */
(function(){const EMB=DATA.src||{},FILES=EMB.files||{},SNIPS=EMB.snippets||{};
  const DOCP=Object.values(T.doc_paths||{});
  const findKey=p=>{if(FILES[p]!=null)return p;const ks=Object.keys(FILES);
    if(/^\d{2}$/.test(p)){const dp=DOCP.find(x=>x.split('/').pop().startsWith(p+'-'));if(dp)p=dp}
    return ks.find(k=>k===p)||ks.find(k=>k.endsWith('/'+p))||null};
  const readEmbedded=(p,line)=>{const k=findKey(p);if(k)return Promise.resolve({path:k,text:FILES[k]});
    const s=SNIPS[p+':'+line]||Object.values(SNIPS).find(x=>x.path===p||x.path.endsWith('/'+p));
    if(s)return Promise.resolve({path:s.path,text:s.lines.join('\n'),start:s.start,note:'只嵌入引用行前後幾行'});
    return Promise.resolve({error:'這份檔案沒有嵌入面板'})};
  const box=document.createElement('dialog');box.id='srcv';box.setAttribute('aria-label','原文');
  box.innerHTML='<header><b class="p"></b><button type="button" class="x" aria-label="關閉">✕</button></header><div class="b"></div>';document.body.appendChild(box);
  box.querySelector('.x').onclick=()=>box.close();box.addEventListener('click',e=>{if(e.target===box)box.close()});
  const RX=/^([^\s:]+\.[A-Za-z0-9]+|\d{2})(?::L?(\d+))?/;
  const mark=root=>root.querySelectorAll('.loc').forEach(s=>{if(RX.test(s.textContent.trim())&&!s.closest('fieldset')){s.classList.add('link');s.tabIndex=0;s.setAttribute('role','link')}});
  mark(document);mdl.addEventListener('opened',()=>mark(mdl));
  document.addEventListener('click',e=>{const s=e.target.closest('.loc.link');if(!s||s.closest('#srcv'))return;
    const m=s.textContent.trim().match(RX);if(!m)return;e.preventDefault();const line=+(m[2]||0);
    readEmbedded(m[1],line).then(d=>{const b=box.querySelector('.b');const st=d.start||1;
      box.querySelector('.p').textContent=d.error?m[1]:d.path+(line?':'+line:'')+(d.note?' · '+d.note:'');
      b.innerHTML=d.error?'<p>'+esc(d.error)+'</p>':'<pre>'+d.text.split('\n').map((l,i)=>`<span class="ln${i+st===line?' hit':''}"><i>${i+st}</i>${esc(l)}</span>`).join('\n')+'</pre>';
      if(!box.open)box.showModal();const hit=b.querySelector('.hit');if(hit)hit.scrollIntoView({block:'center'})})});
  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('link'))e.target.click()});
})();
const lk=document.getElementById('lk');
if(lk)lk.addEventListener('input',()=>{const q=lk.value.trim().toLowerCase();const box=document.getElementById('lkout');
  if(q.length<1){box.hidden=true;box.innerHTML='';return}
  const hit=s=>String(s||'').toLowerCase().includes(q);
  const g=GLT.filter(t=>hit(t.term)||hit(t.symbol)||hit(t.definition));
  const n=NMG.filter(x=>hit(x.term)||hit(x.symbol)||NMCOL.some(c=>(x[c]||[]).some(hit)));
  const a=AS.filter(x=>hit(x.heading)||hit(x.text)||hit(x.path));
  box.innerHTML=`<div><small><b>詞彙表</b> ${g.length}</small>${g.length?`<div class="tw"><table><tr><th>名詞</th><th>符號</th><th>定義</th><th>來源</th></tr>${g.map(t=>`<tr><td>${esc(t.term)}</td><td class="loc">${esc(t.symbol)}</td><td><small>${esc(t.definition)}</small></td><td>${loc(t.source,'')}</td></tr>`).join('')}</table></div>`:''}</div>
    <div><small><b>分層命名</b> ${n.length}</small>${n.length?namingTable(n):''}</div>
    <div><small><b>已知資產</b> ${a.length}</small>${a.length?assetList(a.slice(0,30)):''}</div>`;
  box.hidden=false;runMermaid(box)});   // mermaid 載入完成後由頁尾腳本呼叫;展開 details 時再補畫
document.querySelectorAll('tr.row').forEach(tr=>tr.addEventListener('click',()=>{const d=document.querySelector(`tr.detail[data-for="${tr.dataset.id}"]`);d.hidden=!d.hidden;if(!d.hidden)runMermaid(d)}));
document.querySelectorAll('details').forEach(dt=>dt.addEventListener('toggle',()=>{if(dt.open)runMermaid(dt)}));
document.getElementById('lf').addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#logbox div').forEach(d=>d.style.display=d.dataset.k.toLowerCase().includes(q)?'':'none')});
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
(function(){
  function boot(){
    mermaid.initialize({startOnLoad:false,securityLevel:'loose',theme:matchMedia('(prefers-color-scheme:dark)').matches?'dark':'default'});
    if(window.__renderVisible)window.__renderVisible();
  }
  function fail(){
    var n=document.createElement('div');
    n.setAttribute('role','status');
    n.style.cssText='position:sticky;top:0;z-index:9;padding:8px 12px;background:var(--warnbg);color:var(--warn);border-bottom:1px solid var(--line);font-size:13px';
    n.textContent='圖表引擎(mermaid)無法從 CDN 載入,圖以原始碼顯示。封閉網路請用 spec-dev.py all --offline 產生內嵌版面板。';
    document.body.prepend(n);
  }
  if(window.mermaid){boot();return}
  var s=document.createElement('script');
  s.src='https://unpkg.com/mermaid@11.4.1/dist/mermaid.min.js';
  s.onload=function(){window.mermaid?boot():fail()};
  s.onerror=fail;
  document.head.appendChild(s);
})();
</script>
</body>
</html>
