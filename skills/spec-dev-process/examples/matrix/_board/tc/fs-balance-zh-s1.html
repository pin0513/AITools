<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RD Spec 核對面板</title>
<style>
:root{--bg:#fff;--fg:#1f2328;--muted:#656d76;--line:#d0d7de;--head:#f6f8fa;--pass:#1a7f37;--warn:#9a6700;--fail:#cf222e;--passbg:#dafbe1;--warnbg:#fff8c5;--failbg:#ffebe9;--accent:#0969da}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--fg:#e6edf3;--muted:#8b949e;--line:#30363d;--head:#161b22;--pass:#3fb950;--warn:#d29922;--fail:#f85149;--passbg:#12261e;--warnbg:#2b2411;--failbg:#3a1d1f;--accent:#58a6ff}}
:root[data-theme="dark"]{--bg:#0d1117;--fg:#e6edf3;--muted:#8b949e;--line:#30363d;--head:#161b22;--pass:#3fb950;--warn:#d29922;--fail:#f85149;--passbg:#12261e;--warnbg:#2b2411;--failbg:#3a1d1f;--accent:#58a6ff}
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:0;padding:8px 12px;background:var(--head);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.sub{color:var(--muted);font-size:12px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.kpi{border:1px solid var(--line);border-radius:6px;padding:8px 10px}.kpi b{display:block;font-size:22px;line-height:1.1}.kpi span{font-size:12px;color:var(--muted)}
.kpi.fail b{color:var(--fail)}.kpi.warn b{color:var(--warn)}.kpi.pass b{color:var(--pass)}
section{border:1px solid var(--line);border-radius:6px;margin:12px 0;overflow:hidden}
.body{padding:10px 12px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}th{background:var(--head);font-weight:600;white-space:nowrap}
.grp th{text-align:center;font-size:11px;color:var(--muted)}
.cell{text-align:center;white-space:nowrap}.cell.empty{color:var(--line)}
.st{display:inline-block;padding:0 6px;border-radius:10px;font-size:11px;font-weight:600}
.PASS{background:var(--passbg);color:var(--pass)}.WARN{background:var(--warnbg);color:var(--warn)}.FAIL{background:var(--failbg);color:var(--fail)}.INFO{background:var(--head);color:var(--muted)}
tr.row{cursor:pointer}tr.row:hover td{background:var(--head)}tr.detail td{background:var(--bg);padding:10px 14px}
tr.detail .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:800px){tr.detail .grid{grid-template-columns:1fr}}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;white-space:pre}
.log{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.7}
.log div{padding:0 6px;white-space:pre}.log .low{background:var(--warnbg)}.log .fail{background:var(--failbg)}.log .dead{text-decoration:line-through;color:var(--muted)}
details>summary{cursor:pointer;list-style:none;user-select:none}details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";color:var(--muted)}details[open]>summary::before{content:"▾ "}
input[type=search]{font:inherit;padding:2px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}
.pre{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted);white-space:pre-wrap}
.two{display:grid;grid-template-columns:1fr 1.6fr;gap:12px}@media(max-width:900px){.two{grid-template-columns:1fr}}
small{color:var(--muted)}.mermaid{background:var(--bg);margin:6px 0;overflow-x:auto}.mermaid svg{max-width:100%;height:auto}
.evtbl{table-layout:fixed}.evtbl td{word-break:break-word;vertical-align:top}
.evc{border:1px solid var(--line);border-radius:6px;margin:10px 0;overflow:hidden}
.evc>header{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;padding:8px 12px;background:var(--head);border-bottom:1px solid var(--line)}
.evg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr)}
.evg>div{padding:10px 12px;min-width:0;border-right:1px solid var(--line)}.evg>div:last-child{border-right:0}
.evg h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
@media(max-width:900px){.evg{grid-template-columns:minmax(0,1fr)}.evg>div{border-right:0;border-bottom:1px solid var(--line)}}
.loc{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted);word-break:break-all}
.dg{overflow-x:auto;border:1px solid var(--line);border-radius:4px;padding:4px;margin:4px 0 8px;background:var(--bg)}
.aud{border:1px solid var(--line);border-radius:6px;margin:6px 0}.aud>summary{padding:6px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.aud[open]>summary{border-bottom:1px solid var(--line);background:var(--head)}
.audg{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px;padding:10px 12px}@media(max-width:900px){.audg{grid-template-columns:minmax(0,1fr)}}
.prov{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:6px 10px;margin:0}.prov dt{color:var(--muted);font-size:12px}.prov dd{margin:0;min-width:0}
.dec{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:10px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}.dec.bad{border-color:var(--fail)}
.dec .note{flex:1 1 220px;font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}
.audbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}.audbar button{font:inherit;font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--fg);cursor:pointer}
.audbar button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}.audbar button:focus-visible,.dec input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.audbar .who{margin-left:auto;font-size:12px}.audbar .who input{font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);width:9em}
.soout{display:grid;gap:6px;margin-top:12px;padding:10px;border:1px dashed var(--line);border-radius:6px}.soout textarea{font:12px ui-monospace,Menlo,monospace;width:100%;box-sizing:border-box;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:6px}
.soout .row{display:flex;gap:8px;align-items:center}.soout button{font:inherit;font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:4px;background:var(--head);color:var(--fg);cursor:pointer}
.lookup{display:grid;gap:6px;margin:0 0 10px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--head)}
.lookup input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box}
.lkout{display:grid;gap:8px;max-height:60vh;overflow:auto}
.tw{overflow-x:auto}.tw table{width:auto;min-width:100%}.tw table td,.tw table th{white-space:normal;min-width:4.5em}.tw td.loc,.tw th{white-space:nowrap;word-break:normal}.st{white-space:nowrap}
.dg svg{max-width:none!important;height:auto}
.chain{font-size:12px;line-height:1.7}.chain .n{display:inline-block;padding:0 6px;border:1px solid var(--line);border-radius:4px;background:var(--head);font-family:ui-monospace,Menlo,monospace}.chain .m{color:var(--accent);font-family:ui-monospace,Menlo,monospace}.chain .ev{color:var(--muted)}
ul{margin:4px 0;padding-left:18px}
.duty{display:grid;gap:4px;padding:6px 0;border-top:1px dashed var(--line)}.duty:first-of-type{border-top:0}.duty .opts{display:flex;flex-wrap:wrap;gap:4px 12px}.duty .hint{color:var(--muted)}
.decbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%}.decbar button,.ask button,.qa button,.stale-note button{font:inherit;font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:4px;background:var(--head);color:var(--fg);cursor:pointer}
.decbar .send{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.qs{margin-top:10px;display:grid;gap:6px}.q{border-left:3px solid var(--warn);padding:4px 8px}.q.closed{border-left-color:var(--line);opacity:.8}.q .ans{color:var(--muted)}
.ask,.qa{display:flex;flex-wrap:wrap;gap:6px}.ask input,.qa input,.ask select{font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}.ask input,.qa input{flex:1 1 200px}
.qinbox{margin:8px 0;padding:6px 10px;border:1px solid var(--line);border-radius:6px}.qinbox div{margin:4px 0}
.stale-note{position:sticky;top:0;z-index:9;padding:8px 12px;background:var(--warnbg);color:var(--warn);border-bottom:1px solid var(--line);font-size:13px}
.loc.link{cursor:pointer;text-decoration:underline dotted}.loc.link:focus-visible{outline:2px solid var(--accent)}
dialog#srcv{margin:0 0 0 auto;height:100vh;max-height:100vh;width:min(720px,100vw);padding:0;border:0;border-left:1px solid var(--line);background:var(--bg);color:var(--fg);box-shadow:-4px 0 16px rgba(0,0,0,.15)}dialog#srcv[open]{display:flex;flex-direction:column}
#srcv .b{overflow:auto;flex:1}#srcv pre{margin:0;font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
#srcv .ln{display:block;padding:0 10px}#srcv .ln i{display:inline-block;width:3.5em;color:var(--muted);font-style:normal;user-select:none}#srcv .ln.hit{background:var(--warnbg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
.chip{font:inherit;font-size:12px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;background:var(--head);color:var(--fg);cursor:pointer;text-align:left}
.chip:hover{border-color:var(--accent)}.chip:focus-visible,.aud:focus-visible,.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.chip small{color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:12px 0;position:sticky;top:0;background:var(--bg);z-index:5}
.tabs button{font:inherit;font-size:13px;padding:8px 12px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
#audlist{display:grid;gap:4px}
button.aud{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%;font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);cursor:pointer;text-align:left}
button.aud:hover{border-color:var(--accent)}button.aud[hidden]{display:none}
dialog#mdl{width:min(1200px,96vw);max-height:92vh;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
dialog#mdl::backdrop,dialog#srcv::backdrop{background:rgba(0,0,0,.45)}
dialog#mdl>header,dialog#srcv>header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--head);position:sticky;top:0;z-index:1}
dialog#mdl>header button,dialog#srcv>header button{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);cursor:pointer;padding:2px 8px;margin-left:6px}
dialog#mdl .mb{padding:10px 12px;overflow:auto;max-height:calc(92vh - 46px)}.mmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.audhead{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.mfilter{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box;margin-bottom:6px}
tr.hit td{background:var(--warnbg)}
pre.diff{font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;margin:0;padding:6px;border:1px solid var(--line);border-radius:4px}
pre.diff .ad{display:block;background:var(--passbg,rgba(46,160,67,.15))}pre.diff .dl{display:block;background:var(--failbg,rgba(248,81,73,.15))}pre.diff .hk{display:block;color:var(--muted)}
#versions h3{font-size:13px;margin:14px 0 6px}
</style>

M spec)", "level": 1, "line": 1, "text": ""}, {"anchor": "PM§1", "title": "背景與目標", "level": 2, "line": 3, "text": "目前顧客要取消訂單必須打電話給客服。目標:顧客自助取消,並由系統經付款閘道自動退款。"}, {"anchor": "PM§2", "title": "使用者與情境", "level": 2, "line": 6, "text": "顧客:想快速取消訂單。客服人員:需要查看取消紀錄。系統:負責退款。"}, {"anchor": "PM§3", "title": "功能需求", "level": 2, "line": 9, "text": ""}, {"anchor": "PM§3.1", "title": "顧客可在出貨前取消訂單", "level": 3, "line": 10, "text": "顧客可以在訂單狀態為已下單時取消訂單。訂單一旦已出貨就不可取消。取消後訂單狀態改為已取消。"}, {"anchor": "PM§3.2", "title": "取消後系統經付款閘道退款", "level": 3, "line": 13, "text": "訂單已取消後,系統透過付款閘道退款。付款閘道失敗時系統最多重試 3 次,訂單維持已取消。退款成功後訂單狀態改為已退款。"}, {"anchor": "PM§3.3", "title": "客服人員可查看取消紀錄", "level": 3, "line": 16, "text": "客服人員可以查看每筆訂單的取消紀錄,包含時間與原因。"}, {"anchor": "PM§4", "title": "非功能需求", "level": 2, "line": 19, "text": "95% 的訂單在取消後 5 分鐘內完成退款。"}, {"anchor": "PM§5", "title": "驗收條件", "level": 2, "line": 22, "text": "- 訂單狀態為已下單 → 顧客取消訂單 → 訂單狀態為已取消\n- 訂單狀態為已出貨 → 顧客取消訂單 → 回應 409 ORDER_SHIPPED,狀態不變\n- 訂單已取消且已付款 → 系統退款 → 呼叫付款閘道,訂單狀態為已退款\n- 付款閘道逾時 → 系統退款 → 重試 3 次,訂單維持已取消\n- 有訂單已取消 → 客服人員開啟紀錄 → 每列顯示訂單、時間與原因"}], "lines": 27}, "mocks": [{"path": "specs/in-progress/order-cancel/mock/order.html", "exists": true, "html": "<!doctype html><html><meta charset=\"utf-8\"><title>mock</title><body style=\"font-family:system-ui\"><h2>訂單 <span data-state=\"Placed\">Placed</span></h2><!-- states: Placed/Shipped/Cancelled/Refunded --><button data-action=\"CancelOrder\">取消</button><button data-action=\"ListCancellations\">查看</button><table><tr><th>訂單</th><th>status</th></tr></table></body></html>\n"}], "refs": [{"path": "specs/in-progress/order-cancel/refs.md", "exists": true}]}, "ac_text": {"AC-001-1": {"text": "# AC-001-1\nGiven 訂單狀態為已下單\nWhen 顧客取消訂單\nThen 訂單狀態為已取消", "line": 12}, "AC-001-2": {"text": "# AC-001-2\nGiven 訂單狀態為已出貨\nWhen 顧客取消訂單\nThen 回應 409 ORDER_SHIPPED,狀態不變", "line": 17}, "AC-002-1": {"text": "# AC-002-1\nGiven 訂單已取消且已付款\nWhen 系統退款\nThen 呼叫付款閘道,訂單狀態為已退款", "line": 22}, "AC-002-2": {"text": "# AC-002-2\nGiven 付款閘道逾時\nWhen 系統退款\nThen 重試 3 次,訂單維持已取消", "line": 27}, "AC-003-1": {"text": "# AC-003-1\nGiven 有訂單已取消\nWhen 客服人員開啟紀錄\nThen 每列顯示訂單、時間與原因", "line": 32}}, "uc_text": {"UC-001": {"heading": "UC-001 顧客可在出貨前取消訂單 (REQ-001)", "line": 4, "text": "- 主要參與者: 顧客\n- 觸發: 顧客取消訂單\n- 前置條件: 訂單狀態為已下單\n- 後置條件(成功保證): 訂單狀態為已取消\n- 主流程:\n  1. 顧客取消訂單\n  2. 訂單狀態為已取消\n- 替代流程: 無\n- 例外流程: 回應 409 ORDER_SHIPPED,狀態不變\n\n```mermaid\nflowchart LR\n  S([\"顧客\"]) --> P[\"顧客取消訂單\"] --> Q[\"訂單狀態為已取消\"]\n  P -.-> X[\"回應 409 ORDER_SHIPPED,狀態不變\"]\n```"}, "UC-002": {"heading": "UC-002 取消後系統經付款閘道退款 (REQ-002)", "line": 21, "text": "- 主要參與者: 系統\n- 觸發: 系統退款\n- 前置條件: 訂單已取消且已付款\n- 後置條件(成功保證): 呼叫付款閘道,訂單狀態為已退款\n- 主流程:\n  1. 系統退款\n  2. 呼叫付款閘道,訂單狀態為已退款\n- 替代流程: 無\n- 例外流程: 重試 3 次,訂單維持已取消\n\n```mermaid\nflowchart LR\n  S([\"系統\"]) --> P[\"系統退款\"] --> Q[\"呼叫付款閘道,訂單狀態為已退款\"]\n  P -.-> X[\"重試 3 次,訂單維持已取消\"]\n```"}, "UC-003": {"heading": "UC-003 客服人員可查看取消紀錄 (REQ-003)", "line": 38, "text": "- 主要參與者: 客服人員\n- 觸發: 客服人員開啟紀錄\n- 前置條件: 有訂單已取消\n- 後置條件(成功保證): 每列顯示訂單、時間與原因\n- 主流程:\n  1. 客服人員開啟紀錄\n  2. 每列顯示訂單、時間與原因\n- 替代流程: 無\n- 例外流程: 無\n\n```mermaid\nflowchart LR\n  S([\"客服人員\"]) --> P[\"客服人員開啟紀錄\"] --> Q[\"每列顯示訂單、時間與原因\"]\n```"}}, "screens": [{"screen": "OrderDetailPage", "route": "/order", "components": ["CMP-001", "CMP-002", "CMP-003", "CMP-004", "CMP-005"], "mock": "specs/in-progress/order-cancel/mock/order.html", "reqs": ["REQ-001", "REQ-002", "REQ-003"], "line": 6, "file": "ui/41-ui-spec.md"}], "ui_validation": [{"screen": "OrderDetailPage", "field": "CancelOrder", "rule": "訂單狀態為已出貨", "message": "回應 409 ORDER_SHIPPED,狀態不變", "acs": ["AC-001-2"], "line": 21}], "doc_paths": {"00-overview.md": "00-overview.md", "10-requirements.md": "10-requirements.md", "20-domain-model.md": "20-domain-model.md", "30-architecture-c4.md": "30-architecture-c4.md", "40-api-contracts.md": "api/40-api-contracts.md", "41-ui-spec.md": "ui/41-ui-spec.md", "50-data-model.md": "api/50-data-model.md", "60-test-design.md": "60-test-design.md"}, "sa_files": ["sa/00-lexicon <script>
(function(){
if(!DATA){document.getElementById('app').innerHTML='<p>尚未注入資料。請執行 spec-dev.py panel &lt;dir&gt;。</p>';return}
const T=DATA.trace,LOG=DATA.log||[],K=DATA.kpis,G=DATA.gate||[],BC=DATA.boundary||[];
const LAYERS=['Api','Application','Domain','Infrastructure'],KINDS=['unit','integration','contract','e2e'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cmp=Object.fromEntries((T.components||[]).map(c=>[c.id,c]));
const apiById=Object.fromEntries((T.apis||[]).map(a=>[a.id,a]));
const superseded=new Set(LOG.filter(e=>e.supersedes!=null).map(e=>e.supersedes));
const live=LOG.filter(e=>!superseded.has(e.seq));
const acOwner={};for(const r of T.requirements)for(const a of r.acs)acOwner[a]=r.id;
const acLinksOf=r=>(T.ac_links||[]).filter(l=>r.acs.includes(l.ac));
const cmpsOf=r=>{const s=new Set(acLinksOf(r).map(l=>l.component));for(const b of (r.binds||[])){if(cmp[b])s.add(b);if(apiById[b])for(const c of apiById[b].component)s.add(c)}return [...s].sort()};
const testsOf=r=>(T.tests||[]).filter(t=>t.acs.some(a=>r.acs.includes(a)));
const idsOf=r=>new Set([r.id,...r.acs]);
const gateOf=r=>{const ids=idsOf(r);return G.filter(g=>(g.ids||[]).some(i=>ids.has(i)))};
const bcOf=r=>{const ids=idsOf(r);for(const c of cmpsOf(r))ids.add(c);return BC.filter(b=>(b.ids||[]).some(i=>ids.has(i)))};
const status=r=>{const g=gateOf(r),b=bcOf(r);if(g.some(x=>x.level==='FAIL')||b.some(x=>x.status==='FAIL'))return'FAIL';if(g.some(x=>x.level==='WARN')||b.some(x=>x.status==='WARN'))return'WARN';return'PASS'};
const badge=s=>`<span class="st ${s}">${s}</span>`;
const fmt=e=>{const gap=(e.gaps||[]).length?`  gap="${e.gaps.join('; ')}"`:'';const note=e.note?`  "${e.note}"`:'';
  return `[${e.req}] ${e.stage} ${String(e.method).padEnd(22)} ${String(e.in).padEnd(28)} → ${String(e.out).padEnd(22)} rule=${String(e.rule).padEnd(4)} ev=${e.evidence||'?'}${gap}${note}`};
const logLine=e=>`<div class="${superseded.has(e.seq)?'dead':(String(e.out).toUpperCase()==='FAIL'?'fail':(e.evidence==='assumed'?'low':''))}" data-k="${esc(e.req+' '+e.stage+' '+e.rule+' '+e.method+' '+(e.evidence||''))}">${esc(fmt(e))}</div>`;
/* ---- 圖與表:預設不展開,看板上只放晶片;點了開 modal 顯示那一張圖 / 那一張表(審計查詢用) ---- */
const DGS={},MODAL={};
const chip=(key,label,sub,icon)=>`<button type="button" class="chip" data-open="${esc(key)}">${icon} ${esc(label)}${sub?` <small>${esc(sub)}</small>`:''}</button>`;
const mer=a=>{DGS[a.id]=a;return chip('dg:'+a.id,a.id,[a.kind,a.file?a.file+(a.line?':'+a.line:''):(a.auto?'自動':'')].filter(Boolean).join(' · '),'◫')};
const tbl=(key,title,html,sub)=>{MODAL['tb:'+key]={title,html};return chip('tb:'+key,title,sub,'▦')};
const VR=T.versions||null;
const diffHtml=d=>`<div class="mmeta"><span class="st PASS">+${d.add}</span> <span class="st FAIL">−${d.del}</span>${d.truncated?' <small>(只顯示前 400 行)</small>':''}</div><pre class="diff">${d.lines.map(l=>`<span class="${l.startsWith('@@')?'hk':l.startsWith('+')&&!l.startsWith('+++')?'ad':l.startsWith('-')&&!l.startsWith('---')?'dl':''}">${esc(l)}</span>`).join('\n')}</pre>`;
const diffChip=(v,c)=>{const d=(VR.diffs||{})[v+':'+c.path];const name=c.path.split('/').pop();
  if(!d)return `<span class="chip" title="${esc(c.path)}">${c.status==='new'?'＋':c.status==='removed'?'－':'·'} ${esc(name)} <small>${c.status==='new'?'新增':c.status==='removed'?'移除':''}</small></span>`;
  return tbl(`diff:${v}:${c.path}`,`${c.path} · v${v} 的變更`,`${c.sections&&c.sections.length?`<div class="mmeta"><small>變更段落:</small> ${c.sections.map(s=>`<span class="st WARN">${esc(s)}</span>`).join(' ')}${c.more?` <small>…另 ${c.more} 段</small>`:''}</div>`:''}${diffHtml(d)}`,`+${d.add} −${d.del}`)};
/* 上游鍵 → 那一版改了它的文件 diff:pm: 看 PM spec,req: 看需求文件 */
const keyDiff=(key,v)=>{if(!VR)return esc(key)+' v'+v;const tl=(VR.timeline||[]).find(x=>x.v===v);if(!tl)return esc(key)+' v'+v;
  const c=tl.changed.find(c=>key.startsWith('pm:')?(c.kind==='PM'&&/\.md$/.test(c.path)):/10-requirements\.md$/.test(c.path))||tl.changed[0];
  return c?diffChip(v,c).replace(/(<button[^>]*>)/,`$1${esc(key)} @v${v} · `):esc(key)+' v'+v};

let h='';

<div class="kpi"><b>${K.req_count}</b><span>需求 (REQ+NFR)</span></div>

// ---- E. 證據鏈:PM 證據 → 轉換證據(預設隱藏)→ RD 證據,全部內嵌 ----
const SRC=T.sources||{},PMS=(SRC.pm_spec&&SRC.pm_spec.sections)||[],MOCKS=SRC.mocks||[],ACT=T.ac_text||{},UCT=T.uc_text||{};
const pmFile=SRC.pm_spec?SRC.pm_spec.path:'';
const pmSec=src=>{if(!src)return null;const key=String(src).trim();return PMS.find(x=>x.anchor===key)||PMS.find(x=>key.startsWith(x.anchor+' ')||key.startsWith(x.anchor+'('))||PMS.find(x=>key.startsWith(x.anchor))||null};
const loc=(f,l)=>`<span class="loc">${esc(f)}${l?':L'+l:''}</span>`;
const mockView=m=>m.html?`<iframe sandbox="" srcdoc="${esc(m.html)}" style="width:100%;height:240px;border:1px solid var(--line);border-radius:4px;background:#fff"></iframe>`:(m.data_uri?`<img src="${m.data_uri}" style="max-width:100%;border:1px solid var(--line)">`:(m.text?`<pre class="pre">${esc(m.text)}</pre>`:`<small>${m.exists?'(無法內嵌)':'(檔案不存在)'}</small>`));
const artsOf=r=>{const hit=a=>a.req===r.id||(a.reqs||[]).includes(r.id);return {sa:(T.sa_artifacts||[]).filter(hit),rd:(T.artifacts||[]).filter(hit)}};
// ---- 自動圖:每條需求一定有圖(追溯圖 + 元件循序圖),由資料生成,不靠手寫 ----
const LORD=['Page','Component','Store','ApiClient','Api','Application','Domain','Infrastructure'];
const mid=s=>String(s).replace(/[^A-Za-z0-9]/g,'');
const mlab=s=>String(s).replace(/["<>]/g,"'").replace(/\|/g,'/').replace(/;/g,'；').replace(/#/g,'＃').replace(/[{}]/g,m=>m==='{'?'(':')');   // ; 與 # 在 mermaid 是語法字元
// ---- 詞彙 / 分層命名 / 已知資產:查找與關聯 ----
const GLT=(T.glossary&&T.glossary.terms)||[],NMG=(T.glossary&&T.glossary.naming)||[],AS=T.assets||[];
const NMCOL=['UI','API','Application','Domain','Infrastructure','DB'];
const reqText=r=>{const parts=[r.title,(pmSec(r.source)||{}).text||''];for(const a of r.acs){const t=ACT[a];if(t)parts.push(t.text)}
  for(const c of cmpsOf(r))parts.push(cmp[c]?.name||'');return parts.join(' ').toLowerCase()};
const relatedNaming=r=>{const tx=reqText(r);return NMG.filter(n=>(n.symbol&&tx.includes(n.symbol.toLowerCase()))||(n.term&&n.term.length>=2&&tx.includes(String(n.term).toLowerCase())))};
const relatedAssets=(r,keys)=>{const ks=keys.map(k=>String(k).toLowerCase()).filter(k=>k.length>=2);return AS.filter(a=>{const t=(a.heading+' '+a.text).toLowerCase();return ks.some(k=>t.includes(k))})};
const namingTable=rows=>rows.length?`<div class="tw"><table><tr><th>名詞</th><th>符號</th>${NMCOL.map(c=>`<th>${c}</th>`).join('')}</tr>${rows.map(n=>`<tr><td>${esc(n.term)}</td><td class="loc">${esc(n.symbol)}</td>${NMCOL.map(c=>`<td><small>${(n[c]||[]).map(esc).join(', ')}</small></td>`).join('')}</tr>`).join('')}</table></div>`:'<small>(無)</small>';
const assetList=rows=>rows.length?rows.map(a=>`<details><summary><small>${loc(a.path,a.line)} ${esc(a.heading)}</small></summary><pre class="pre" style="color:var(--fg)">${esc(a.text)}</pre></details>`).join(''):'<small>(無)</small>';
const AUTO=T.auto_diagrams||[];
const autoOf=(r,k)=>AUTO.find(a=>a.req===r.id&&a.id.startsWith('AUTO-'+k+'-'));
const narrow=code=>innerWidth<700?code.replace(/^flowchart LR/,'flowchart TD'):code;   /* 窄螢幕由上往下畫 */
const mocksOf=r=>{const ids=new Set([r.id,...artsOf(r).sa.map(a=>a.id),...artsOf(r).rd.map(a=>a.id)]);return MOCKS.filter(m=>(T.io_map||[]).some(row=>row.in.includes(m.path.split('/').pop())&&row.out.some(o=>[...ids].some(i=>o.includes(i)))))};
if(PMS.length||MOCKS.length){
h+=`<section><h2>E. 證據鏈 <small>PM 文字 ↔ 圖(追溯圖、循序圖)↔ RD 文字 · 全部內嵌,不用切畫面</small></h2><div class="body">`;
h+=`<div class="lookup"><label for="lk"><b>查找</b> <small>詞彙 ${GLT.length} · 分層命名 ${NMG.length} · 已知資產 ${AS.length} 段(${[...new Set(AS.map(a=>a.root))].map(esc).join('、')||'無'})</small></label>
  <input type="search" id="lk" placeholder="輸入名詞、符號或關鍵字,例:${esc((NMG[0]||{}).term||'訂單')}" autocomplete="off"><div id="lkout" class="lkout" hidden></div></div>`;
h+=`<details><summary>PM 素材全文 <small>${esc(pmFile)} ${SRC.pm_spec&&SRC.pm_spec.lines?SRC.pm_spec.lines+' 行':''} · mock ${MOCKS.length} · 參考 ${(SRC.refs||[]).length}</small></summary>
<div class="grid">${PMS.length?`<div><pre class="pre" style="color:var(--fg)">${PMS.map(x=>`${'#'.repeat(x.level)} ${esc(x.anchor)} ${esc(x.title)}  <small>(L${x.line})</small>\n${esc(x.text)}\n`).join('\n')}</pre></div>`:'<div><small>00-overview.md「## 來源」未指定 PM spec 路徑,或檔案不存在</small></div>'}
<div>${MOCKS.map(m=>`<b>${esc(m.path)}</b>${mockView(m)}`).join('')}${(SRC.refs||[]).length?`<b>參考</b><ul>${SRC.refs.map(r=>`<li class="mono">${esc(r.path)}${r.exists?'':' <small>(不存在)</small>'}</li>`).join('')}</ul>`:''}</div></div></details>`;
const chainOf=r=>{const logs=live.filter(e=>e.req===r.id).sort((a,b)=>a.seq-b.seq);
  return logs.map(e=>`<div><span class="n">${esc(e.in)}</span> ─<span class="m">[${esc(e.stage)} ${esc(e.method)}${e.rule?' · '+esc(e.rule):''}]</span>→ <span class="n">${esc(e.out)}</span> <span class="ev">ev=${esc(e.evidence||'?')}${(e.gaps||[]).length?' gap: '+esc(e.gaps.join('; ')):''}${e.note?' · '+esc(e.note):''}</span></div>`).join('')||'<small>(無 log)</small>'};
const logicOf=r=>{const ids=idsOf(r);const cs=cmpsOf(r);for(const c of cs)ids.add(c);
  const g=G.filter(x=>(x.ids||[]).some(i=>ids.has(i))),b=BC.filter(x=>(x.ids||[]).some(i=>ids.has(i)));
  const row=(st,rule,target,ev,act)=>`<tr><td>${badge(st)}</td><td><small>${esc(rule)}</small></td><td><small>${esc(target)}</small></td><td><small>${esc(ev)}${act?'<br>處置:'+esc(act):''}</small></td></tr>`;
  const all=[...g.map(x=>row(x.level,x.rule,(x.ids||[])[0]||'',x.msg,x.action)),...b.map(x=>row(x.status,x.rule,x.target,x.evidence,x.action))];
  const why=status(r)==='PASS'?`所有命中規則皆 PASS/INFO(${b.length} 條邊界、${g.length} 條 Gate)`:(status(r)==='FAIL'?'有規則 FAIL,見下':'有規則 WARN,見下');
  return `<small>${why}</small><table>${all.join('')||'<tr><td><small>無</small></td></tr>'}</table>`};
for(const r of (T.requirements||[])){
  const sec=pmSec(r.source),mk=mocksOf(r),A=artsOf(r),st=status(r);
  const pm=sec?`${loc(pmFile,sec.line)}<br><b>${esc(sec.anchor)} ${esc(sec.title)}</b><pre class="pre" style="color:var(--fg)">${esc(sec.text)}</pre>`:`<small>來源錨點「${esc(r.source)}」在 PM spec 找不到對應段落</small>`;
  const pmMock=mk.map(m=>`<details><summary><small>mock · ${esc(m.path.split('/').pop())}</small></summary>${mockView(m)}</details>`).join('');
  const roles=(T.sa_roles||[]).filter(x=>x.reqs.includes(r.id)),cs=cmpsOf(r);
  const ents=(T.sa_entities||[]).filter(e=>e.en&&cs.some(c=>(cmp[c]?.name||'').includes(e.en)));
  const logs=live.filter(e=>e.req===r.id);
  const tr_=autoOf(r,'TRACE'),sq_=autoOf(r,'SEQ');
  const mid_=`<h4>轉換證據 · 圖 <small>點開看</small></h4>
    <div class="chips">${tr_?mer({...tr_,kind:'追溯圖'}):'<small>(無自動追溯圖)</small>'}${sq_?mer({...sq_,kind:'元件循序圖'}):''}${A.sa.map(mer).join('')}${A.rd.map(mer).join('')}</div>
    <details><summary><b>分析鏈</b> <small>${logs.length} 步 · 角色動作 ${roles.length} · 實體 ${ents.length} · 手寫 SA 圖 ${A.sa.length} · RD 圖 ${A.rd.length}</small></summary>
    ${roles.length?`<small><b>SA3 角色→動作</b></small><ul>${roles.map(x=>`<li><small>${esc(x.role)} → ${esc(x.action)} <i>${esc(x.flow)}</i></small></li>`).join('')}</ul>`:''}
    ${ents.length?`<small><b>SA2 實體</b> ${ents.map(e=>esc(e.name)+'('+esc(e.en)+')').join('、')}</small><br>`:''}
    <small><b>方法論步驟</b></small><div class="chain">${chainOf(r)}</div>
    </details>
    <details><summary><b>邏輯鏈</b> <small>為什麼是 ${st}</small></summary><div class="tw">${logicOf(r)}</div></details>
    ${(()=>{const nm=relatedNaming(r);const keys=[...new Set(nm.flatMap(n=>[n.symbol,n.term,...NMCOL.flatMap(c=>n[c]||[])]).filter(Boolean))];const as=relatedAssets(r,keys);
      return `<div class="chips"><b>詞彙與已知資產</b> ${tbl('nm:'+r.id,r.id+' 分層命名與已知資產',`<small><b>分層命名對照</b></small>${namingTable(nm)}<small><b>docs / specs/done 相關段落</b></small>${assetList(as)}`,`命名 ${nm.length} 列 · 文件段落 ${as.length} 段`)}</div>`})()}`;
  const acRows=r.acs.map(a=>{const t=ACT[a];const ls=(T.ac_links||[]).filter(l=>l.ac===a);const tt=(T.tests||[]).filter(x=>x.acs.includes(a));
    return `<div style="margin:4px 0;padding:4px 6px;border-left:3px solid var(--line)"><b>${esc(a)}</b> ${t?loc('10-requirements.md',t.line):''}<pre class="pre" style="color:var(--fg);margin:2px 0">${esc(t?t.text:(r.measure?'量測:'+r.measure+(r.stimulus_source?' · 刺激來源:'+r.stimulus_source:''):'(無 gherkin)'))}</pre>
      <small>元件:${ls.length?ls.map(l=>`${esc(l.component)} <i>${esc(l.role)}</i> ${loc('30',l.line)}`).join(' · '):(r.binds?.length?'NFR 綁定 '+r.binds.map(esc).join(', '):badge('WARN'))}</small><br>
      <small>測試:${tt.length?tt.map(x=>`${esc(x.id)} ${loc('60',x.line)}`).join(' · '):badge('FAIL')+' 無'}</small></div>`}).join('');
  const ucs=Object.entries(UCT).filter(([k,v])=>v.heading.includes(r.id)).map(([k,v])=>`<details><summary><small>${esc(v.heading)} ${loc('20-domain-model.md',v.line)}</small></summary><pre class="pre" style="color:var(--fg)">${esc(v.text)}</pre></details>`).join('');
  const apis=(T.apis||[]).filter(a=>a.reqs.includes(r.id)||a.nfrs.includes(r.id)).map(a=>`<small>${esc(a.id)} ${esc(a.method)} <span class="loc">${esc(a.path)}</span> ${loc((T.doc_paths||{})['40-api-contracts.md']||'40',a.line)}</small>`).join('<br>');
  const vch=T.versions&&T.versions.current>1?['pm:','req:'].filter(p=>((T.versions.key_changes||{})[p+r.id]||[]).includes(T.versions.current)):[];
  h+=`<article class="evc"><header>${badge(st)} <b>${esc(r.id)}</b> <small>${esc(r.title)}</small>${vch.length?` <span class="st WARN">v${T.versions.current} ${vch.map(p=>p==='pm:'?'PM 段落已改':'需求 / AC 已改').join('、')}</span>`:''}</header><div class="evg">
    <div><h4>PM 證據 · 文字</h4>${pm}${pmMock}</div>
    <div>${mid_}</div>
    <div><h4>RD 證據 · 文字</h4>${loc(r.file||'10-requirements.md',r.line)}${acRows}${ucs}${apis}</div></div></article>`;
}
h+=`</div></section>`;
}
// ================= F. 圖與表審計:看板優先,與人一起確認(以事情區分,不以人區分) =================
const AU=T.audit||null;
const SERVE=window.__SERVE__||null;
if(AU){
  const S=AU.summary, items=AU.items||[], DU=AU.duties||{}, TH=AU.threads||[];
  const SKEY='specdev-signoff:'+(T.feature||'')+':';
  const lsGet=k=>{try{return JSON.parse(localStorage.getItem(SKEY+k)||'null')}catch(e){return null}};
  const gOf=it=>G.filter(g=>(g.ids||[])[0]===it.id&&/^G-(DG-(target|process|consistency)|SA-tables)/.test(g.rule));
  const gOf2=it=>G.filter(g=>(g.ids||[])[0]===it.id&&g.rule==='G-S6-render');
  const lvOf=it=>{const g=gOf(it).concat(gOf2(it));return g.some(x=>x.level==='FAIL')?'FAIL':(g.some(x=>x.level==='WARN')?'WARN':'OK')};
  const changed=new Set(S.changed_since_last||[]);
  const todoDuties=it=>Object.entries(it.signoffs||{}).filter(([k,s])=>!['approved','n/a'].includes(s.status)).map(([k])=>k);
  const openQ=it=>TH.filter(q=>q.item===it.id&&q.status==='open').length;
  const rank=it=>it.signoff==='rejected'?0:lvOf(it)==='FAIL'?1:(it.signoff==='stale'||it.signoff==='upstream')?2:openQ(it)?3:lvOf(it)==='WARN'?4:changed.has(it.id)?5:(it.type==='diagram'&&todoDuties(it).length)?6:9;
  const order=[...items].sort((a,b)=>rank(a)-rank(b)||a.id.localeCompare(b.id));
  const SO={approved:['PASS','通過'],'n/a':['INFO','不需要'],stale:['WARN','通過後已變更'],upstream:['WARN','上游已變,請重看'],pending:['INFO','待確認'],rejected:['FAIL','退回']};
  const pill=(cls,t)=>`<span class="st ${cls}">${esc(t)}</span>`;
  const dLabel=k=>(DU[k]||{}).label||k;
  const reqTitle=id=>{const r=(T.requirements||[]).find(x=>x.id===id);return r?`${esc(id)} <small>${esc(r.title)}</small>`:`${esc(id)} ${pill('FAIL','不存在')}`};
  const logLines=it=>(it.process||[]).map(p=>p.tool?`<div class="loc">工具 ${esc(p.tool)}(自動生成)</div>`:`<div class="loc">#${p.seq} ${esc(p.stage)} ${esc(p.method)} → ${esc(p.out)}</div>`).join('')||`<div>${pill('WARN','無過程紀錄')}</div>`;
  const checkRows=it=>{const g=gOf(it);const cs=it.checks||[];
    const rows=cs.map(c=>{const n=(it.findings||[]).filter(x=>x.check===c).length;return `<tr><td class="loc">${esc(c)}</td><td>${n?pill('WARN','有發現 '+n):pill('PASS','通過')}</td></tr>`}).join('');
    const det=g.map(x=>`<tr><td class="loc">${esc(x.rule)}</td><td>${pill(x.level,x.level)} <small>${esc(x.msg)}${x.action?'<br>處置:'+esc(x.action):''}</small></td></tr>`).join('');
    return `<div class="tw"><table>${rows}${det}${(!rows&&!det)?'<tr><td><small>此類型沒有機器核對規格,由人確認</small></td></tr>':''}</table></div>`};
  const chips=it=>Object.entries(it.signoffs||{}).map(([k,s])=>{const m=SO[s.status]||SO.pending;return `<span class="st ${m[0]}" title="${esc(m[1])}${s.by?' · '+esc(s.by):''}">${esc(dLabel(k))} ${s.status==='approved'?'✓':s.status==='n/a'?'—':s.status==='rejected'?'✗':(s.status==='stale'||s.status==='upstream')?'!':'…'}</span>`}).join(' ');
  /* 確認清單:一張圖要做的每件事一列;同一個人可以全部做完(跨職能) */
  const checklist=it=>{const ks=Object.keys(it.signoffs||{});if(!ks.length)return '';
    const row=k=>{const s=it.signoffs[k];const loc_=lsGet(it.id+'@'+it.hash+'#'+k)||{};
      const v=SERVE?((s.status==='stale'||s.status==='upstream'||s.status==='pending')?'':s.status):(loc_.v||'');const note=SERVE?(s.note||''):(loc_.note||'');
      const r=(val,lab)=>`<label><input type="radio" name="d-${esc(it.id)}-${esc(k)}" value="${val}" ${v===val?'checked':''}> ${lab}</label>`;
      return `<div class="duty" data-duty="${esc(k)}"><div><b>${esc(dLabel(k))}</b> <small class="hint">${esc((DU[k]||{}).hint||'')} 視角</small> ${SO[s.status]?pill(SO[s.status][0],SO[s.status][1]):''}${s.by?` <small>${esc(s.by)} ${esc(s.date||'')}${s.version?' @v'+esc(s.version):''}</small>`:''}${(s.upstream||[]).length?`<div class="chips"><small>上游變更(點開看 diff):</small>${s.upstream.map(u=>keyDiff(u.key,u.v)).join('')}</div>`:''}
        <div><small>${esc((DU[k]||{}).ask||'')}</small></div></div>
        <div class="opts">${r('approved','通過')}${r('rejected','退回')}${r('n/a','不需要')}${r('','未決')}</div>
        <input type="text" class="note" placeholder="備註(退回寫怎麼改;不需要寫理由)" value="${esc(note)}"></div>`};
    return `<fieldset class="dec" data-id="${esc(it.id)}" data-hash="${esc(it.hash)}" data-kind="${esc(it.kind)}" data-tg="${esc((it.targets||[]).join(', ')||'*')}">
      <legend>要做的確認 <small>以事情區分;同一人可一次做完</small></legend>${ks.map(row).join('')}
      <div class="decbar"><button type="button" class="allok">全部通過</button>${SERVE?'<button type="button" class="send">送出</button>':''}<span class="decmsg loc" aria-live="polite"></span></div></fieldset>`};
  const thread=q=>`<div class="q ${q.status}"><div><b>Q${q.n}</b> <small>${esc(q.from)} → ${esc(q.to)} · ${esc(q.at)}</small> ${q.status==='open'?pill('WARN','未結'):pill('PASS','已結')}</div>
      <div>${esc(q.text)}</div>${q.answer?`<div class="ans"><small>${esc(q.answer)}</small></div>`:''}
      ${SERVE&&q.status==='open'?`<div class="qa" data-n="${q.n}"><input type="text" class="atext" placeholder="回答"><button type="button" class="abtn">回答並結案</button><button type="button" class="rbtn">只回覆</button></div>`:''}</div>`;
  const threads=it=>{const qs=TH.filter(q=>q.item===it.id);
    return `<div class="qs"><b>提問</b> <small>${qs.length} 則</small>${qs.map(thread).join('')}
      ${SERVE?`<div class="ask" data-item="${esc(it.id)}"><select class="qto" aria-label="希望誰回答"><option value="">任何人</option><option>PM</option><option>QA</option><option>RD</option></select><input type="text" class="qtext" placeholder="對這張圖有疑問?寫下來"><button type="button" class="qbtn">提問</button></div>`:(qs.length?'':'<div><small>要提問請用 spec-dev.py serve 開站台</small></div>')}</div>`};
  /* 表格列:把整張 SA 表顯示出來,標出這一列 */
  const saTable=it=>{const rows=((T.sa_tables||{})[it.kind]||[]).filter(r=>it.source===`${r._file}:${r._line}`||r._file===it.source.split(':')[0]);
    const cols=rows.length?Object.keys(rows[0]).filter(k=>!k.startsWith('_')):[];
    return rows.length?`<div class="tw"><table><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${rows.map(r=>`<tr class="${it.source===`${r._file}:${r._line}`?'hit':''}">${cols.map(c=>`<td><small>${esc(r[c])}</small></td>`).join('')}</tr>`).join('')}</table></div>`
      :`<pre class="pre" style="color:var(--fg)">${esc(it.heading)}</pre>`};
  const AUDB={};window.__AUDB=AUDB;

const runMermaid=root=>{if(!window.mermaid)return;

/* ================= 分頁(彈性架構)+ modal ================= */

const TABDEF=[
  {id:'overview',title:'總覽',match:/^(A\.|Gate 問題)/},
  {id:'evidence',title:'證據鏈',match:/^E\./},
  {id:'audit',title:'審計與確認',match:/^F\./},

  {id:'sa',title:'SA 建模',match:/^(SA0|SA 建模)/},
  {id:'glossary',title:'名詞與 codebase',match:/^(詞彙表|Survey)/},
  {id:'log',title:'方法論 log',match:/^D\./}];
const BOARD=DATA.board||{};
const app=document.getElementById('app'),panes={};
for(const sec of [...app.children].filter(n=>n.matches('section,.two'))){const txt=((sec.querySelector('h2')||{}).textContent||'').trim();
  const d=TABDEF.find(x=>x.match.test(txt))||{id:'other',title:'其他'};(panes[d.id]=panes[d.id]||{def:d,nodes:[]}).nodes.push(sec)}
const order_=(BOARD.tabs||TABDEF.map(x=>x.id).concat(['other'])).filter(id=>panes[id]);
const badgeOf={overview:G.filter(g=>g.level==='FAIL').length?`<span class="st FAIL">${G.filter(g=>g.level==='FAIL').length}</span>`:'',
  audit:(()=>{const n=document.querySelectorAll('#audlist [data-rank]');const k=[...n].filter(x=>+x.dataset.rank<9).length;return k?`<span class="st WARN">${k}</span>`:''})(),
  evidence:`<small>${(T.requirements||[]).length}</small>`,
  versions:T.versions&&T.versions.current?`<small>v${T.versions.current}</small>`:''};
const nav=document.createElement('nav');nav.className='tabs';nav.setAttribute('role','tablist');nav.setAttribute('aria-label','看板分頁');
for(const id of order_){const b=document.createElement('button');b.type='button';b.setAttribute('role','tab');b.id='tabbtn-'+id;b.dataset.tab=id;b.setAttribute('aria-controls','tab-'+id);
  b.innerHTML=esc(panes[id].def.title)+' '+(badgeOf[id]||'');nav.appendChild(b);
  const p=document.createElement('div');p.id='tab-'+id;p.setAttribute('role','tabpanel');p.setAttribute('aria-labelledby','tabbtn-'+id);p.hidden=true;p.tabIndex=0;
  for(const n of panes[id].nodes)p.appendChild(n);app.appendChild(p)}
for(const id of Object.keys(panes))if(!order_.includes(id))for(const n of panes[id].nodes)n.remove();   /* 設定裡沒列的分頁不顯示 */

let curTab='';
const hashArgs=()=>{const h=location.hash.slice(1);if(!h.includes('='))return h?{tab:h==='audit'?'audit':''}:{};const o={};for(const kv of h.split('&')){const i=kv.indexOf('=');if(i>0)o[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1))}return o};
const setHash=open=>history.replaceState(null,'',location.pathname+location.search+'#tab='+curTab+(open?'&open='+encodeURIComponent(open):''));
const showTab=(id,focus)=>{if(!order_.includes(id))id=order_.includes(BOARD.default_tab)?BOARD.default_tab:order_[0];curTab=id;

/* modal:一次只看一張圖 / 一張表 / 一個審計項目 */

document.body.appendChild(mdl);
const AUI=(T.audit&&T.audit.items)||[];
window.__DG=Object.fromEntries([...Object.values(DGS),...AUI.filter(i=>i.type==='diagram')].map(a=>[a.id,a.mermaid]));
const openKey=key=>{let title='',html='';

    title=`${a.id} · ${a.kind||''}`;

      <div class="dg"><pre class="mermaid" data-did="${esc(id)}">${esc(narrow(a.mermaid))}</pre></div><details><summary><small>原始碼</small></summary><pre class="pre">${esc(a.mermaid)}</pre></details>`}
  else if(key.startsWith('aud:')){const b=(window.__AUDB||{})[key.slice(4)];if(!b)return false;title=b.title;html=b.html}
  else if(MODAL[key]){title=MODAL[key].title;html=MODAL[key].html}else return false;

mdl.addEventListener('input',e=>{if(!e.target.classList.contains('mfilter'))return;const q=e.target.value.trim().toLowerCase();
  const tb=e.target.nextElementSibling&&e.target.nextElementSibling.matches('table,.tw')?e.target.nextElementSibling:mdl.querySelector('.mb table');
  for(const tr of [...tb.querySelectorAll('tr')].slice(1))tr.hidden=!!q&&!tr.textContent.toLowerCase().includes(q)});

{const a=hashArgs();showTab(a.tab||'');if(a.open)openKey(a.open)}
(function(){const list=document.getElementById('audlist');if(!list)return;
  const SERVE=window.__SERVE__||null,AUD=T.audit||{};
  const KEY='specdev-signoff:'+((DATA.trace||{}).feature||'')+':';
  const set=(k,v)=>{try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}};
  const get=k=>{try{return JSON.parse(localStorage.getItem(KEY+k)||'null')}catch(e){return null}};
  let who='';try{who=localStorage.getItem('specdev-reviewer')||''}catch(e){}
  const W=document.getElementById('reviewer');W.value=who;W.addEventListener('input',()=>{who=W.value.trim();try{localStorage.setItem('specdev-reviewer',who)}catch(e){};render()});
  let mode='cmd';
  const filt=f=>{for(const d of list.children){const r=+d.dataset.rank;
      d.hidden=!(f==='all'||(f==='todo'&&r<9)||(f.startsWith('duty:')&&d.dataset.todo.split(' ').includes(f.slice(5)))||d.dataset.phase===f||d.dataset.type===f)}
    for(const b of document.querySelectorAll('.audbar button'))b.classList.toggle('on',b.dataset.f===f)};
  document.querySelectorAll('.audbar button').forEach(b=>b.addEventListener('click',()=>filt(b.dataset.f)));filt('todo');
  const today=new Date().toISOString().slice(0,10);
  const specDir=(SERVE&&SERVE.spec_dir)||(DATA.trace||{}).spec_dir||'<spec 目錄>';
  const rowsOf=fs=>[...fs.querySelectorAll('.duty')].map(d=>({duty:d.dataset.duty,v:(d.querySelector('input[type=radio]:checked')||{}).value||'',note:d.querySelector('.note').value.trim()}));
  const bad=rs=>rs.some(r=>(r.v==='rejected'||r.v==='n/a')&&!r.note);
  const save=fs=>{const rs=rowsOf(fs);fs.classList.toggle('bad',bad(rs));if(SERVE)return;for(const r of rs)set(fs.dataset.id+'@'+fs.dataset.hash+'#'+r.duty,{v:r.v,note:r.note})};
  /* 靜態快照:判斷存在本機(每張圖 × 確認事項),輸出指令由全部判斷組成 */
  function render(){if(SERVE)return;const rows=[];
    for(const it of AUD.items||[]){if(it.type!=='diagram')continue;for(const k of Object.keys(it.signoffs||{})){const d=get(it.id+'@'+it.hash+'#'+k);
      if(d&&d.v)rows.push({id:it.id,hash:it.hash,kind:it.kind,tg:(it.targets||[]).join(', ')||'*',duty:k,v:d.v,note:d.note||''})}}
    const ta=document.getElementById('socmd');const q=s=>s.replace(/"/g,"'");
    ta.value=rows.length?(mode==='cmd'?rows.map(r=>`python3 spec-dev.py signoff ${specDir} ${r.id} --duty ${r.duty} --hash ${r.hash} --by "${who||'審核者'}"${r.v==='rejected'?' --reject':r.v==='n/a'?' --na':''}${r.note?` --note "${q(r.note)}"`:''}`).join('\n')
      :rows.map(r=>`| ${r.id} | ${r.duty} | ${r.kind} | ${r.tg} | ${r.v==='approved'?r.hash:''} | ${r.hash} | ${r.v} | ${who} | ${today} | ${r.note.replace(/\|/g,'/')} |`).join('\n')):'';
    document.getElementById('sostat').textContent=rows.length?`${rows.length} 筆判斷${bad(rows)?' · 有退回或不需要沒寫理由':''}`:'尚未做任何判斷';}
  mdl.addEventListener('change',e=>{const fs=e.target.closest('fieldset.dec');if(fs){save(fs);render()}});
  mdl.addEventListener('input',e=>{if(e.target.classList.contains('note')){const fs=e.target.closest('fieldset.dec');if(fs){save(fs);render()}}});
  mdl.addEventListener('click',e=>{const b=e.target.closest('button.allok');if(!b)return;const fs=b.closest('fieldset.dec');
    fs.querySelectorAll('.duty input[value="approved"]').forEach(r=>{r.checked=true});save(fs);render()});
  if(!SERVE){
    document.getElementById('somd').addEventListener('click',e=>{mode=mode==='cmd'?'md':'cmd';e.target.textContent=mode==='cmd'?'改顯示 md 列':'改顯示指令';render()});
    document.getElementById('socopy').addEventListener('click',()=>{const ta=document.getElementById('socmd');
      (navigator.clipboard?navigator.clipboard.writeText(ta.value):Promise.reject()).then(()=>{document.getElementById('sostat').textContent='已複製'}).catch(()=>{ta.select();document.getElementById('sostat').textContent='請按 Ctrl/⌘+C 複製'})});
    render();return}
  /* ---- 站台模式:直接寫回 SSOT(audit/signoff.md、threads.md),重新整理後回到同一個項目 ---- */
  const post=(path,body)=>fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());
  const needWho=()=>{if(who)return false;mdl.close();showTab('audit');W.placeholder='先填你的名字再送出';W.focus();return true};
  const reloadAt=key=>{location.hash='tab=audit&open='+encodeURIComponent(key);location.reload()};
  mdl.addEventListener('click',async e=>{
    const send=e.target.closest('button.send');
    if(send){const fs=send.closest('fieldset.dec'),msg=fs.querySelector('.decmsg');if(needWho())return;
      const groups={};for(const r of rowsOf(fs)){if(!r.v)continue;const k=r.v+'\u0000'+r.note;(groups[k]=groups[k]||{decision:r.v,note:r.note,duties:[]}).duties.push(r.duty)}
      if(!Object.keys(groups).length){msg.textContent='沒有選任何決定';return}
      send.disabled=true;const errs=[];
      for(const g of Object.values(groups)){const res=await post('/api/signoff',{id:fs.dataset.id,hash:fs.dataset.hash,by:who,...g}).catch(x=>({error:String(x)}));if(res.error)errs.push(res.error)}
      send.disabled=false;if(errs.length){msg.textContent=errs.join(' / ');return}reloadAt('aud:'+fs.dataset.id);return}
    const qb=e.target.closest('button.qbtn');
    if(qb){const box=qb.closest('.ask');const t=box.querySelector('.qtext');if(needWho())return;
      const res=await post('/api/ask',{item:box.dataset.item,to:box.querySelector('.qto').value,by:who,text:t.value});
      if(res.error){t.setCustomValidity(res.error);t.reportValidity();setTimeout(()=>t.setCustomValidity(''),2000);return}reloadAt('aud:'+box.dataset.item);return}
    const ab=e.target.closest('button.abtn,button.rbtn');
    if(ab){const box=ab.closest('.qa');const t=box.querySelector('.atext');if(needWho())return;
      const res=await post('/api/answer',{n:box.dataset.n,by:who,text:t.value,close:ab.classList.contains('abtn')});
      if(res.error){t.setCustomValidity(res.error);t.reportValidity();return}reloadAt(mdl.dataset.key)}});
  /* 別人改了 md 或做了確認 → 提示重新整理(不自動刷,避免吃掉你正在打的字) */
  setInterval(()=>fetch('/api/state').then(r=>r.json()).then(s=>{if(s.changed||s.version!==SERVE.version){let n=document.getElementById('stale-note');
    if(!n){n=document.createElement('div');n.id='stale-note';n.setAttribute('role','status');n.className='stale-note';n.innerHTML='內容有更新(md 或別人的確認)。<button type="button">重新整理</button>';
      n.querySelector('button').onclick=()=>location.reload();document.body.prepend(n)}}}).catch(()=>{}),15000);
})();

  box.querySelector('.x').onclick=()=>box.close();box.addEventListener('click',e=>{if(e.target===box)box.close()});

const lk=document.getElementById('lk');
if(lk)lk.addEventListener('input',()=>{const q=lk.value.trim().toLowerCase();const box=document.getElementById('lkout');

document.getElementById('lf').addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#logbox div').forEach(d=>d.style.display=d.dataset.k.toLowerCase().includes(q)?'':'none')});

<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
(function(){
  function boot(){
    mermaid.initialize({startOnLoad:false,securityLevel:'loose',theme:matchMedia('(prefers-color-scheme:dark)').matches?'dark':'default'});
    if(window.__renderVisible)window.__renderVisible();
  }
  function fail(){
    var n=document.createElement('div');
    n.setAttribute('role','status');
    n.style.cssText='position:sticky;top:0;z-index:9;padding:8px 12px;background:var(--warnbg);color:var(--warn);border-bottom:1px solid var(--line);font-size:13px';
    n.textContent='圖表引擎(mermaid)無法從 CDN 載入,圖以原始碼顯示。封閉網路請用 spec-dev.py all --offline 產生內嵌版面板。';
    document.body.prepend(n);
  }
  if(window.mermaid){boot();return}
  var s=document.createElement('script');
  s.src='https://unpkg.com/mermaid@11.4.1/dist/mermaid.min.js';
  s.onload=function(){window.mermaid?boot():fail()};
  s.onerror=fail;
  document.head.appendChild(s);
})();
</script>
