"sequenceDiagram\n  actor U as SupportAgent\n  participant CMP001 as OrderDetailPage\n  participant CMP003 as CancellationHistoryTable\n  participant CMP004 as orderStore\n  participant CMP005 as ordersApi\n  U->>CMP001: ListCancellations\n  CMP001->>CMP003: ListCancellations\n  CMP003->>CMP004: ListCancellations\n  CMP004->>CMP005: ListCancellations\n  CMP005-->>CMP004: ok\n  CMP004-->>CMP003: ok\n  CMP003-->>CMP001: ok\n  CMP001-->>U: ok"}, {"id": "STM-UI-001", "kind": "state", "file": "ui/41-ui-spec.md", "line": 10, "heading": "STM-UI-001 OrderDetailPage (REQ-001)", "req": "REQ-001", "reqs": ["REQ-001"], "mermaid": "stateDiagram-v2\n  [*] --> Idle\n  Idle --> Loading: submit\n  Loading --> Done: 200\n  Loading --> Idle: error"}], "spec_dir": "specs/rd/order-cancel/spec", "sources": {"pm_spec": {"path": "specs/in-progress/order-cancel/pm-spec.md", "exists": true, "sections": [{"anchor": "PM§Order cancellation and refund (PM spec)", "title": "Order cancellation and refund (PM spec)", "level": 1, "line": 1, "text": ""}, {"anchor": "PM§1", "title": "Background and Goals", "level": 2, "line": 3, "text": "Today a customer must phone support to cancel an order. Goal: self-service cancel and automatic refund through the payment gateway."}, {"anchor": "PM§2", "title": "Users", "level": 2, "line": 6, "text": "customer: wants to cancel an order quickly. support agent: needs the cancellation history. system: issues the refund."}, {"anchor": "PM§3", "title": "Functional Requirements", "level": 2, "line": 9, "text": ""}, {"anchor": "PM§3.1", "title": "A customer can cancel an order before it is shipped", "level": 3, "line": 10, "text": "A customer can cancel an order while it is placed. An order that is already shipped cannot be cancelled. After cancel, the order status becomes cancelled."}, {"anchor": "PM§3.2", "title": "The system issues a refund through the payment gateway after cancellation", "level": 3, "line": 13, "text": "After an order is cancelled, the system issues a refund through the payment gateway. When the payment gateway fails, the system retries up to 3 times and keeps the order cancelled. A successful refund marks the order as refunded."}, {"anchor": "PM§3.3", "title": "A support agent can view the cancellation history", "level": 3, "line": 16, "text": "A support agent can view the cancellation history of every order, including time and reason."}, {"anchor": "PM§4", "title": "Non-functional Requirements", "level": 2, "line": 19, "text": "A refund must finish within 5 minutes after cancellation for 95% of order records."}, {"anchor": "PM§5", "title": "Acceptance", "level": 2, "line": 22, "text": "- an order is placed → the customer cancels it → the order status is cancelled\n- an order is shipped → the customer cancels it → the response is 409 ORDER_SHIPPED and the status is unchanged\n- an order is cancelled and paid → the system issues the refund → the payment gateway is called and the order is refunded\n- the payment gateway times out → the system issues the refund → it retries 3 times and the order stays cancelled\n- order records were cancelled → the support agent opens the history → each row shows the order, time and reason"}], "lines": 27}, "mocks": [{"path": "specs/in-progress/order-cancel/mock/order.html", "exists": true, "html": "<!doctype html><html><meta charset=\"utf-8\"><title>mock</title><body style=\"font-family:system-ui\"><h2>order <span data-state=\"Placed\">Placed</span></h2><!-- states: Placed/Shipped/Cancelled/Refunded --><button data-action=\"CancelOrder\">cancel</button><button data-action=\"ListCancellations\">view</button><table><tr><th>order</th><th>status</th></tr></table></body></html>\n", "elements": [{"tag": "button", "id": "", "name": "", "text": "cancel", "line": 1}, {"tag": "button", "id": "", "name": "", "text": "view", "line": 1}]}], "refs": [{"path": "specs/in-progress/order-cancel/refs.md", "exists": true}]}, "ac_text": {"AC-001-1": {"text": "# AC-001-1\nGiven an order is placed\nWhen the customer cancels it\nThen the order status is cancelled", "line": 12}, "AC-001-2": {"text": "# AC-001-2\nGiven an order is shipped\nWhen the customer cancels it\nThen the response is 409 ORDER_SHIPPED and the status is unchanged", "line": 17}, "AC-002-1": {"text": "# AC-002-1\nGiven an order is cancelled and paid\nWhen the system issues the refund\nThen the payment gateway is called and the order is refunded", "line": 22}, "AC-002-2": {"text": "# AC-002-2\nGiven the payment gateway times out\nWhen the system issues the refund\nThen it retries 3 times and the order stays cancelled", "line": 27}, "AC-003-1": {"text": "# AC-003-1\nGiven order records were cancelled\nWhen the support agent opens the history\nThen each row shows the order, time and reason", "line": 32}}, "uc_text": {"UC-001": {"heading": "UC-001 A customer can cancel an order before it is shipped (REQ-001)", "line": 4, "text": "- Primary actor: customer\n- Trigger: the customer cancels it\n- Precondition: an order is placed\n- Postcondition (success guarantee): the order status is cancelled\n- Main flow:\n  1. the customer cancels it\n  2. the order status is cancelled\n- Alternative flow: none\n- Exception flow: the response is 409 ORDER_SHIPPED and the status is unchanged\n\n```mermaid\nflowchart LR\n  S([\"customer\"]) --> P[\"the customer cancels it\"] --> Q[\"the order status is cancelled\"]\n  P -.-> X[\"the response is 409 ORDER_SHIPPED and the status is unchanged\"]\n```"}, "UC-002": {"heading": "UC-002 The system issues a refund through the payment gateway after cancellation (REQ-002)", "line": 21, "text": "- Primary actor: system\n- Trigger: the system issues the refund\n- Precondition: an order is cancelled and paid\n- Postcondition (success guarantee): the payment gateway is called and the order is refunded\n- Main flow:\n  1. the system issues the refund\n  2. the payment gateway is called and the order is refunded\n- Alternative flow: none\n- Exception flow: it retries 3 times and the order stays cancelled\n\n```mermaid\nflowchart LR\n  S([\"system\"]) --> P[\"the system issues the refund\"] --> Q[\"the payment gateway is called and the order is refunded\"]\n  P -.-> X[\"it retries 3 times and the order stays cancelled\"]\n```"}, "UC-003": {"heading": "UC-003 A support agent can view the cancellation history (REQ-003)", "line": 38, "text": "- Primary actor: support agent\n- Trigger: the support agent opens the history\n- Precondition: order records were cancelled\n- Postcondition (success guarantee): each row shows the order, time and reason\n- Main flow:\n  1. the support agent opens the history\n  2. each row shows the order, time and reason\n- Alternative flow: none\n- Exception flow: none\n\n```mermaid\nflowchart LR\n  S([\"support agent\"]) --> P[\"the support agent opens the history\"] --> Q[\"each row shows the order, time and reason\"]\n```"}}, "screens": [{"screen": "OrderDetailPage", "route": "/order", "components": ["CMP-001", "CMP-002", "CMP-003", "CMP-004", "CMP-005"], "mock": "specs/in-progress/order-cancel/mock/order.html", "reqs": ["REQ-001", "REQ-002", "REQ-003"], "line": 6, "file": "ui/41-ui-spec.md"}], "ui_elements": [], "ui_validation": [{"screen": "OrderDetailPage", "field": "CancelOrder", "rule": "an order is shipped", "message": "the response is 409 ORDER_SHIPPED and the status is unchanged", "acs": ["AC-001-2"], "line": 21}], "doc_paths": {"00-overview.md": "00-overview.md", "10-requirements.md": "10-requirements.md", "20-domain-model.md": "20-domain-model.md", "30-architecture-c4.md": "30-architecture-c4.md", "40-api-contracts.md": "api/40-api-contracts.md", "41-ui-spec.md": "ui/41-ui-spec.md", "60-test-design.md": "60-test-design.md"}, "sa_files": ["sa/00-lexicon.md", "sa/01-break-words.md", "sa/02-entities-relations.md", "sa/03-roles.md", "sa/04-usecase.md", "sa/05-activity.md", "sa/06-sequence.md", "sa/07-state.md", "survey-mapping.md"], "sa_artifacts": [{"id": "CLS-SA-001", "kind": "class", "file": "sa/02-entities-re y. support agent: needs the cancellation history. system: issues the refund.\n\n## 3 Functional Requirements\n### 3.1 A customer can cancel an order before it is shipped\nA customer can cancel an order while it is placed. An order that is already shipped cannot be cancelled. After cancel, the order status becomes cancelled.\n\n### 3.2 The system issues a refund through the payment gateway after cancellation\nAfter an order is cancelled, the system issues a refund through the payment gateway. When the payment gateway fails, the system retries up to 3 times and keeps the order cancelled. A successful refund marks the order as refunded.\n\n### 3.3 A support agent can view the cancellation history\nA support agent can view the cancellation history of every order, including time and reason.\n\n## 4 Non-functional Requirements\nA refund must finish within 5 minutes after cancellation for 95% of order records.\n\n## 5 Acceptance\n- an order is placed → the customer cancels it → the order status is cancelled\n- an order is shipped → the customer cancels it → the response is 409 ORDER_SHIPPED and the status is unchanged\n- an order is cancelled and paid → the system issues the refund → the payment gateway is called and the order is refunded\n- the payment gateway times out → the system issues the refund → it retries 3 times and the order stays cancelled\n- order records were cancelled → the support agent opens the history → each row shows the order, time and reason\n", "specs/rd/order-cancel/spec/00-overview.md": "# Order cancellation and refund — overview\n\n## Background and Goals\nToday a customer must phone support to cancel an order. Goal: self-service cancel and automatic refund through the payment gateway.\n\n## Scope\nfrontend only\n\n## Glossary\n| Term | Definition | Source |\n|---|---|---|\n| order (Order) | order | PM§3.1 |\n| refund (Refund) | refund | PM§3.2 |\n\n## Source Map\n| PM Source | RD Artifact |\n|---|---|\n| PM§1 | 00-overview.md |\n| PM§3.1 | REQ-001, UC-001 |\n| PM§3.2 | REQ-002, UC-002 |\n| PM§3.3 | REQ-003, UC-003 |\n| PM§4 | NFR-001 |\n| specs/in-progress/order-cancel/mock/order.html | STM-UI-001 |\n\n## Sources\n- PM spec: `specs/in-progress/order-cancel/pm-spec.md`\n- Mock: `specs/in-progress/order-cancel/mock/order.html`\n- refs: `specs/in-progress/order-cancel/refs.md`\n", "specs/rd/order-cancel/spec/10-requirements.md": "# Order cancellation and refund — requirements\n\n## Requirements\n| ID | Requirement | Type | Source Anchor | AC |\n|---|---|---|---|---|\n| REQ-001 | A customer can cancel an order before it is shipped | functional, state_heavy | PM§3.1 | AC-001-1, AC-001-2 |\n| REQ-002 | The system issues a refund through the payment gateway after cancellation | functional, integration | PM§3.2 | AC-002-1, AC-002-2 |\n| REQ-003 | A support agent can view the cancellation history | functional | PM§3.3 | AC-003-1 |\n\n## Acceptance Criteria\n```gherkin\n# AC-001-1\nGiven an order is placed\nWhen the customer cancels it\nThen the order status is cancelled\n\n# AC-001-2\nGiven an order is shipped\nWhen the customer cancels it\nThen the response is 409 ORDER_SHIPPED and the status is unchanged\n\n# AC-002-1\nGiven an order is cancelled and paid\nWhen the system issues the refund\nThen the payment gateway is called and the order is refunded\n\n# AC-002-2\nGiven the payment gateway times out\nWhen the system issues the refund\nThen it retries 3 times and the order stays cancelled\n\n# AC-003-1\nGiven order records were cancelled\nWhen the support agent opens the history\nThen each row shows the order, time and reason\n\n```\n\n## Non-functional Requirements\n| ID | Stimulus | Source | Environment | Artifact | Response | Measure | Bound CMP/API | AC |\n|---|---|---|---|---|---|---|---|---|\n| NFR-001 | A refund must finish within 5 minutes after cancellation for 95% of order records. | user | normal load | API-002 | ok | P95 < 5 min | API-002 | AC-N01-1 |\n\n## Gaps\n| # | Question | Affects REQ | Assumption |\n|---|---|---|---|\n", "specs/rd/order-cancel/spec/20-domain-model.md": "# Order cancellation and refund — domain model\n\n## Use Cases\n### UC-001 A customer can cancel an order before it is shipped (REQ-001)\n- Primary actor: customer\n- Trigger: the customer cancels it\n- Precondition: an order is placed\n- Postcondition (success guarantee): the order status is cancelled\n- Main flow:\n  1. the customer cancels it\n  2. the order status is cancelled\n- Alternative flow: none\n- Exception flow: the response is 409 ORDER_SHIPPED and the status is unchanged\n\n```mermaid\nflowchart LR\n  S([\"customer\"]) --> P[\"the customer cancels it\"] --> Q[\"the order status is cancelled\"]\n  P -.-> X[\"the response is 409 ORDER_SHIPPED and the status is unchanged\"]\n```\n\n### UC-002 The system issues a refund through the payment gateway after cancellation (REQ-002)\n- Primary actor: system\n- Trigger: the system issues the refund\n- Precondition: an order is cancelled and paid\n- Postcondition (success guarantee): the payment gateway is called and the order is refunded\n- Main flow:\n  1. the system issues the refund\n  2. the payment gateway is called and the order is refunded\n- Alternative flow: none\n- Exception flow: it retries 3 times and the order stays cancelled\n\n```mermaid\nflowchart LR\n  S([\"system\"]) --> P[\"the system issues the refund\"] --> Q[\"the payment gateway is called and the order is refunded\"]\n  P -.-> X[\"it retries 3 times and the order stays cancelled\"]\n```\n\n### UC-003 A support agent can view the cancellation history (REQ-003)\n- Primary actor: support agent\n- Trigger: the support agent opens the history\n- Precondition: order records were cancelled\n- Postcondition (success guarantee): each row shows the order, time and reason\n- Main flow:\n  1. the support agent opens the history\n  2. each row shows the order, time and reason\n- Alternative flow: none\n- Exception flow: none\n\n```mermaid\nflowchart LR\n  S([\"support agent\"]) --> P[\"the support agent opens the history\"] --> Q[\"each row shows the order, time and reason\"]\n```\n\n## State Machines\n### STM-DOM-001 Order.Status (REQ-001, REQ-002)\n```mermaid\nstateDiagram-v2\n  [*] --> Placed: PlaceOrder\n  Placed --> Shipped: Ship\n  Placed --> Cancelled: CancelOrder\n  Cancelled --> Refunded: IssueRefund\n```\n\n## Domain Model\n| Type | Name | Invariant |\n|---|---|---|\n| Aggregate Root | Order | Status: Placed → Shipped → Cancelled → Refunded |\n| Entity | Refund | — |\n\n### CLS-001 Order (REQ-001)\n```mermaid\nclassDiagram\n  class Order { +Id +Status }\n  Order --> Refund : has\n```\n", "specs/rd/order-cancel/spec/30-architecture-c4.md": "# Order cancellation and refund — architecture (C4)\n\n## Context (L1)\n### C4-L1\n```mermaid\nC4Context\n  Person(u, \"customer\")\n  System(sys, \"Order cancellation and refund\")\n  System_Ext(ext, \"BackendAPI\")\n  Rel(u, sys, \"use\")\n  Rel(sys, ext, \"call\")\n```\n\n## Container (L2)\n### C4-L2\n```mermaid\nC4Container\n  Container(web, \"Web\", \"React\", \"\")\n```\n\n## Component (L3)\n| ID | Name | Layer | Context | depends | external | Tech |\n|---|---|---|---|---|---|---|\n| CMP-001 | OrderDetailPage | Page | Orders | CMP-002, CMP-003, CMP-004 |  | React |\n| CMP-002 | CancelOrderDialog | Component | Orders | CMP-004 |  | React |\n| CMP-003 | CancellationHistoryTable | Component | Orders | CMP-004 |  | React |\n| CMP-004 | orderStore | Store | Orders | CMP-005 |  | Zustand |\n| CMP-005 | ordersApi | ApiClient | Orders |  | BackendAPI |  |\n\n### C4-L3\n```mermaid\nflowchart LR\n  CMP001[\"OrderDetailPage<br/>Page\"]\n  CMP002[\"CancelOrderDialog<br/>Component\"]\n  CMP003[\"CancellationHistoryTable<br/>Component\"]\n  CMP004[\"orderStore<br/>Store\"]\n  CMP005[\"ordersApi<br/>ApiClient\"]\n  CMP001 --> CMP002\n  CMP001 --> CMP003\n  CMP001 --> CMP004\n  CMP002 --> CMP004\n  CMP003 --> CMP004\n  CMP004 --> CMP005\n```\n\n## Traceability\n| AC | CMP | via | Responsibility |\n|---   CMP001-->>U: ok\n```\n\n### SEQ-003 (UC-003 / REQ-003)\n```mermaid\nsequenceDiagram\n  actor U as SupportAgent\n  participant CMP001 as OrderDetailPage\n  participant CMP003 as CancellationHistoryTable\n  participant CMP004 as orderStore\n  participant CMP005 as ordersApi\n  U->>CMP001: ListCancellations\n  CMP001->>CMP003: ListCancellations\n  CMP003->>CMP004: ListCancellations\n  CMP004->>CMP005: ListCancellations\n  CMP005-->>CMP004: ok\n  CMP004-->>CMP003: ok\n  CMP003-->>CMP001: ok\n  CMP001-->>U: ok\n```\n\n", "specs/rd/order-cancel/spec/60-test-design.md": "# Order cancellation and refund — test design\n\n## Test Components\n| ID | Name | kind | CMP Refs | AC Refs |\n|---|---|---|---|---|\n| TST-001 | OrderDetailPageTests | e2e | CMP-001 | AC-001-1, AC-001-2, AC-002-1, AC-002-2, AC-003-1 |\n| TST-002 | CancelOrderDialogTests | unit | CMP-002 | AC-001-1, AC-001-2 |\n| TST-003 | CancellationHistoryTableTests | unit | CMP-003 | AC-003-1 |\n| TST-004 | orderStoreTests | unit | CMP-004 | AC-001-1, AC-001-2, AC-002-1, AC-002-2, AC-003-1 |\n| TST-005 | ordersApiTests | contract | CMP-005 | AC-001-1, AC-001-2, AC-002-1, AC-002-2, AC-003-1 |\n| TST-006 | NFR-001FitnessTest | e2e | CMP-005 | AC-N01-1 |\n\n## Fitness Function\n| NFR | Measurement | Threshold | Where |\n|---|---|---|---|\n| NFR-001 | k6 / Playwright | P95 < 5 min | CI nightly |\n", "specs/rd/order-cancel/spec/api/40-api-contracts.md": "# Order cancellation and refund — API spec\n\n## API List\n| ID | Method | Path | Request | Response | REQ | Bound NFR | CMP |\n|---|---|---|---|---|---|---|---|\n| API-001 | POST | /orders/{id}/cancel | json | 200 | REQ-001 |  | CMP-005 |\n| API-002 | POST | /orders/{id}/refund | json | 200 | REQ-002 | NFR-001 | CMP-005 |\n| API-003 | GET | /orders/cancellations | json | 200 | REQ-003 |  | CMP-005 |\n\n## External Dependencies and Failure Modes\n| External System | Caller CMP | Timeout | Retry | Fallback | Compensation |\n|---|---|---|---|---|---|\n| BackendAPI | CMP-00 ec-review/sa/04-usecase.md": "# SA4 Use Case Diagram\n\n## Use Case Diagram\n### UCD-001 (REQ-001, REQ-002, REQ-003)\n```mermaid\nflowchart LR\n  customer([\"customer\"]) --> cancel((\"cancel\"))\n  system([\"system\"]) --> issue_refund((\"refund\"))\n  support_agent([\"support agent\"]) --> view_history((\"view\"))\n```\n", "specs/rd/order-cancel/spec-review/sa/05-activity.md": "# SA5 Activity Diagram\n\n## Activity Diagram\n### ACT-001 (REQ-001)\n```mermaid\nflowchart TD\n  A[\"the customer cancels it\"] --> B{\"an order is placed?\"}\n  B -->|yes| C[\"the order status is cancelled\"]\n  B -->|no| D[\"the response is 409 ORDER_SHIPPED and the status is unchanged\"]\n```\n\n### ACT-002 (REQ-002)\n```mermaid\nflowchart TD\n  A[\"the system issues the refund\"] --> B{\"an order is cancelled and paid?\"}\n  B -->|yes| C[\"the payment gateway is called and the order is refunded\"]\n  B -->|no| D[\"it retries 3 times and the order stays cancelled\"]\n```\n\n### ACT-003 (REQ-003)\n```mermaid\nflowchart TD\n  A[\"the support agent opens the history\"] --> B{\"order records were cancelled?\"}\n  B -->|yes| C[\"each row shows the order, time and reason\"]\n  B -->|no| E[\"—\"]\n```\n\n", "specs/rd/order-cancel/spec-review/sa/06-sequence.md": "# SA6 Sequence Diagram\n\n## Sequence Diagram\n### SEQ-SA-001 (REQ-001)\n```mermaid\nsequenceDiagram\n  actor U as Customer\n  participant Web\n  participant BackendAPI\n  U->>Web: CancelOrder\n  Web->>BackendAPI: CancelOrder\n  Web-->>U: ok\n```\n\n### SEQ-SA-002 (REQ-002)\n```mermaid\nsequenceDiagram\n  actor U as System\n  participant Web\n  participant BackendAPI\n  U->>Web: IssueRefund\n  Web->>BackendAPI: IssueRefund\n  Web-->>U: ok\n```\n\n### SEQ-SA-003 (REQ-003)\n```mermaid\nsequenceDiagram\n  actor U as SupportAgent\n  participant Web\n  participant BackendAPI\n  U->>Web: ListCancellations\n  Web->>BackendAPI: ListCancellations\n  Web-->>U: ok\n```\n\n", "specs/rd/order-cancel/spec-review/sa/07-state.md": "# SA7 State Diagram\n\n## State Diagram\n### STM-SA-001 Order.Status (REQ-001, REQ-002)\n```mermaid\nstateDiagram-v2\n  [*] --> Placed: PlaceOrder\n  Placed --> Shipped: Ship\n  Placed --> Cancelled: CancelOrder\n  Cancelled --> Refunded: IssueRefund\n```\n", "specs/rd/order-cancel/spec-review/survey-mapping.md": "# Survey Mapping\n\n## Mapping\n| Element | Element Type | Status | Code Target | Evidence | Note |\n|---|---|---|---|---|---|\n| Order | Aggregate | modify | Order | src/web/src/types/Order.ts:4 | |\n| Shipped rule | Rule | existing | Order.Shipped | src/web/src/types/Order.ts:2 \"Shipped\" | |\n| Refund | Entity | new | Refund | | |\n| GetOrder | Query | existing | getOrder | src/web/src/api/ordersApi.ts:3; src/web/src/api/ordersApi.ts:4 \"/orders\" | |\n| CancelOrder | Command | new | CancelOrder | | |\n| IssueRefund | Command | new | IssueRefund | | |\n| ListCancellations | Query | new | ListCancellations | | |\n| OrderDetailPage | Page | modify | OrderDetailPage | src/web/src/pages/OrderDetailPage.tsx:3; src/web/src/pages/OrderDetailPage.tsx:4 \"getOrder(id)\" | |\n", "specs/in-progress/order-cancel/refs.md": "# refs\n\n- `docs/architectures/overview.md`\n- shape: frontend only\n"}, "snippets": {"src/web/src/types/Order.ts:4": {"path": "src/web/src/types/Order.ts", "start": 1, "lines": ["// shared front-end types (previous issue)", "export type OrderStatus = 'Placed' | 'Shipped';", "", "export type Order = {", "  id: string;", "  status: OrderStatus;", "};"]}, "src/web/src/types/Order.ts:2": {"path": "src/web/src/types/Order.ts", "start": 1, "lines": ["// shared front-end types (previous issue)", "export type OrderStatus = 'Placed' | 'Shipped';", "", "export type Order = {", "  id: string;", "  status: OrderStatus;", "};"]}, "src/web/src/api/ordersApi.ts:3": {"path": "src/web/src/api/ordersApi.ts", "start": 1, "lines": ["import type { Order } from '../types/Order';", "", "export async function getOrder(id: string): Promise<Order> {", "  return fetch(`/orders/${id}`).then(r => r.json());", "}"]}, "src/web/src/api/ordersApi.ts:4": {"path": "src/web/src/api/ordersApi.ts", "start": 1, "lines": ["import type { Order } from '../types/Order';", "", "export async function getOrder(id: string): Promise<Order> {", "  return fetch(`/orders/${id}`).then(r => r.json());", "}"]}, "src/web/src/pages/OrderDetailPage.tsx:3": {"path": "src/web/src/pages/OrderDetailPage.tsx", "start": 1, "lines": ["import { getOrder } from '../api/ordersApi';", "", "export function OrderDetailPage({ id }: { id: string }) {", "  void getOrder(id);", "  return <main />;", "}"]}, "src/web/src/pages/OrderDetailPage.tsx:4": {"path": "src/web/src/pages/OrderDetailPage.tsx", "start": 1, "lines": ["import { getOrder } from '../api/ordersApi';", "", "export function OrderDetailPage({ id }: { id: string }) {", "  void getOrder(id);", "  return <main />;", "}"]}}}};

<script>
(function(){
if(!DATA){document.getElementById('app').innerHTML='<p>尚未注入資料。請執行 spec-dev.py panel &lt;dir&gt;。</p>';return}
const T=DATA.trace,LOG=DATA.log||[],K=DATA.kpis,G=DATA.gate||[],BC=DATA.boundary||[];
const LAYERS=['Api','Application','Domain','Infrastructure'],KINDS=['unit','integration','contract','e2e'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cmp=Object.fromEntries((T.components||[]).map(c=>[c.id,c]));
const apiById=Object.fromEntries((T.apis||[]).map(a=>[a.id,a]));
const superseded=new Set(LOG.filter(e=>e.supersedes!=null).map(e=>e.supersedes));
const live=LOG.filter(e=>!superseded.has(e.seq));
const acOwner={};for(const r of T.requirements)for(const a of r.acs)acOwner[a]=r.id;
const acLinksOf=r=>(T.ac_links||[]).filter(l=>r.acs.includes(l.ac));
const cmpsOf=r=>{const s=new Set(acLinksOf(r).map(l=>l.component));for(const b of (r.binds||[])){if(cmp[b])s.add(b);if(apiById[b])for(const c of apiById[b].component)s.add(c)}return [...s].sort()};
const testsOf=r=>(T.tests||[]).filter(t=>t.acs.some(a=>r.acs.includes(a)));
const idsOf=r=>new Set([r.id,...r.acs]);
const gateOf=r=>{const ids=idsOf(r);return G.filter(g=>(g.ids||[]).some(i=>ids.has(i)))};
const bcOf=r=>{const ids=idsOf(r);for(const c of cmpsOf(r))ids.add(c);return BC.filter(b=>(b.ids||[]).some(i=>ids.has(i)))};
const status=r=>{const g=gateOf(r),b=bcOf(r);if(g.some(x=>x.level==='FAIL')||b.some(x=>x.status==='FAIL'))return'FAIL';if(g.some(x=>x.level==='WARN')||b.some(x=>x.status==='WARN'))return'WARN';return'PASS'};
const badge=s=>`<span class="st ${s}">${s}</span>`;
const fmt=e=>{const gap=(e.gaps||[]).length?`  gap="${e.gaps.join('; ')}"`:'';const note=e.note?`  "${e.note}"`:'';
  return `[${e.req}] ${e.stage} ${String(e.method).padEnd(22)} ${String(e.in).padEnd(28)} → ${String(e.out).padEnd(22)} rule=${String(e.rule).padEnd(4)} ev=${e.evidence||'?'}${gap}${note}`};
const logLine=e=>`<div class="${superseded.has(e.seq)?'dead':(String(e.out).toUpperCase()==='FAIL'?'fail':(e.evidence==='assumed'?'low':''))}" data-k="${esc(e.req+' '+e.stage+' '+e.rule+' '+e.method+' '+(e.evidence||''))}">${esc(fmt(e))}</div>`;
/* ---- 圖與表:預設不展開,看板上只放晶片;點了開 modal 顯示那一張圖 / 那一張表(審計查詢用) ---- */
const DGS={},MODAL={};
const chip=(key,label,sub,icon)=>`<button type="button" class="chip" data-open="${esc(key)}">${icon} ${esc(label)}${sub?` <small>${esc(sub)}</small>`:''}</button>`;
const mer=a=>{DGS[a.id]=a;return chip('dg:'+a.id,a.id,[a.kind,a.file?a.file+(a.line?':'+a.line:''):(a.auto?'自動':'')].filter(Boolean).join(' · '),'◫')};
const pill_=(cls,t)=>`<span class="st ${cls}">${esc(t)}</span>`;
const tbl=(key,title,html,sub)=>{MODAL['tb:'+key]={title,html};return chip('tb:'+key,title,sub,'▦')};
const VR=T.versions||null;
const diffHtml=d=>`<div class="mmeta"><span class="st PASS">+${d.add}</span> <span class="st FAIL">−${d.del}</span>${d.truncated?' <small>(只顯示前 400 行)</small>':''}</div><pre class="diff">${d.lines.map(l=>`<span class="${l.startsWith('@@')?'hk':l.startsWith('+')&&!l.startsWith('+++')?'ad':l.startsWith('-')&&!l.startsWith('---')?'dl':''}">${esc(l)}</span>`).join('\n')}</pre>`;
const diffChip=(v,c)=>{const d=(VR.diffs||{})[v+':'+c.path];const name=c.path.split('/').pop();
  if(!d)return `<span class="chip" title="${esc(c.path)}">${c.status==='new'?'＋':c.status==='removed'?'－':'·'} ${esc(name)} <small>${c.status==='new'?'新增':c.status==='removed'?'移除':''}</small></span>`;
  return tbl(`diff:${v}:${c.path}`,`${c.path} · v${v} 的變更`,`${c.sections&&c.sections.length?`<div class="mmeta"><small>變更段落:</small> ${c.sections.map(s=>`<span class="st WARN">${esc(s)}</span>`).join(' ')}${c.more?` <small>…另 ${c.more} 段</small>`:''}</div>`:''}${diffHtml(d)}`,`+${d.add} −${d.del}`)};
/* 上游鍵 → 那一版改了它的文件 diff:pm: 看 PM spec,req: 看需求文件 */
const keyDiff=(key,v)=>{if(!VR)return esc(key)+' v'+v;const tl=(VR.timeline||[]).find(x=>x.v===v);if(!tl)return esc(key)+' v'+v;
  const c=tl.changed.find(c=>key.startsWith('pm:')?(c.kind==='PM'&&/\.md$/.test(c.path)):/10-requirements\.md$/.test(c.path))||tl.changed[0];
  return c?diffChip(v,c).replace(/(<button[^>]*>)/,`$1${esc(key)} @v${v} · `):esc(key)+' v'+v};

let h='';
h+=`<h1>${esc(T.title)} <small>(${esc(T.feature)})${T.versions&&T.versions.current?` · v${T.versions.current}${T.versions.git?' · '+esc(T.versions.git.commit):''}`:''}</small></h1>
<div class="sub">來源檔:${(T.source_files||[]).map(esc).join(', ')} · 由 spec-dev.py 產生,資料以 md 為準</div>`;
h+=`<div class="kpis">
<div class="kpi"><b>${K.req_count}</b><span>需求 (REQ+NFR)</span></div>
<div class="kpi"><b>${K.component_count}</b><span>技術元件</span></div>
<div class="kpi"><b>${K.test_count}</b><span>測試元件</span></div>
<div class="kpi ${K.boundary_fail?'fail':(K.boundary_warn?'warn':'pass')}"><b>${K.boundary_pass}/${K.boundary_total}</b><span>技術邊界 PASS · FAIL ${K.boundary_fail} · WARN ${K.boundary_warn}</span></div>
<div class="kpi ${K.uncovered_req?'fail':'pass'}"><b>${K.uncovered_req}</b><span>未覆蓋需求 ${(K.uncovered_ids||[]).join(' ')}</span></div>
<div class="kpi ${K.open_gaps?'warn':'pass'}"><b>${K.open_gaps}</b><span>待 PM 確認缺口 · assumed ${K.assumed}</span></div></div>`;

// ---- E. 證據鏈:PM 證據 → 轉換證據(預設隱藏)→ RD 證據,全部內嵌 ----
const SRC=T.sources||{},PMS=(SRC.pm_spec&&SRC.pm_spec.sections)||[],MOCKS=SRC.mocks||[],ACT=T.ac_text||{},UCT=T.uc_text||{};
const pmFile=SRC.pm_spec?SRC.pm_spec.path:'';
const pmSec=src=>{if(!src)return null;const key=String(src).trim();return PMS.find(x=>x.anchor===key)||PMS.find(x=>key.startsWith(x.anchor+' ')||key.startsWith(x.anchor+'('))||PMS.find(x=>key.startsWith(x.anchor))||null};
const loc=(f,l)=>`<span class="loc">${esc(f)}${l?':L'+l:''}</span>`;
const mockView=m=>m.html?`<iframe sandbox="" srcdoc="${esc(m.html)}" style="width:100%;height:240px;border:1px solid var(--line);border-radius:4px;background:#fff"></iframe>`:(m.data_uri?`<img src="${m.data_uri}" style="max-width:100%;border:1px solid var(--line)">`:(m.text?`<pre class="pre">${esc(m.text)}</pre>`:`<small>${m.exists?'(無法內嵌)':'(檔案不存在)'}</small>`));
const artsOf=r=>{const hit=a=>a.req===r.id||(a.reqs||[]).includes(r.id);return {sa:(T.sa_artifacts||[]).filter(hit),rd:(T.artifacts||[]).filter(hit)}};

const GLT=(T.glossary&&T.glossary.terms)||[],NMG=(T.glossary&&T.glossary.naming)||[],AS=T.assets||[];
const NMCOL=['UI','API','Application','Domain','Infrastructure','DB'];
const reqText=r=>{const parts=[r.title,(pmSec(r.source)||{}).text||''];for(const a of r.acs){const t=ACT[a];if(t)parts.push(t.text)}
  for(const c of cmpsOf(r))parts.push(cmp[c]?.name||'');return parts.join(' ').toLowerCase()};
const relatedNaming=r=>{const tx=reqText(r);return NMG.filter(n=>(n.symbol&&tx.includes(n.symbol.toLowerCase()))||(n.term&&n.term.length>=2&&tx.includes(String(n.term).toLowerCase())))};
const relatedAssets=(r,keys)=>{const ks=keys.map(k=>String(k).toLowerCase()).filter(k=>k.length>=2);return AS.filter(a=>{const t=(a.heading+' '+a.text).toLowerCase();return ks.some(k=>t.includes(k))})};
const namingTable=rows=>rows.length?`<div class="tw"><table><tr><th>名詞</th><th>符號</th>${NMCOL.map(c=>`<th>${c}</th>`).join('')}</tr>${rows.map(n=>`<tr><td>${esc(n.term)}</td><td class="loc">${esc(n.symbol)}</td>${NMCOL.map(c=>`<td><small>${(n[c]||[]).map(esc).join(', ')}</small></td>`).join('')}</tr>`).join('')}</table></div>`:'<small>(無)</small>';
const assetList=rows=>rows.length?rows.map(a=>`<details><summary><small>${loc(a.path,a.line)} ${esc(a.heading)}</small></summary><pre class="pre" style="color:var(--fg)">${esc(a.text)}</pre></details>`).join(''):'<small>(無)</small>';
const AUTO=T.auto_diagrams||[];
const autoOf=(r,k)=>AUTO.find(a=>a.req===r.id&&a.id.startsWith('AUTO-'+k+'-'));
const narrow=code=>innerWidth<700?code.replace(/^flowchart LR/,'flowchart TD'):code;   /* 窄螢幕由上往下畫 */
const mocksOf=r=>{const ids=new Set([r.id,...artsOf(r).sa.map(a=>a.id),...artsOf(r).rd.map(a=>a.id)]);return MOCKS.filter(m=>(T.io_map||[]).some(row=>row.in.includes(m.path.split('/').pop())&&row.out.some(o=>[...ids].some(i=>o.includes(i)))))};
if(PMS.length||MOCKS.length){
h+=`<section><h2>E. 證據鏈 <small>PM 文字 ↔ 圖(追溯圖、循序圖)↔ RD 文字 · 全部內嵌,不用切畫面</small></h2><div class="body">`;
h+=`<div class="lookup"><label for="lk"><b>查找</b> <small>詞彙 ${GLT.length} · 分層命名 ${NMG.length} · 已知資產 ${AS.length} 段(${[...new Set(AS.map(a=>a.root))].map(esc).join('、')||'無'})</small></label>
  <input type="search" id="lk" placeholder="輸入名詞、符號或關鍵字,例:${esc((NMG[0]||{}).term||'訂單')}" autocomplete="off"><div id="lkout" class="lkout" hidden></div></div>`;
h+=`<details><summary>PM 素材全文 <small>${esc(pmFile)} ${SRC.pm_spec&&SRC.pm_spec.lines?SRC.pm_spec.lines+' 行':''} · mock ${MOCKS.length} · 參考 ${(SRC.refs||[]).length}</small></summary>
<div class="grid">${PMS.length?`<div><pre class="pre" style="color:var(--fg)">${PMS.map(x=>`${'#'.repeat(x.level)} ${esc(x.anchor)} ${esc(x.title)}  <small>(L${x.line})</small>\n${esc(x.text)}\n`).join('\n')}</pre></div>`:'<div><small>00-overview.md「## 來源」未指定 PM spec 路徑,或檔案不存在</small></div>'}
<div>${MOCKS.map(m=>`<b>${esc(m.path)}</b>${mockView(m)}`).join('')}${(SRC.refs||[]).length?`<b>參考</b><ul>${SRC.refs.map(r=>`<li class="mono">${esc(r.path)}${r.exists?'':' <small>(不存在)</small>'}</li>`).join('')}</ul>`:''}</div></div></details>`;
const chainOf=r=>{const logs=live.filter(e=>e.req===r.id).sort((a,b)=>a.seq-b.seq);
  return logs.map(e=>`<div><span class="n">${esc(e.in)}</span> ─<span class="m">[${esc(e.stage)} ${esc(e.method)}${e.rule?' · '+esc(e.rule):''}]</span>→ <span class="n">${esc(e.out)}</span> <span class="ev">ev=${esc(e.evidence||'?')}${(e.gaps||[]).length?' gap: '+esc(e.gaps.join('; ')):''}${e.note?' · '+esc(e.note):''}</span></div>`).join('')||'<small>(無 log)</small>'};
const logicOf=r=>{const ids=idsOf(r);const cs=cmpsOf(r);for(const c of cs)ids.add(c);
  const g=G.filter(x=>(x.ids||[]).some(i=>ids.has(i))),b=BC.filter(x=>(x.ids||[]).some(i=>ids.has(i)));
  const row=(st,rule,target,ev,act)=>`<tr><td>${badge(st)}</td><td><small>${esc(rule)}</small></td><td><small>${esc(target)}</small></td><td><small>${esc(ev)}${act?'<br>處置:'+esc(act):''}</small></td></tr>`;
  const all=[...g.map(x=>row(x.level,x.rule,(x.ids||[])[0]||'',x.msg,x.action)),...b.map(x=>row(x.status,x.rule,x.target,x.evidence,x.action))];
  const why=status(r)==='PASS'?`所有命中規則皆 PASS/INFO(${b.length} 條邊界、${g.length} 條 Gate)`:(status(r)==='FAIL'?'有規則 FAIL,見下':'有規則 WARN,見下');
  return `<small>${why}</small><table>${all.join('')||'<tr><td><small>無</small></td></tr>'}</table>`};
for(const r of (T.requirements||[])){
  const sec=pmSec(r.source),mk=mocksOf(r),A=artsOf(r),st=status(r);
  const pm=sec?`${loc(pmFile,sec.line)}<br><b>${esc(sec.anchor)} ${esc(sec.title)}</b><pre class="pre" style="color:var(--fg)">${esc(sec.text)}</pre>`:`<small>來源錨點「${esc(r.source)}」在 PM spec 找不到對應段落</small>`;
  const pmMock=mk.map(m=>`<details><summary><small>mock · ${esc(m.path.split('/').pop())}</small></summary>${mockView(m)}</details>`).join('');
  const roles=(T.sa_roles||[]).filter(x=>x.reqs.includes(r.id)),cs=cmpsOf(r);
  const ents=(T.sa_entities||[]).filter(e=>e.en&&cs.some(c=>(cmp[c]?.name||'').includes(e.en)));
  const logs=live.filter(e=>e.req===r.id);
  const tr_=autoOf(r,'TRACE'),sq_=autoOf(r,'SEQ');
  const mid_=`<h4>轉換證據 · 圖 <small>點開看</small></h4>
    <div class="chips">${tr_?mer({...tr_,kind:'追溯圖'}):'<small>(無自動追溯圖)</small>'}${sq_?mer({...sq_,kind:'元件循序圖'}):''}${A.sa.map(mer).join('')}${A.rd.map(mer).join('')}</div>
    <details><summary><b>分析鏈</b> <small>${logs.length} 步 · 角色動作 ${roles.length} · 實體 ${ents.length} · 手寫 SA 圖 ${A.sa.length} · RD 圖 ${A.rd.length}</small></summary>
    ${roles.length?`<small><b>SA3 角色→動作</b></small><ul>${roles.map(x=>`<li><small>${esc(x.role)} → ${esc(x.action)} <i>${esc(x.flow)}</i></small></li>`).join('')}</ul>`:''}
    ${ents.length?`<small><b>SA2 實體</b> ${ents.map(e=>esc(e.name)+'('+esc(e.en)+')').join('、')}</small><br>`:''}
    <small><b>方法論步驟</b></small><div class="chain">${chainOf(r)}</div>
    </details>
    <details><summary><b>邏輯鏈</b> <small>為什麼是 ${st}</small></summary><div class="tw">${logicOf(r)}</div></details>
    ${(()=>{const nm=relatedNaming(r);const keys=[...new Set(nm.flatMap(n=>[n.symbol,n.term,...NMCOL.flatMap(c=>n[c]||[])]).filter(Boolean))];const as=relatedAssets(r,keys);
      return `<div class="chips"><b>詞彙與已知資產</b> ${tbl('nm:'+r.id,r.id+' 分層命名與已知資產',`<small><b>分層命名對照</b></small>${namingTable(nm)}<small><b>docs / specs/done 相關段落</b></small>${assetList(as)}`,`命名 ${nm.length} 列 · 文件段落 ${as.length} 段`)}</div>`})()}`;
  const acRows=r.acs.map(a=>{const t=ACT[a];const ls=(T.ac_links||[]).filter(l=>l.ac===a);const tt=(T.tests||[]).filter(x=>x.acs.includes(a));
    return `<div style="margin:4px 0;padding:4px 6px;border-left:3px solid var(--line)"><b>${esc(a)}</b> ${t?loc('10-requirements.md',t.line):''}<pre class="pre" style="color:var(--fg);margin:2px 0">${esc(t?t.text:(r.measure?'量測:'+r.measure+(r.stimulus_source?' · 刺激來源:'+r.stimulus_source:''):'(無 gherkin)'))}</pre>
      <small>元件:${ls.length?ls.map(l=>`${esc(l.component)} <i>${esc(l.role)}</i> ${loc('30',l.line)}`).join(' · '):(r.binds?.length?'NFR 綁定 '+r.binds.map(esc).join(', '):badge('WARN'))}</small><br>
      <small>測試:${tt.length?tt.map(x=>`${esc(x.id)} ${loc('60',x.line)}`).join(' · '):badge('FAIL')+' 無'}</small></div>`}).join('');
  const ucs=Object.entries(UCT).filter(([k,v])=>v.heading.includes(r.id)).map(([k,v])=>`<details><summary><small>${esc(v.heading)} ${loc('20-domain-model.md',v.line)}</small></summary><pre class="pre" style="color:var(--fg)">${esc(v.text)}</pre></details>`).join('');
  const apis=(T.apis||[]).filter(a=>a.reqs.includes(r.id)||a.nfrs.includes(r.id)).map(a=>`<small>${esc(a.id)} ${esc(a.method)} <span class="loc">${esc(a.path)}</span> ${loc((T.doc_paths||{})['40-api-contracts.md']||'40',a.line)}</small>`).join('<br>');
  const vch=T.versions&&T.versions.current>1?['pm:','req:'].filter(p=>((T.versions.key_changes||{})[p+r.id]||[]).includes(T.versions.current)):[];
  h+=`<article class="evc"><header>${badge(st)} <b>${esc(r.id)}</b> <small>${esc(r.title)}</small>${vch.length?` <span class="st WARN">v${T.versions.current} ${vch.map(p=>p==='pm:'?'PM 段落已改':'需求 / AC 已改').join('、')}</span>`:''}</header><div class="evg">
    <div><h4>PM 證據 · 文字</h4>${pm}${pmMock}</div>
    <div>${mid_}</div>
    <div><h4>RD 證據 · 文字</h4>${loc(r.file||'10-requirements.md',r.line)}${acRows}${ucs}${apis}</div></div></article>`;
}
h+=`</div></section>`;
}
// ================= F. 圖與表審計:看板優先,與人一起確認(以事情區分,不以人區分) =================
const AU=T.audit||null;
if(AU){
  const S=AU.summary, items=AU.items||[], DU=AU.duties||{};
  const gOf=it=>G.filter(g=>(g.ids||[])[0]===it.id&&/^G-(DG-(target|process|consistency)|SA-tables)/.test(g.rule));
  const gOf2=it=>G.filter(g=>(g.ids||[])[0]===it.id&&g.rule==='G-S6-render');
  const lvOf=it=>{const g=gOf(it).concat(gOf2(it));return g.some(x=>x.level==='FAIL')?'FAIL':(g.some(x=>x.level==='WARN')?'WARN':'OK')};
  const changed=new Set(S.changed_since_last||[]);
  const todoDuties=it=>Object.entries(it.signoffs||{}).filter(([k,s])=>!['approved','n/a'].includes(s.status)).map(([k])=>k);
  const rank=it=>it.signoff==='rejected'?0:lvOf(it)==='FAIL'?1:(it.signoff==='stale'||it.signoff==='upstream')?2:lvOf(it)==='WARN'?4:changed.has(it.id)?5:(it.type==='diagram'&&todoDuties(it).length)?6:9;
  const order=[...items].sort((a,b)=>rank(a)-rank(b)||a.id.localeCompare(b.id));
  const SO={approved:['PASS','通過'],'n/a':['INFO','不需要'],stale:['WARN','通過後已變更'],upstream:['WARN','上游已變,請重看'],pending:['INFO','待確認'],rejected:['FAIL','退回']};
  const pill=(cls,t)=>`<span class="st ${cls}">${esc(t)}</span>`;
  const dLabel=k=>(DU[k]||{}).label||k;
  const reqTitle=id=>{const r=(T.requirements||[]).find(x=>x.id===id);return r?`${esc(id)} <small>${esc(r.title)}</small>`:`${esc(id)} ${pill('FAIL','不存在')}`};
  const logLines=it=>(it.process||[]).map(p=>p.tool?`<div class="loc">工具 ${esc(p.tool)}(自動生成)</div>`:`<div class="loc">#${p.seq} ${esc(p.stage)} ${esc(p.method)} → ${esc(p.out)}</div>`).join('')||`<div>${pill('WARN','無過程紀錄')}</div>`;
  const checkRows=it=>{const g=gOf(it);const cs=it.checks||[];
    const rows=cs.map(c=>{const n=(it.findings||[]).filter(x=>x.check===c).length;return `<tr><td class="loc">${esc(c)}</td><td>${n?pill('WARN','有發現 '+n):pill('PASS','通過')}</td></tr>`}).join('');
    const det=g.map(x=>`<tr><td class="loc">${esc(x.rule)}</td><td>${pill(x.level,x.level)} <small>${esc(x.msg)}${x.action?'<br>處置:'+esc(x.action):''}</small></td></tr>`).join('');
    return `<div class="tw"><table>${rows}${det}${(!rows&&!det)?'<tr><td><small>此類型沒有機器核對規格,由人確認</small></td></tr>':''}</table></div>`};
  const chips=it=>Object.entries(it.signoffs||{}).map(([k,s])=>{const m=SO[s.status]||SO.pending;return `<span class="st ${m[0]}" title="${esc(m[1])}${s.by?' · '+esc(s.by):''}">${esc(dLabel(k))} ${s.status==='approved'?'✓':s.status==='n/a'?'—':s.status==='rejected'?'✗':(s.status==='stale'||s.status==='upstream')?'!':'…'}</span>`}).join(' ');
  /* 確認事項:看板只顯示狀態;要確認時告訴 AI,由 AI 呼叫 signoff 工具(或自己執行下面那行) */
  const specDir=T.spec_dir||'<spec 目錄>';
  const checklist=it=>{const ks=Object.keys(it.signoffs||{});if(!ks.length)return '';

        ${(s.upstream||[]).length?`<div class="chips"><small>上游變更(點開看 diff):</small>${s.upstream.map(u=>keyDiff(u.key,u.v)).join('')}</div>`:''}
        ${s.status==='approved'||s.status==='n/a'?'':`<code class="tc">spec-dev.py signoff ${esc(specDir)} --id ${esc(it.id)} --duty ${esc(k)} --hash ${esc(it.hash)} --by 名字</code>`}</div>`};
    return `<div class="dec"><b>要做的確認</b> <small>以事情區分,誰都可以確認,名字只是紀錄。看板只顯示;確認由 AI 呼叫 signoff 工具(退回加 --reject --note,不需要加 --na --note)</small>${ks.map(row).join('')}</div>`};
  /* 表格列:把整張 SA 表顯示出來,標出這一列 */

    return rows.length?`<div class="tw"><table><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${rows.map(r=>`<tr class="${it.source===`${r._file}:${r._line}`?'hit':''}">${cols.map(c=>`<td><small>${esc(r[c])}</small></td>`).join('')}</tr>`).join('')}</table></div>`
      :`<pre class="pre" style="color:var(--fg)">${esc(it.heading)}</pre>`};
  const AUDB={};window.__AUDB=AUDB;
  const itemHtml=it=>{const lv=lvOf(it);const so=it.type==='diagram'?SO[it.signoff]:null;

      :saTable(it);
    const right=`<dl class="prov">
      <dt>來源</dt><dd>${it.source&&it.source!=='(auto)'?loc(it.source,''):'自動生成'}${(it.inputs||[]).length?`<details><summary><small>用到的表格列 ${it.inputs.length}</small></summary>${it.inputs.map(x=>`<div>${loc(x,'')}</div>`).join('')}</details>`:''}</dd>
      <dt>過程</dt><dd>${it.type==='diagram'?logLines(it):'<small>表格列,過程看該步驟的 log</small>'}</dd>

      <dt>機器核對</dt><dd>${checkRows(it)}</dd>
      ${it.type==='diagram'?`<dt>渲染</dt><dd>${it.render==='ok'?pill('PASS','瀏覽器可渲染'):(it.render?pill(it.render==='未驗證'?'WARN':'FAIL',it.render):'<small>站台模式:看左邊有沒有畫出來</small>')}</dd>`:''}
      ${it.type==='diagram'?`<dt>內容 hash</dt><dd class="loc">${esc(it.hash)}</dd>`:''}

    AUDB[it.id]={title:`${it.id} · ${it.phase} · ${it.kind}`,html:`<div class="audhead">${head}</div><div class="audg"><div>${left}</div><div>${right}</div></div>`};

  const todo=order.filter(it=>rank(it)<9).length;
  const dRows=Object.values(S.by_duty||{}).reduce((a,x)=>a+Object.values(x).reduce((p,q)=>p+q,0),0);
  const dDone=Object.values(S.by_duty||{}).reduce((a,x)=>a+(x.approved||0)+(x['n/a']||0),0);
  h+=`<section id="audit"><h2>F. 圖與表審計 <small>只顯示;確認紀錄在 ${esc(AU.signoff_path||'audit/signoff.md')} · 方法論 ${esc(AU.methodology||'—')}</small></h2><div class="body">
  <div class="kpis">
    <div class="kpi ${todo?'warn':'pass'}"><b>${todo}</b><span>還要處理的項目</span></div>

    ${Object.entries(S.by_duty||{}).map(([k,x])=>`<div class="kpi ${(x.pending||x.stale||x.rejected)?'warn':'pass'}"><b>${(x.approved||0)+(x['n/a']||0)}/${Object.values(x).reduce((p,q)=>p+q,0)}</b><span>${esc(dLabel(k))} <small>(${esc((DU[k]||{}).hint||'')} 視角)</small></span></div>`).join('')}
    <div class="kpi"><b>${S.diagrams}</b><span>圖 · SA ${S.by_phase.SA} · RD ${S.by_phase.RD} · 自動 ${S.by_phase.AUTO} · 表格列 ${S.table_rows}</span></div>

    return `<tr><td>${esc(a)}</td><td>${ls.length?ls.map(l=>`${esc(l.component)} <small>${esc(l.role)}</small>`).join('<br>'):(r.binds?.length?'<small>NFR 綁定 '+r.binds.map(esc).join(', ')+'</small>':badge('WARN')+' 未指定元件')}</td><td>${tt.length?tt.map(esc).join(', '):badge('FAIL')+' 無測試'}</td></tr>`}).join('');
  const bcs=bcOf(r),arts=(T.artifacts||[]).filter(a=>a.req===r.id);
  h+=`<tr class="detail" data-for="${esc(r.id)}" hidden><td colspan="${3+LAYERS.length+KINDS.length}"><div class="grid">
<div><b>來源</b> ${esc(r.source)}${r.measure?` · <b>量測</b> ${esc(r.measure)}`:''}<br>
<b>AC → 技術元件(職責)→ 測試</b><table><tr><th>AC</th><th>CMP</th><th>TST</th></tr>${acRows}</table>
<b>技術邊界</b><table>${bcs.map(b=>`<tr><td>${esc(b.rule)}</td><td>${esc(b.target)}</td><td>${badge(b.status)}</td><td>${esc(b.evidence)}${b.action?'<br><small>處置:'+esc(b.action)+'</small>':''}</td></tr>`).join('')||'<tr><td>無</td></tr>'}</table></div>
<div><b>方法論 log</b><div class="log">${live.filter(e=>e.req===r.id).map(logLine).join('')||'<div>(0 筆)</div>'}</div>${arts.map(mer).join('')}</div>
</div></td></tr>`;
}
h+=`</table></div></section>`;

const bad=BC.filter(b=>b.status!=='PASS'),ok=BC.filter(b=>b.status==='PASS');
const bcRow=b=>`<tr><td>${esc(b.rule)}</td><td>${esc(b.target)}</td><td>${badge(b.status)}</td><td>${esc(b.evidence)}</td><td>${esc(b.action)}</td></tr>`;
h+=`<section><h2>C. 技術邊界核對 <small>由規則 B1–B8 機械計算 · FAIL ${K.boundary_fail} · WARN ${K.boundary_warn} · PASS ${ok.length}</small></h2><div class="body">`;
h+=bad.length?`<table><tr><th>規則</th><th>目標</th><th>狀態</th><th>證據</th><th>處置</th></tr>${bad.map(bcRow).join('')}</table>`:'<small>無 FAIL/WARN</small>';
h+=`<details><summary>PASS 明細 (${ok.length})</summary><table><tr><th>規則</th><th>目標</th><th>狀態</th><th>證據</th><th>處置</th></tr>${ok.map(bcRow).join('')}</table></details></div></section>`;

const global=(T.artifacts||[]).filter(a=>a.req==='*');
if(global.length){h+=`<section><h2>架構圖 <small>跨需求 ${global.length} 張</small></h2><div class="body"><div class="chips">${global.map(mer).join('')}</div></div></section>`}

h+=`<section><h2>D. 方法論 log <small>${LOG.length} 筆,${superseded.size} 筆被取代 · ev=explicit|inferred|assumed</small></h2><div class="body"><details><summary>展開 log <input type="search" id="lf" placeholder="篩選 REQ / stage / rule / evidence" onclick="event.stopPropagation()"></summary><div class="log" id="logbox">${LOG.map(logLine).join('')}</div></details></div></section>`;

document.getElementById('app').innerHTML=h;
const runMermaid=root=>{if(!window.mermaid)return;
  for(const n of [...root.querySelectorAll('.mermaid:not([data-processed])')].filter(n=>n.offsetParent!==null)){
    if(!n.dataset.src)n.dataset.src=n.textContent;
    mermaid.run({nodes:[n]}).catch(e=>{n.removeAttribute('data-processed');n.classList.remove('mermaid');n.classList.add('pre');n.textContent=n.dataset.src;
      n.insertAdjacentHTML('beforebegin',`<div class="loc" style="color:var(--fail)">圖語法錯誤:${esc(String((e&&(e.message||e.str))||e).split('\n')[0].slice(0,160))}</div>`)})}};
window.__renderVisible=()=>runMermaid(document);
/* ================= 分頁(彈性架構)+ modal ================= */
/* 分頁登錄表:依區塊標題歸到分頁;順序與顯示由 .spec-dev.yaml 的 board.tabs 決定(沒設就用這裡的順序),board.default_tab 決定預設分頁 */
const TABDEF=[
  {id:'overview',title:'總覽',match:/^(已放行|A\.|Gate 問題)/},
  {id:'evidence',title:'證據鏈',match:/^E\./},
  {id:'uiapi',title:'UI × API',match:/^U\./},
  {id:'audit',title:'審計與確認',match:/^F\./},
  {id:'versions',title:'版本',match:/^V\./},
  {id:'matrix',title:'需求 × 元件 × 測試',match:/^B\./},
  {id:'boundary',title:'技術邊界',match:/^(C\.|架構圖)/},
  {id:'sa',title:'SA 建模',match:/^(SA0|SA 建模)/},
  {id:'glossary',title:'名詞與 codebase',match:/^(詞彙表|Survey)/},
  {id:'log',title:'方法論 log',match:/^D\./}];
const BOARD=DATA.board||{};
const app=document.getElementById('app'),panes={};
for(const sec of [...app.children].filter(n=>n.matches('section,.two'))){const txt=((sec.querySelector('h2')||{}).textContent||'').trim();
  const d=TABDEF.find(x=>x.match.test(txt))||{id:'other',title:'其他'};(panes[d.id]=panes[d.id]||{def:d,nodes:[]}).nodes.push(sec)}
const order_=(BOARD.tabs||TABDEF.map(x=>x.id).concat(['other'])).filter(id=>panes[id]);
const badgeOf={overview:G.filter(g=>g.level==='FAIL').length?`<span class="st FAIL">${G.filter(g=>g.level==='FAIL').length}</span>`:'',
  audit:(()=>{const n=document.querySelectorAll('#audlist [data-rank]');const k=[...n].filter(x=>+x.dataset.rank<9).length;return k?`<span class="st WARN">${k}</span>`:''})(),
  evidence:`<small>${(T.requirements||[]).length}</small>`,
  versions:T.versions&&T.versions.current?`<small>v${T.versions.current}</small>`:''};
const nav=document.createElement('nav');nav.className='tabs';nav.setAttribute('role','tablist');nav.setAttribute('aria-label','看板分頁');
for(const id of order_){const b=document.createElement('button');b.type='button';b.setAttribute('role','tab');b.id='tabbtn-'+id;b.dataset.tab=id;b.setAttribute('aria-controls','tab-'+id);
  b.innerHTML=esc(panes[id].def.title)+' '+(badgeOf[id]||'');nav.appendChild(b);
  const p=document.createElement('div');p.id='tab-'+id;p.setAttribute('role','tabpanel');p.setAttribute('aria-labelledby','tabbtn-'+id);p.hidden=true;p.tabIndex=0;
  for(const n of panes[id].nodes)p.appendChild(n);app.appendChild(p)}
for(const id of Object.keys(panes))if(!order_.includes(id))for(const n of panes[id].nodes)n.remove();   /* 設定裡沒列的分頁不顯示 */
app.insertBefore(nav,document.getElementById('tab-'+order_[0]));
let curTab='';
const hashArgs=()=>{const h=location.hash.slice(1);if(!h.includes('='))return h?{tab:h==='audit'?'audit':''}:{};const o={};for(const kv of h.split('&')){const i=kv.indexOf('=');if(i>0)o[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1))}return o};
const setHash=open=>history.replaceState(null,'',location.pathname+location.search+'#tab='+curTab+(open?'&open='+encodeURIComponent(open):''));
const showTab=(id,focus)=>{if(!order_.includes(id))id=order_.includes(BOARD.default_tab)?BOARD.default_tab:order_[0];curTab=id;
  for(const b of nav.children){const on=b.dataset.tab===id;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1;if(on&&focus)b.focus()}
  for(const t of order_)document.getElementById('tab-'+t).hidden=t!==id;setHash(mdl.open?mdl.dataset.key:'');runMermaid(document.getElementById('tab-'+id))};
nav.addEventListener('click',e=>{const b=e.target.closest('[role=tab]');if(b)showTab(b.dataset.tab)});
nav.addEventListener('keydown',e=>{const i=order_.indexOf(curTab);if(e.key==='ArrowRight')showTab(order_[(i+1)%order_.length],true);if(e.key==='ArrowLeft')showTab(order_[(i-1+order_.length)%order_.length],true)});
/* modal:一次只看一張圖 / 一張表 / 一個審計項目 */
const mdl=document.createElement('dialog');mdl.id='mdl';mdl.setAttribute('aria-labelledby','mdlt');
mdl.innerHTML='<header><b id="mdlt"></b><span><button type="button" class="mlink" title="複製這張的連結">複製連結</button><button type="button" class="x" aria-label="關閉">✕</button></span></header><div class="mb"></div>';
document.body.appendChild(mdl);
const AUI=(T.audit&&T.audit.items)||[];
window.__DG=Object.fromEntries([...Object.values(DGS),...AUI.filter(i=>i.type==='diagram')].map(a=>[a.id,a.mermaid]));
const openKey=key=>{let title='',html='';
  if(key.startsWith('dg:')){const id=key.slice(3),a=DGS[id]||AUI.find(i=>i.id===id);if(!a)return false;
    title=`${a.id} · ${a.kind||''}`;
    html=`<div class="mmeta">${a.file?loc(a.file,a.line):(a.auto||a.phase==='AUTO'?'自動生成(由表格資料產生)':'')}${(window.__AUDB||{})[id]?` ${chip('aud:'+id,'審計與確認','來源 · 過程 · 目標 · 確認事項 · 提問','☑')}`:''}</div>
      <div class="dg"><pre class="mermaid" data-did="${esc(id)}">${esc(narrow(a.mermaid))}</pre></div><details><summary><small>原始碼</small></summary><pre class="pre">${esc(a.mermaid)}</pre></details>`}
  else if(key.startsWith('aud:')){const b=(window.__AUDB||{})[key.slice(4)];if(!b)return false;title=b.title;html=b.html}
  else if(MODAL[key]){title=MODAL[key].title;html=MODAL[key].html}else return false;
  mdl.querySelector('#mdlt').textContent=title;mdl.querySelector('.mb').innerHTML=html;mdl.dataset.key=key;
  if(!mdl.open)mdl.showModal();mdl.querySelector('.mb').scrollTop=0;runMermaid(mdl);setHash(key);
  mdl.dispatchEvent(new CustomEvent('opened',{detail:key}));return true};
window.__open=openKey;
mdl.querySelector('.x').addEventListener('click',()=>mdl.close());
mdl.addEventListener('close',()=>setHash(''));
mdl.addEventListener('click',e=>{if(e.target===mdl)mdl.close()});
mdl.querySelector('.mlink').addEventListener('click',e=>{const u=location.href;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>{e.target.textContent='已複製'}).catch(()=>{prompt('連結',u)});setTimeout(()=>{e.target.textContent='複製連結'},1500)});
mdl.addEventListener('input',e=>{if(!e.target.classList.contains('mfilter'))return;const q=e.target.value.trim().toLowerCase();
  const tb=e.target.nextElementSibling&&e.target.nextElementSibling.matches('table,.tw')?e.target.nextElementSibling:mdl.querySelector('.mb table');
  for(const tr of [...tb.querySelectorAll('tr')].slice(1))tr.hidden=!!q&&!tr.textContent.toLowerCase().includes(q)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(!b)return;e.preventDefault();openKey(b.dataset.open)});
{const a=hashArgs();showTab(a.tab||'');if(a.open)openKey(a.open)}
(function(){const list=document.getElementById('audlist');if(!list)return;   /* 看板只負責看:篩選 */
  const filt=f=>{for(const d of list.children){const r=+d.dataset.rank;
      d.hidden=!(f==='all'||(f==='todo'&&r<9)||(f.startsWith('duty:')&&d.dataset.todo.split(' ').includes(f.slice(5)))||d.dataset.phase===f||d.dataset.type===f)}
    for(const b of document.querySelectorAll('.audbar button'))b.classList.toggle('on',b.dataset.f===f)};
  document.querySelectorAll('.audbar button').forEach(b=>b.addEventListener('click',()=>filt(b.dataset.f)));filt('todo');
})();
/* ---- 點「檔:行」看原文:用面板內嵌的原文(追蹤中的文件全文、survey 引用的程式碼前後幾行)。dialog 疊在 modal 上面 ---- */
(function(){const EMB=DATA.src||{},FILES=EMB.files||{},SNIPS=EMB.snippets||{};
  const DOCP=Object.values(T.doc_paths||{});
  const findKey=p=>{if(FILES[p]!=null)return p;const ks=Object.keys(FILES);
    if(/^\d{2}$/.test(p)){const dp=DOCP.find(x=>x.split('/').pop().startsWith(p+'-'));if(dp)p=dp}
    return ks.find(k=>k===p)||ks.find(k=>k.endsWith('/'+p))||null};
  const readEmbedded=(p,line)=>{const k=findKey(p);if(k)return Promise.resolve({path:k,text:FILES[k]});
    const s=SNIPS[p+':'+line]||Object.values(SNIPS).find(x=>x.path===p||x.path.endsWith('/'+p));
    if(s)return Promise.resolve({path:s.path,text:s.lines.join('\n'),start:s.start,note:'只嵌入引用行前後幾行'});
    return Promise.resolve({error:'這份檔案沒有嵌入面板'})};
  const box=document.createElement('dialog');box.id='srcv';box.setAttribute('aria-label','原文');
  box.innerHTML='<header><b class="p"></b><button type="button" class="x" aria-label="關閉">✕</button></header><div class="b"></div>';document.body.appendChild(box);
  box.querySelector('.x').onclick=()=>box.close();box.addEventListener('click',e=>{if(e.target===box)box.close()});
  const RX=/^([^\s:]+\.[A-Za-z0-9]+|\d{2})(?::L?(\d+))?/;
  const mark=root=>root.querySelectorAll('.loc').forEach(s=>{if(RX.test(s.textContent.trim())&&!s.closest('fieldset')){s.classList.add('link');s.tabIndex=0;s.setAttribute('role','link')}});
  mark(document);mdl.addEventListener('opened',()=>mark(mdl));
  document.addEventListener('click',e=>{const s=e.target.closest('.loc.link');if(!s||s.closest('#srcv'))return;
    const m=s.textContent.trim().match(RX);if(!m)return;e.preventDefault();const line=+(m[2]||0);
    readEmbedded(m[1],line).then(d=>{const b=box.querySelector('.b');const st=d.start||1;
      box.querySelector('.p').textContent=d.error?m[1]:d.path+(line?':'+line:'')+(d.note?' · '+d.note:'');
      b.innerHTML=d.error?'<p>'+esc(d.error)+'</p>':'<pre>'+d.text.split('\n').map((l,i)=>`<span class="ln${i+st===line?' hit':''}"><i>${i+st}</i>${esc(l)}</span>`).join('\n')+'</pre>';
      if(!box.open)box.showModal();const hit=b.querySelector('.hit');if(hit)hit.scrollIntoView({block:'center'})})});
  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('link'))e.target.click()});
})();
const lk=document.getElementById('lk');
if(lk)lk.addEventListener('input',()=>{const q=lk.value.trim().toLowerCase();const box=document.getElementById('lkout');
  if(q.length<1){box.hidden=true;box.innerHTML='';return}
  const hit=s=>String(s||'').toLowerCase().includes(q);
  const g=GLT.filter(t=>hit(t.term)||hit(t.symbol)||hit(t.definition));
  const n=NMG.filter(x=>hit(x.term)||hit(x.symbol)||NMCOL.some(c=>(x[c]||[]).some(hit)));
  const a=AS.filter(x=>hit(x.heading)||hit(x.text)||hit(x.path));
  box.innerHTML=`<div><small><b>詞彙表</b> ${g.length}</small>${g.length?`<div class="tw"><table><tr><th>名詞</th><th>符號</th><th>定義</th><th>來源</th></tr>${g.map(t=>`<tr><td>${esc(t.term)}</td><td class="loc">${esc(t.symbol)}</td><td><small>${esc(t.definition)}</small></td><td>${loc(t.source,'')}</td></tr>`).join('')}</table></div>`:''}</div>
    <div><small><b>分層命名</b> ${n.length}</small>${n.length?namingTable(n):''}</div>
    <div><small><b>已知資產</b> ${a.length}</small>${a.length?assetList(a.slice(0,30)):''}</div>`;
  box.hidden=false;runMermaid(box)});   // mermaid 載入完成後由頁尾腳本呼叫;展開 details 時再補畫
document.querySelectorAll('tr.row').forEach(tr=>tr.addEventListener('click',()=>{const d=document.querySelector(`tr.detail[data-for="${tr.dataset.id}"]`);d.hidden=!d.hidden;if(!d.hidden)runMermaid(d)}));
document.querySelectorAll('details').forEach(dt=>dt.addEventListener('toggle',()=>{if(dt.open)runMermaid(dt)}));
document.getElementById('lf').addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#logbox div').forEach(d=>d.style.display=d.dataset.k.toLowerCase().includes(q)?'':'none')});
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
(function(){
  function boot(){
    mermaid.initialize({startOnLoad:false,securityLevel:'loose',theme:matchMedia('(prefers-color-scheme:dark)').matches?'dark':'default'});
    if(window.__renderVisible)window.__renderVisible();
  }
  function fail(){
    var n=document.createElement('div');
    n.setAttribute('role','status');
    n.style.cssText='position:sticky;top:0;z-index:9;padding:8px 12px;background:var(--warnbg);color:var(--warn);border-bottom:1px solid var(--line);font-size:13px';
    n.textContent='圖表引擎(mermaid)無法從 CDN 載入,圖以原始碼顯示。封閉網路請用 spec-dev.py all --offline 產生內嵌版面板。';
    document.body.prepend(n);
  }
  if(window.mermaid){boot();return}
  var s=document.createElement('script');
  s.src='https://unpkg.com/mermaid@11.4.1/dist/mermaid.min.js';
  s.onload=function(){window.mermaid?boot():fail()};
  s.onerror=fail;
  document.head.appendChild(s);
})();
</script>
</body>
</html>
