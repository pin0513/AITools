.sub{color:var(--muted);font-size:12px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.kpi{border:1px solid var(--line);border-radius:6px;padding:8px 10px}.kpi b{display:block;font-size:22px;line-height:1.1}.kpi span{font-size:12px;color:var(--muted)}

section{border:1px solid var(--line);border-radius:6px;margin:12px 0;overflow:hidden}
.body{padding:10px 12px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}th{background:var(--head);font-weight:600;white-space:nowrap}
.grp th{text-align:center;font-size:11px;color:var(--muted)}
.cell{text-align:center;white-space:nowrap}.cell.empty{color:var(--line)}
.st{display:inline-block;padding:0 6px;border-radius:10px;font-size:11px;font-weight:600}
.PASS{background:var(--passbg);color:var(--pass)}.WARN{background:var(--warnbg);color:var(--warn)}.FAIL{background:var(--failbg);color:var(--fail)}.INFO{background:var(--head);color:var(--muted)}
tr.row{cursor:pointer}tr.row:hover td{background:var(--head)}tr.detail td{background:var(--bg);padding:10px 14px}
tr.detail .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:800px){tr.detail .grid{grid-template-columns:1fr}}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;white-space:pre}
.log{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.7}
.log div{padding:0 6px;white-space:pre}.log .low{background:var(--warnbg)}.log .fail{background:var(--failbg)}.log .dead{text-decoration:line-through;color:var(--muted)}
details>summary{cursor:pointer;list-style:none;user-select:none}details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";color:var(--muted)}details[open]>summary::before{content:"▾ "}
input[type=search]{font:inherit;padding:2px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}
.pre{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted);white-space:pre-wrap}
.two{display:grid;grid-template-columns:1fr 1.6fr;gap:12px}@media(max-width:900px){.two{grid-template-columns:1fr}}
small{color:var(--muted)}.mermaid{background:var(--bg);margin:6px 0;overflow-x:auto}.mermaid svg{max-width:100%;height:auto}
.evtbl{table-layout:fixed}.evtbl td{word-break:break-word;vertical-align:top}
.evc{border:1px solid var(--line);border-radius:6px;margin:10px 0;overflow:hidden}
.evc>header{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;padding:8px 12px;background:var(--head);border-bottom:1px solid var(--line)}
.evg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr)}
.evg>div{padding:10px 12px;min-width:0;border-right:1px solid var(--line)}.evg>div:last-child{border-right:0}
.evg h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
@media(max-width:900px){.evg{grid-template-columns:minmax(0,1fr)}.evg>div{border-right:0;border-bottom:1px solid var(--line)}}
.loc{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted);word-break:break-all}
.dg{overflow-x:auto;border:1px solid var(--line);border-radius:4px;padding:4px;margin:4px 0 8px;background:var(--bg)}
.lookup{display:grid;gap:6px;margin:0 0 10px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--head)}
.lookup input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box}
.lkout{display:grid;gap:8px;max-height:60vh;overflow:auto}
.tw{overflow-x:auto}.tw table{width:auto;min-width:100%}.tw table td,.tw table th{white-space:normal;min-width:4.5em}.tw td.loc,.tw th{white-space:nowrap;word-break:normal}.st{white-space:nowrap}
.dg svg{max-width:none!important;height:auto}

</style>

.md", "line": 152, "heading": "SEQ-003 (UC-003 / REQ-003)", "req": "REQ-003", "reqs": ["REQ-003"], "mermaid": "sequenceDiagram\n  actor U as SupportAgent\n  participant CMP001 as OrderDetailPage\n  participant CMP003 as CancellationHistoryTable\n  participant CMP004 as orderStore\n  participant CMP005 as ordersApi\n  participant CMP006 as OrdersController\n  participant CMP009 as ListCancellationsQueryHandler\n  participant CMP010 as SqlOrderRepository\n  U->>CMP001: ListCancellations\n  CMP001->>CMP003: ListCancellations\n  CMP003->>CMP004: ListCancellations\n  CMP004->>CMP005: ListCancellations\n  CMP005->>CMP006: ListCancellations\n  CMP006->>CMP009: ListCancellations\n  CMP009->>CMP010: ListCancellations\n  CMP001-->>U: ok"}, {"id": "STM-UI-001", "kind": "state", "file": "ui/41-ui-spec.md", "line": 10, "heading": "STM-UI-001 OrderDetailPage (REQ-001)", "req": "REQ-001", "reqs": ["REQ-001"], "mermaid": "stateDiagram-v2\n  [*] --> Idle\n  Idle --> Loading: submit\n  Loading --> Done: 200\n  Loading --> Idle: error"}, {"id": "ERD-001", "kind": "erd", "file": "api/50-data-model.md", "line": 5, "heading": "ERD-001", "req": "*", "reqs": [], "mermaid": "erDiagram\n  Orders ||--o{ Refund : has\n  Orders {\n    uniqueidentifier Id PK\n  }\n  Refund {\n    uniqueidentifier Id PK\n  }"}], "sources": {"pm_spec": {"path": "specs/in-progress/order-cancel/pm-spec.md", "exists": true, "sections": [{"anchor": "PM§Order cancellation and refund (PM spec)", "title": "Order cancellation and refund (PM spec)", "level": 1, "line": 1, "text": ""}, {"anchor": "PM§1", "title": "Background and Goals", "level": 2, "line": 3, "text": "Today a customer must phone support to cancel an order. Goal: self-service cancel and automatic refund through the payment gateway."}, {"anchor": "PM§2", "title": "Users", "level": 2, "line": 6, "text": "customer: wants to cancel an order quickly. support agent: needs the cancellation history. system: issues the refund."}, {"anchor": "PM§3", "title": "Functional Requirements", "level": 2, "line": 9, "text": ""}, {"anchor": "PM§3.1", "title": "A customer can cancel an order before it is shipped", "level": 3, "line": 10, "text": "A customer can cancel an order while it is placed. An order that is already shipped cannot be cancelled. After cancel, the order status becomes cancelled."}, {"anchor": "PM§3.2", "title": "The system issues a refund through the payment gateway after cancellation", "level": 3, "line": 13, "text": "After an order is cancelled, the system issues a refund through the payment gateway. When the payment gateway fails, the system retries up to 3 times and keeps the order cancelled. A successful refund marks the order as refunded."}, {"anchor": "PM§3.3", "title": "A support agent can view the cancellation history", "level": 3, "line": 16, "text": "A support agent can view the cancellation history of every order, including time and reason."}, {"anchor": "PM§4", "title": "Non-functional Requirements", "level": 2, "line": 19, "text": "A refund must finish within 5 minutes after cancellation for 95% of order records."}, {"anchor": "PM§5", "title": "Acceptance", "level": 2, "line": 22, "text": "- an order is placed → the customer cancels it → the order status is cancelled\n- an order is shipped → the customer cancels it → the response is 409 ORDER_SHIPPED and the status is unchanged\n- an order is cancelled and paid → the system issues the refund → the payment gateway is called and the order is refunded\n- the payment gateway times out → the system issues the refund → it retries 3 times and the order stays cancelled\n- order records were cancelled → the support agent opens the history → each row shows the order, time and reason"}], "lines": 27}, "mocks": [{"path": "specs/in-progress/order-cancel/mock/order.html", "exists": true, "html": "<!doctype html><html><meta charset=\"utf-8\"><title>mock</title><body style=\"font-family:system-ui\"><h2>order <span data-state=\"Placed\">Placed</span></h2><!-- states: Placed/Shipped/Cancelled/Refunded --><button data-action=\"CancelOrder\">cancel</button><button data-action=\"ListCancellations\">view</button><table><tr><th>order</th><th>status</th></tr></table></body></html>\n"}], "refs": [{"path": "specs/in-progress/order-cancel/refs.md", "exists": true}]}, "ac_text": {"AC-001-1": {"text": "# AC-001-1\nGiven an order is placed\nWhen the customer cancels it\nThen the order status is cancelled", "line": 12}, "AC-001-2": {"text": "# AC-001-2\nGiven an order is shipped\nWhen the customer cancels it\nThen the response is 409 ORDER_SHIPPED and the status is unchanged", "line": 17}, "AC-002-1": {"text": "# AC-002-1\nGiven an order is cancelled and paid\nWhen the system issues the refund\nThen the payment gateway is called and the order is refunded", "line": 22}, "AC-002-2": {"text": "# AC-002-2\nGiven the payment gateway times out\nWhen the system issues the refund\nThen it retries 3 times and the order stays cancelled", "line": 27}, "AC-003-1": {"text": "# AC-003-1\nGiven order records were cancelled\nWhen the support agent opens the history\nThen each row shows the order, time and reason", "line": 32}}, "uc_text": {"UC-001": {"heading": "UC-001 A customer can cancel an order before it is shipped (REQ-001)", "line": 4, "text": "- Primary actor: customer\n- Trigger: the customer cancels it\n- Precondition: an order is placed\n- Postcondition (success guarantee): the order status is cancelled\n- Main flow:\n  1. the customer cancels it\n  2. the order status is cancelled\n- Alternative flow: none\n- Exception flow: the response is 409 ORDER_SHIPPED and the status is unchanged\n\n```mermaid\nflowchart LR\n  S([\"customer\"]) --> P[\"the customer cancels it\"] --> Q[\"the order status is cancelled\"]\n  P -.-> X[\"the response is 409 ORDER_SHIPPED and the status is unchanged\"]\n```"}, "UC-002": {"heading": "UC-002 The system issues a refund through the payment gateway after cancellation (REQ-002)", "line": 21, "text": "- Primary actor: system\n- Trigger: the system issues the refund\n- Precondition: an order is cancelled and paid\n- Postcondition (success guarantee): the payment gateway is called and the order is refunded\n- Main flow:\n  1. the system issues the refund\n  2. the payment gateway is called and the order is refunded\n- Alternative flow: none\n- Exception flow: it retries 3 times and the order stays cancelled\n\n```mermaid\nflowchart LR\n  S([\"system\"]) --> P[\"the system issues the refund\"] --> Q[\"the payment gateway is called and the order is refunded\"]\n  P -.-> X[\"it retries 3 times and the order stays cancelled\"]\n```"}, "UC-003": {"heading": "UC-003 A support agent can view the cancellation history (REQ-003)", "line": 38, "text": "- Primary actor: support agent\n- Trigger: the support agent opens the history\n- Precondition: order records were cancelled\n- Postcondition (success guarantee): each row shows the order, time and reason\n- Main flow:\n  1. the support agent opens the history\n  2. each row shows the order, time and reason\n- Alternative flow: none\n- Exception flow: none\n\n```mermaid\nflowchart LR\n  S([\"support agent\"]) --> P[\"the support agent opens the history\"] --> Q[\"each row shows the order, time and reason\"]\n```"}}, "screens": [{"screen": "OrderDetailPage", "route": "/order", "components": ["CMP-001", "CMP-002", "CMP-003", "CMP-004", "CMP-005"], "mock": "specs/in-progress/order-cancel/mock/order.html", "reqs": ["REQ-001", "REQ-002", "REQ-003"], "line": 6, "file": "ui/41-ui-spec.md"}], "ui_validation": [{"screen": "OrderDetailPage", "field": "CancelOrder", "rule": "an order is shipped", "message": "the response is 409 ORDER_SHIPPED and the status is unchanged", "acs": ["AC-001-2"], "line": 21}], "doc_paths": {"00-overview.md": "00-overview.md", "10-requirements.md": "10-requirements.md", "20-domain-model.md": "20-domain-model.md", "30-architecture-c4.md": "30-architecture-c4.md", "40-api-contracts.md": "api/40-api-contracts.md", "41-ui-spec.md": "ui/4 if((GL.terms||[]).length){
  h+=`<section><h2>詞彙表(跨 spec) <small>${GL.terms.length} 詞 · 衝突 ${(GL.conflicts||[]).length} · ${esc(GL.path||'')}</small></h2><div class="body">`;
  if((GL.conflicts||[]).length)h+=`<table><tr><th>名詞</th><th>符號 A</th><th>來源 A</th><th>符號 B</th><th>來源 B</th></tr>${GL.conflicts.map(c=>`<tr><td>${badge('FAIL')} ${esc(c.term)}</td><td>${esc(c.symbol_a)}</td><td><small>${esc(c.source_a)}</small></td><td>${esc(c.symbol_b)}</td><td><small>${esc(c.source_b)}</small></td></tr>`).join('')}</table>`;
  h+=`<details><summary>全部詞彙</summary><table><tr><th>名詞</th><th>符號</th><th>定義</th><th>來源 spec</th><th>來源</th></tr>${GL.terms.map(t=>`<tr><td>${esc(t.term)}</td><td class="mono">${esc(t.symbol)}</td><td><small>${esc(t.definition)}</small></td><td><small>${(t.specs||[]).map(esc).join(', ')}</small></td><td class="mono"><small>${esc(t.source)}</small></td></tr>`).join('')}</table></details></div></section>`;
}
// ---- Survey Mapping ----
const SV=T.survey||[];
if(SV.length){
  const cnt=s=>SV.filter(r=>r.status===s).length;
  h+=`<section><h2>Survey Mapping <small>模型 ↔ codebase · existing ${cnt('existing')} · modify ${cnt('modify')} · new ${cnt('new')}</small></h2><div class="body"><table><tr><th>模型元素</th><th>類型</th><th>狀態</th><th>對應 codebase</th><th>證據</th><th>說明</th></tr>`;
  for(const r of SV){const g=G.find(x=>x.rule==='G-SV-evidence'&&(x.ids||[]).includes(r.element));h+=`<tr><td>${esc(r.element)}</td><td><small>${esc(r.kind)}</small></td><td><span class="st ${r.status==='new'?'WARN':(r.status==='modify'?'WARN':'PASS')}" style="${r.status==='new'?'background:var(--head);color:var(--fg)':''}">${esc(r.status)}</span>${g?' '+badge(g.level):''}</td><td><small>${esc(r.target)}</small></td><td class="mono">${esc(r.evidence)}</td><td><small>${esc(r.note)}</small></td></tr>`}
  h+=`</table></div></section>`;
}

h+=`<section><h2>B. 需求 × 技術元件 × 測試元件 <small>點列展開明細</small></h2><div class="body"><table>
<tr class="grp"><th rowspan="2">需求</th><th rowspan="2">型態</th><th colspan="${LAYERS.length}">技術元件 (layer)</th><th colspan="${KINDS.length}">測試元件 (kind)</th><th rowspan="2">狀態</th></tr>
<tr>${LAYERS.map(l=>`<th>${l}</th>`).join('')}${KINDS.map(k=>`<th>${k}</th>`).join('')}</tr>`;
for(const r of (T.requirements||[])){
  const cs=cmpsOf(r),ts=testsOf(r),st=status(r);
  const lc=LAYERS.map(L=>{const ids=cs.filter(id=>cmp[id]?.layer===L);return `<td class="cell${ids.length?'':' empty'}">${ids.length?ids.map(esc).join('<br>'):'·'}</td>`}).join('');
  const tc=KINDS.map(Kd=>{const ids=ts.filter(t=>t.kind===Kd).map(t=>t.id);return `<td class="cell${ids.length?'':' empty'}">${ids.length?ids.map(esc).join('<br>'):'·'}</td>`}).join('');
  h+=`<tr class="row" data-id="${esc(r.id)}"><td><b>${esc(r.id)}</b><br><small>${esc(r.title)}</small></td><td><small>${(r.types||[]).map(esc).join('<br>')}</small></td>${lc}${tc}<td class="cell">${badge(st)}</td></tr>`;
  const acRows=r.acs.map(a=>{const ls=(T.ac_links||[]).filter(l=>l.ac===a);const tt=(T.tests||[]).filter(t=>t.acs.includes(a)).map(t=>t.id);
    return `<tr><td>${esc(a)}</td><td>${ls.length?ls.map(l=>`${esc(l.component)} <small>${esc(l.role)}</small>`).join('<br>'):(r.binds?.length?'<small>NFR 綁定 '+r.binds.map(esc).join(', ')+'</small>':badge('WARN')+' 未指定元件')}</td><td>${tt.length?tt.map(esc).join(', '):badge('FAIL')+' 無測試'}</td></tr>`}).join('');
  const bcs=bcOf(r),arts=(T.artifacts||[]).filter(a=>a.req===r.id);
  h+=`<tr class="detail" data-for="${esc(r.id)}" hidden><td colspan="${3+LAYERS.length+KINDS.length}"><div class="grid">
<div><b>來源</b> ${esc(r.source)}${r.measure?` · <b>量測</b> ${esc(r.measure)}`:''}<br>
<b>AC → 技術元件(職責)→ 測試</b><table><tr><th>AC</th><th>CMP</th><th>TST</th></tr>${acRows}</table>
<b>技術邊界</b><table>${bcs.map(b=>`<tr><td>${esc(b.rule)}</td><td>${esc(b.target)}</td><td>${badge(b.status)}</td><td>${esc(b.evidence)}${b.action?'<br><small>處置:'+esc(b.action)+'</small>':''}</td></tr>`).join('')||'<tr><td>無</td></tr>'}</table></div>
<div><b>方法論 log</b><div class="log">${live.filter(e=>e.req===r.id).map(logLine).join('')||'<div>(0 筆)</div>'}</div>${arts.map(mer).join('')}</div>
</div></td></tr>`;
}
h+=`</table></div></section>`;

const bad=BC.filter(b=>b.status!=='PASS'),ok=BC.filter(b=>b.status==='PASS');
const bcRow=b=>`<tr><td>${esc(b.rule)}</td><td>${esc(b.target)}</td><td>${badge(b.status)}</td><td>${esc(b.evidence)}</td><td>${esc(b.action)}</td></tr>`;
h+=`<section><h2>C. 技術邊界核對 <small>由規則 B1–B8 機械計算 · FAIL ${K.boundary_fail} · WARN ${K.boundary_warn} · PASS ${ok.length}</small></h2><div class="body">`;
h+=bad.length?`<table><tr><th>規則</th><th>目標</th><th>狀態</th><th>證據</th><th>處置</th></tr>${bad.map(bcRow).join('')}</table>`:'<small>無 FAIL/WARN</small>';
h+=`<details><summary>PASS 明細 (${ok.length})</summary><table><tr><th>規則</th><th>目標</th><th>狀態</th><th>證據</th><th>處置</th></tr>${ok.map(bcRow).join('')}</table></details></div></section>`;

const global=(T.artifacts||[]).filter(a=>a.req==='*');
if(global.length){h+=`<section><h2>架構圖 <small>跨需求 ${global.length} 張</small></h2><div class="body">${global.map(mer).join('')}</div></section>`}

h+=`<section><h2>D. 方法論 log <small>${LOG.length} 筆,${superseded.size} 筆被取代 · ev=explicit|inferred|assumed</small></h2><div class="body"><details><summary>展開 log <input type="search" id="lf" placeholder="篩選 REQ / stage / rule / evidence" onclick="event.stopPropagation()"></summary><div class="log" id="logbox">${LOG.map(logLine).join('')}</div></details></div></section>`;

document.getElementById('app').innerHTML=h;
const runMermaid=root=>{if(!window.mermaid)return;
  for(const n of [...root.querySelectorAll('.mermaid:not([data-processed])')].filter(n=>n.offsetParent!==null)){
    if(!n.dataset.src)n.dataset.src=n.textContent;
    mermaid.run({nodes:[n]}).catch(e=>{n.removeAttribute('data-processed');n.classList.remove('mermaid');n.classList.add('pre');n.textContent=n.dataset.src;
      n.insertAdjacentHTML('beforebegin',`<div class="loc" style="color:var(--fail)">圖語法錯誤:${esc(String((e&&(e.message||e.str))||e).split('\n')[0].slice(0,160))}</div>`)})}};
window.__renderVisible=()=>runMermaid(document);
const lk=document.getElementById('lk');
if(lk)lk.addEventListener('input',()=>{const q=lk.value.trim().toLowerCase();const box=document.getElementById('lkout');
  if(q.length<1){box.hidden=true;box.innerHTML='';return}
  const hit=s=>String(s||'').toLowerCase().includes(q);
  const g=GLT.filter(t=>hit(t.term)||hit(t.symbol)||hit(t.definition));
  const n=NMG.filter(x=>hit(x.term)||hit(x.symbol)||NMCOL.some(c=>(x[c]||[]).some(hit)));
  const a=AS.filter(x=>hit(x.heading)||hit(x.text)||hit(x.path));
  box.innerHTML=`<div><small><b>詞彙表</b> ${g.length}</small>${g.length?`<div class="tw"><table><tr><th>名詞</th><th>符號</th><th>定義</th><th>來源</th></tr>${g.map(t=>`<tr><td>${esc(t.term)}</td><td class="loc">${esc(t.symbol)}</td><td><small>${esc(t.definition)}</small></td><td>${loc(t.source,'')}</td></tr>`).join('')}</table></div>`:''}</div>
    <div><small><b>分層命名</b> ${n.length}</small>${n.length?namingTable(n):''}</div>
    <div><small><b>已知資產</b> ${a.length}</small>${a.length?assetList(a.slice(0,30)):''}</div>`;
  box.hidden=false;runMermaid(box)});   // mermaid 載入完成後由頁尾腳本呼叫;展開 details 時再補畫
document.querySelectorAll('tr.row').forEach(tr=>tr.addEventListener('click',()=>{const d=document.querySelector(`tr.detail[data-for="${tr.dataset.id}"]`);d.hidden=!d.hidden;if(!d.hidden)runMermaid(d)}));
document.querySelectorAll('details').forEach(dt=>dt.addEventListener('toggle',()=>{if(dt.open)runMermaid(dt)}));
document.getElementById('lf').addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#logbox div').forEach(d=>d.style.display=d.dataset.k.toLowerCase().includes(q)?'':'none')});
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
(function(){
  function boot(){
    mermaid.initialize({startOnLoad:false,securityLevel:'loose',theme:matchMedia('(prefers-color-scheme:dark)').matches?'dark':'default'});
    if(window.__renderVisible)window.__renderVisible();
  }
  function fail(){
    var n=document.createElement('div');
    n.setAttribute('role','status');
    n.style.cssText='position:sticky;top:0;z-index:9;padding:8px 12px;background:var(--warnbg);color:var(--warn);border-bottom:1px solid var(--line);font-size:13px';
    n.textContent='圖表引擎(mermaid)無法從 CDN 載入,圖以原始碼顯示。封閉網路請用 spec-dev.py all --offline 產生內嵌版面板。';
    document.body.prepend(n);
  }
  if(window.mermaid){boot();return}
  var s=document.createElement('script');
  s.src='https://unpkg.com/mermaid@11.4.1/dist/mermaid.min.js';
  s.onload=function(){window.mermaid?boot():fail()};
  s.onerror=fail;
  document.head.appendChild(s);
})();
</script>
</body>
</html>
