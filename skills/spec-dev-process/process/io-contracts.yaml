# I/O 契約:每個檔要有哪些章節、哪些表格(表頭簽名 + 必要欄)。extract 用 tables 辨識表格;contract 檢查用 files 驗證 llm stage 產物。
version: 1
files:
  00-overview.md:
    stage: S0
    required: false
    sections: [背景與目標, 範圍, 來源對照]
    tables: [io_map]
  10-requirements.md:
    stage: S0
    required: true
    sections: [需求清單, 驗收條件, 非功能需求]
    tables: [requirements, nfr, gaps]
    required_tables: [requirements]
  20-domain-model.md:
    stage: S1
    required: true
    sections: [Use Case, 狀態機, 領域模型]
    tables: []
  30-architecture-c4.md:
    stage: S2
    required: true
    sections: [Context, Container, Component, 追溯, Sequence]
    tables: [components, ac_links]
    required_tables: [components, ac_links]
  40-api-contracts.md:
    stage: S2
    required: false
    sections: [介面清單]
    tables: [apis, failure_modes]
  50-data-model.md:
    stage: S2
    required: false
    sections: [資料表, 擁有權]
    tables: [ownership]
  60-test-design.md:
    stage: S4
    required: true
    sections: [測試元件清單, Fitness Function]
    tables: [tests, fitness]
    required_tables: [tests]
  sa/00-lexicon.md:
    stage: SA
    dir: review
    required: false
    generated: true
    sections: [名詞候選, 動作候選, 角色候選]
    tables: [lexicon]
  sa/01-break-words.md:
    stage: SA
    dir: review
    required: false
    sections: [名詞, 動詞, 角色詞]
    tables: [words]
    required_tables: [words]
  sa/02-entities-relations.md:
    stage: SA
    dir: review
    required: false
    sections: [實體, 關係]
    tables: [sa_entities, sa_relations]
    required_tables: [sa_entities]
  sa/03-roles.md:
    stage: SA
    dir: review
    required: false
    sections: [角色與動作]
    tables: [sa_roles]
    required_tables: [sa_roles]
  sa/04-usecase.md:
    stage: SA
    dir: review
    required: false
    sections: [Use Case Diagram]
  sa/05-activity.md:
    stage: SA
    dir: review
    required: false
    sections: [Activity Diagram]
  sa/06-sequence.md:
    stage: SA
    dir: review
    required: false
    sections: [Sequence Diagram]
  sa/07-state.md:
    stage: SA
    dir: review
    required: false
    sections: [State Diagram]
  survey-mapping.md:
    stage: SV
    dir: review
    required: false
    sections: [對應表]
    tables: [survey]
    required_tables: [survey]
  method-log.jsonl:
    stage: S1
    required: true
    jsonl_fields: [seq, req, stage, method, rule, in, out, evidence]
    evidence: [explicit, inferred, assumed]

tables:
  requirements:  {signature: [ID, 需求, 型態],            columns: [ID, 需求, 型態, 來源錨點, AC]}
  nfr:           {signature: [ID, 刺激],                  columns: [ID, 刺激, 來源, 環境, 產物, 回應, 量測, 綁定 CMP/API, AC]}
  gaps:          {signature: ["#", 問題],                 columns: ["#", 問題, 影響 REQ, 暫時假設]}
  io_map:        {signature: [PM 來源, RD 產物],          columns: [PM 來源, RD 產物]}
  glossary:      {signature: [名詞, 定義],                columns: [名詞, 定義, 來源]}
  components:    {signature: [ID, 名稱, Layer],           columns: [ID, 名稱, Layer, Context, depends, external, 技術]}
  ac_links:      {signature: [AC, CMP],                   columns: [AC, CMP, via, 職責]}
  apis:          {signature: [ID, Method],                columns: [ID, Method, Path, 對應 REQ, 綁定 NFR, CMP]}
  failure_modes: {signature: [外部系統, 呼叫點 CMP],      columns: [外部系統, 呼叫點 CMP, 逾時, 重試, 降級, 補償]}
  ownership:     {signature: [表, Owner Context],         columns: [表, Owner Context]}
  tests:         {signature: [ID, 名稱, kind],            columns: [ID, 名稱, kind, 對應 CMP, 對應 AC]}
  fitness:       {signature: [NFR, 量測方式],             columns: [NFR, 量測方式, 門檻, 執行點]}
  words:         {signature: [詞, 詞性],                  columns: [詞, 詞性, 來源, 歸類]}
  lexicon:       {signature: [詞, 詞頻],                  columns: [詞, 詞頻, 權重]}
  sa_entities:   {signature: [實體, 英文],                columns: [實體, 英文, 屬性, 來源詞]}
  sa_relations:  {signature: [來源, 關係],                columns: [來源, 關係, 目標, 多重性]}
  sa_roles:      {signature: [角色, 動作],                columns: [角色, 動作, 流程, 對應 REQ]}
  survey:        {signature: [模型元素, 類型],            columns: [模型元素, 類型, 狀態, 對應 codebase, 證據, 說明]}
  candidates:    {signature: [模型元素, 候選檔案],        columns: [模型元素, 候選檔案, 行, 片段]}
  glossary_project: {signature: [名詞, 符號],             columns: [名詞, 符號, 定義, 來源 spec, 來源]}
  glossary_conflicts: {signature: [名詞, 符號 A],         columns: [名詞, 符號 A, 來源 A, 符號 B, 來源 B]}

artifacts:
  heading_prefixes: [UC-, STM-, SEQ-, CLS-, ERD-, C4-, UCD-, ACT-]     # mermaid 掛在這些開頭的 h3 下才算 artifact(UCD/ACT 為 SA 建模圖)
  kinds: {sequenceDiagram: sequence, stateDiagram: state, classDiagram: class, erDiagram: erd, C4Context: c4-context, C4Container: c4-container, C4Component: c4-component, flowchart: flowchart, graph: flowchart}

generated: [traceability.json, 90-traceability.md, boundary-report.md, check-panel.html, html/, survey-candidates.md, glossary.md, sa/00-lexicon.md, lexicon.json]
survey_status: [existing, modify, new]
