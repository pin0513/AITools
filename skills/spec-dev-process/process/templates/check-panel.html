<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RD Spec 核對面板</title>
<style>
:root{--bg:#fff;--fg:#1f2328;--muted:#656d76;--line:#d0d7de;--head:#f6f8fa;--pass:#1a7f37;--warn:#9a6700;--fail:#cf222e;--passbg:#dafbe1;--warnbg:#fff8c5;--failbg:#ffebe9;--accent:#0969da}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--fg:#e6edf3;--muted:#8b949e;--line:#30363d;--head:#161b22;--pass:#3fb950;--warn:#d29922;--fail:#f85149;--passbg:#12261e;--warnbg:#2b2411;--failbg:#3a1d1f;--accent:#58a6ff}}
:root[data-theme="dark"]{--bg:#0d1117;--fg:#e6edf3;--muted:#8b949e;--line:#30363d;--head:#161b22;--pass:#3fb950;--warn:#d29922;--fail:#f85149;--passbg:#12261e;--warnbg:#2b2411;--failbg:#3a1d1f;--accent:#58a6ff}
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:0;padding:8px 12px;background:var(--head);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.sub{color:var(--muted);font-size:12px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.kpi{border:1px solid var(--line);border-radius:6px;padding:8px 10px}.kpi b{display:block;font-size:22px;line-height:1.1}.kpi span{font-size:12px;color:var(--muted)}
.kpi.fail b{color:var(--fail)}.kpi.warn b{color:var(--warn)}.kpi.pass b{color:var(--pass)}
section{border:1px solid var(--line);border-radius:6px;margin:12px 0;overflow:hidden}
.body{padding:10px 12px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}th{background:var(--head);font-weight:600;white-space:nowrap}
.grp th{text-align:center;font-size:11px;color:var(--muted)}
.cell{text-align:center;white-space:nowrap}.cell.empty{color:var(--line)}
.st{display:inline-block;padding:0 6px;border-radius:10px;font-size:11px;font-weight:600}
.PASS{background:var(--passbg);color:var(--pass)}.WARN{background:var(--warnbg);color:var(--warn)}.FAIL{background:var(--failbg);color:var(--fail)}.INFO{background:var(--head);color:var(--muted)}
tr.row{cursor:pointer}tr.row:hover td{background:var(--head)}tr.detail td{background:var(--bg);padding:10px 14px}
tr.detail .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:800px){tr.detail .grid{grid-template-columns:1fr}}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;white-space:pre}
.log{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.7}
.log div{padding:0 6px;white-space:pre}.log .low{background:var(--warnbg)}.log .fail{background:var(--failbg)}.log .dead{text-decoration:line-through;color:var(--muted)}
details>summary{cursor:pointer;list-style:none;user-select:none}details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";color:var(--muted)}details[open]>summary::before{content:"▾ "}
input[type=search]{font:inherit;padding:2px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}
.pre{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted);white-space:pre-wrap}
.two{display:grid;grid-template-columns:1fr 1.6fr;gap:12px}@media(max-width:900px){.two{grid-template-columns:1fr}}
small{color:var(--muted)}.mermaid{background:var(--bg);margin:6px 0;overflow-x:auto}.mermaid svg{max-width:100%;height:auto}
.evtbl{table-layout:fixed}.evtbl td{word-break:break-word;vertical-align:top}
.evc{border:1px solid var(--line);border-radius:6px;margin:10px 0;overflow:hidden}
.evc>header{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;padding:8px 12px;background:var(--head);border-bottom:1px solid var(--line)}
.evg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr)}
.evg>div{padding:10px 12px;min-width:0;border-right:1px solid var(--line)}.evg>div:last-child{border-right:0}
.evg h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
@media(max-width:900px){.evg{grid-template-columns:minmax(0,1fr)}.evg>div{border-right:0;border-bottom:1px solid var(--line)}}
.loc{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted);word-break:break-all}
.dg{overflow-x:auto;border:1px solid var(--line);border-radius:4px;padding:4px;margin:4px 0 8px;background:var(--bg)}
.aud{border:1px solid var(--line);border-radius:6px;margin:6px 0}.aud>summary{padding:6px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.aud[open]>summary{border-bottom:1px solid var(--line);background:var(--head)}
.audg{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px;padding:10px 12px}@media(max-width:900px){.audg{grid-template-columns:minmax(0,1fr)}}
.prov{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:6px 10px;margin:0}.prov dt{color:var(--muted);font-size:12px}.prov dd{margin:0;min-width:0}
.dec{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:10px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}.dec.bad{border-color:var(--fail)}
.dec .note{flex:1 1 220px;font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}
.audbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}.audbar button{font:inherit;font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--fg);cursor:pointer}
.audbar button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}.audbar button:focus-visible,.dec input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.audbar .who{margin-left:auto;font-size:12px}.audbar .who input{font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);width:9em}
.soout{display:grid;gap:6px;margin-top:12px;padding:10px;border:1px dashed var(--line);border-radius:6px}.soout textarea{font:12px ui-monospace,Menlo,monospace;width:100%;box-sizing:border-box;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:6px}
.soout .row{display:flex;gap:8px;align-items:center}.soout button{font:inherit;font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:4px;background:var(--head);color:var(--fg);cursor:pointer}
.lookup{display:grid;gap:6px;margin:0 0 10px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--head)}
.lookup input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box}
.lkout{display:grid;gap:8px;max-height:60vh;overflow:auto}
.tw{overflow-x:auto}.tw table{width:auto;min-width:100%}.tw table td,.tw table th{white-space:normal;min-width:4.5em}.tw td.loc,.tw th{white-space:nowrap;word-break:normal}.st{white-space:nowrap}
.dg svg{max-width:none!important;height:auto}
.chain{font-size:12px;line-height:1.7}.chain .n{display:inline-block;padding:0 6px;border:1px solid var(--line);border-radius:4px;background:var(--head);font-family:ui-monospace,Menlo,monospace}.chain .m{color:var(--accent);font-family:ui-monospace,Menlo,monospace}.chain .ev{color:var(--muted)}
ul{margin:4px 0;padding-left:18px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DATA = /*__DATA__*/null;
</script>
<script>
(function(){
if(!DATA){document.getElementById('app').innerHTML='<p>尚未注入資料。請執行 spec-dev.py panel &lt;dir&gt;。</p>';return}
const T=DATA.trace,LOG=DATA.log||[],K=DATA.kpis,G=DATA.gate||[],BC=DATA.boundary||[];
const LAYERS=['Api','Application','Domain','Infrastructure'],KINDS=['unit','integration','contract','e2e'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cmp=Object.fromEntries((T.components||[]).map(c=>[c.id,c]));
const apiById=Object.fromEntries((T.apis||[]).map(a=>[a.id,a]));
const superseded=new Set(LOG.filter(e=>e.supersedes!=null).map(e=>e.supersedes));
const live=LOG.filter(e=>!superseded.has(e.seq));
const acOwner={};for(const r of T.requirements)for(const a of r.acs)acOwner[a]=r.id;
const acLinksOf=r=>(T.ac_links||[]).filter(l=>r.acs.includes(l.ac));
const cmpsOf=r=>{const s=new Set(acLinksOf(r).map(l=>l.component));for(const b of (r.binds||[])){if(cmp[b])s.add(b);if(apiById[b])for(const c of apiById[b].component)s.add(c)}return [...s].sort()};
const testsOf=r=>(T.tests||[]).filter(t=>t.acs.some(a=>r.acs.includes(a)));
const idsOf=r=>new Set([r.id,...r.acs]);
const gateOf=r=>{const ids=idsOf(r);return G.filter(g=>(g.ids||[]).some(i=>ids.has(i)))};
const bcOf=r=>{const ids=idsOf(r);for(const c of cmpsOf(r))ids.add(c);return BC.filter(b=>(b.ids||[]).some(i=>ids.has(i)))};
const status=r=>{const g=gateOf(r),b=bcOf(r);if(g.some(x=>x.level==='FAIL')||b.some(x=>x.status==='FAIL'))return'FAIL';if(g.some(x=>x.level==='WARN')||b.some(x=>x.status==='WARN'))return'WARN';return'PASS'};
const badge=s=>`<span class="st ${s}">${s}</span>`;
const fmt=e=>{const gap=(e.gaps||[]).length?`  gap="${e.gaps.join('; ')}"`:'';const note=e.note?`  "${e.note}"`:'';
  return `[${e.req}] ${e.stage} ${String(e.method).padEnd(22)} ${String(e.in).padEnd(28)} → ${String(e.out).padEnd(22)} rule=${String(e.rule).padEnd(4)} ev=${e.evidence||'?'}${gap}${note}`};
const logLine=e=>`<div class="${superseded.has(e.seq)?'dead':(String(e.out).toUpperCase()==='FAIL'?'fail':(e.evidence==='assumed'?'low':''))}" data-k="${esc(e.req+' '+e.stage+' '+e.rule+' '+e.method+' '+(e.evidence||''))}">${esc(fmt(e))}</div>`;
const mer=a=>`<details><summary>${esc(a.id)} <small>${esc(a.kind)} · ${esc(a.file)}:${a.line}</small></summary><pre class="mermaid" data-did="${esc(a.id)}">${esc(a.mermaid)}</pre></details>`;

let h='';
h+=`<h1>${esc(T.title)} <small>(${esc(T.feature)})</small></h1>
<div class="sub">來源檔:${(T.source_files||[]).map(esc).join(', ')} · 由 spec-dev.py 產生,資料以 md 為準</div>`;
h+=`<div class="kpis">
<div class="kpi"><b>${K.req_count}</b><span>需求 (REQ+NFR)</span></div>
<div class="kpi"><b>${K.component_count}</b><span>技術元件</span></div>
<div class="kpi"><b>${K.test_count}</b><span>測試元件</span></div>
<div class="kpi ${K.boundary_fail?'fail':(K.boundary_warn?'warn':'pass')}"><b>${K.boundary_pass}/${K.boundary_total}</b><span>技術邊界 PASS · FAIL ${K.boundary_fail} · WARN ${K.boundary_warn}</span></div>
<div class="kpi ${K.uncovered_req?'fail':'pass'}"><b>${K.uncovered_req}</b><span>未覆蓋需求 ${(K.uncovered_ids||[]).join(' ')}</span></div>
<div class="kpi ${K.open_gaps?'warn':'pass'}"><b>${K.open_gaps}</b><span>待 PM 確認缺口 · assumed ${K.assumed}</span></div></div>`;

// ---- E. 證據鏈:PM 證據 → 轉換證據(預設隱藏)→ RD 證據,全部內嵌 ----
const SRC=T.sources||{},PMS=(SRC.pm_spec&&SRC.pm_spec.sections)||[],MOCKS=SRC.mocks||[],ACT=T.ac_text||{},UCT=T.uc_text||{};
const pmFile=SRC.pm_spec?SRC.pm_spec.path:'';
const pmSec=src=>{if(!src)return null;const key=String(src).trim();return PMS.find(x=>x.anchor===key)||PMS.find(x=>key.startsWith(x.anchor+' ')||key.startsWith(x.anchor+'('))||PMS.find(x=>key.startsWith(x.anchor))||null};
const loc=(f,l)=>`<span class="loc">${esc(f)}${l?':L'+l:''}</span>`;
const mockView=m=>m.html?`<iframe sandbox="" srcdoc="${esc(m.html)}" style="width:100%;height:240px;border:1px solid var(--line);border-radius:4px;background:#fff"></iframe>`:(m.data_uri?`<img src="${m.data_uri}" style="max-width:100%;border:1px solid var(--line)">`:(m.text?`<pre class="pre">${esc(m.text)}</pre>`:`<small>${m.exists?'(無法內嵌)':'(檔案不存在)'}</small>`));
const artsOf=r=>{const hit=a=>a.req===r.id||(a.reqs||[]).includes(r.id);return {sa:(T.sa_artifacts||[]).filter(hit),rd:(T.artifacts||[]).filter(hit)}};
// ---- 自動圖:每條需求一定有圖(追溯圖 + 元件循序圖),由資料生成,不靠手寫 ----
const LORD=['Page','Component','Store','ApiClient','Api','Application','Domain','Infrastructure'];
const mid=s=>String(s).replace(/[^A-Za-z0-9]/g,'');
const mlab=s=>String(s).replace(/["<>]/g,"'").replace(/\|/g,'/').replace(/;/g,'；').replace(/#/g,'＃').replace(/[{}]/g,m=>m==='{'?'(':')');   // ; 與 # 在 mermaid 是語法字元
// ---- 詞彙 / 分層命名 / 已知資產:查找與關聯 ----
const GLT=(T.glossary&&T.glossary.terms)||[],NMG=(T.glossary&&T.glossary.naming)||[],AS=T.assets||[];
const NMCOL=['UI','API','Application','Domain','Infrastructure','DB'];
const reqText=r=>{const parts=[r.title,(pmSec(r.source)||{}).text||''];for(const a of r.acs){const t=ACT[a];if(t)parts.push(t.text)}
  for(const c of cmpsOf(r))parts.push(cmp[c]?.name||'');return parts.join(' ').toLowerCase()};
const relatedNaming=r=>{const tx=reqText(r);return NMG.filter(n=>(n.symbol&&tx.includes(n.symbol.toLowerCase()))||(n.term&&n.term.length>=2&&tx.includes(String(n.term).toLowerCase())))};
const relatedAssets=(r,keys)=>{const ks=keys.map(k=>String(k).toLowerCase()).filter(k=>k.length>=2);return AS.filter(a=>{const t=(a.heading+' '+a.text).toLowerCase();return ks.some(k=>t.includes(k))})};
const namingTable=rows=>rows.length?`<div class="tw"><table><tr><th>名詞</th><th>符號</th>${NMCOL.map(c=>`<th>${c}</th>`).join('')}</tr>${rows.map(n=>`<tr><td>${esc(n.term)}</td><td class="loc">${esc(n.symbol)}</td>${NMCOL.map(c=>`<td><small>${(n[c]||[]).map(esc).join(', ')}</small></td>`).join('')}</tr>`).join('')}</table></div>`:'<small>(無)</small>';
const assetList=rows=>rows.length?rows.map(a=>`<details><summary><small>${loc(a.path,a.line)} ${esc(a.heading)}</small></summary><pre class="pre" style="color:var(--fg)">${esc(a.text)}</pre></details>`).join(''):'<small>(無)</small>';
const AUTO=T.auto_diagrams||[];
const autoOf=(r,k)=>AUTO.find(a=>a.req===r.id&&a.id.startsWith('AUTO-'+k+'-'));
const narrow=code=>innerWidth<700?code.replace(/^flowchart LR/,'flowchart TD'):code;   /* 窄螢幕由上往下畫 */
const mocksOf=r=>{const ids=new Set([r.id,...artsOf(r).sa.map(a=>a.id),...artsOf(r).rd.map(a=>a.id)]);return MOCKS.filter(m=>(T.io_map||[]).some(row=>row.in.includes(m.path.split('/').pop())&&row.out.some(o=>[...ids].some(i=>o.includes(i)))))};
if(PMS.length||MOCKS.length){
h+=`<section><h2>E. 證據鏈 <small>PM 文字 ↔ 圖(追溯圖、循序圖)↔ RD 文字 · 全部內嵌,不用切畫面</small></h2><div class="body">`;
h+=`<div class="lookup"><label for="lk"><b>查找</b> <small>詞彙 ${GLT.length} · 分層命名 ${NMG.length} · 已知資產 ${AS.length} 段(${[...new Set(AS.map(a=>a.root))].map(esc).join('、')||'無'})</small></label>
  <input type="search" id="lk" placeholder="輸入名詞、符號或關鍵字,例:${esc((NMG[0]||{}).term||'訂單')}" autocomplete="off"><div id="lkout" class="lkout" hidden></div></div>`;
h+=`<details><summary>PM 素材全文 <small>${esc(pmFile)} ${SRC.pm_spec&&SRC.pm_spec.lines?SRC.pm_spec.lines+' 行':''} · mock ${MOCKS.length} · 參考 ${(SRC.refs||[]).length}</small></summary>
<div class="grid">${PMS.length?`<div><pre class="pre" style="color:var(--fg)">${PMS.map(x=>`${'#'.repeat(x.level)} ${esc(x.anchor)} ${esc(x.title)}  <small>(L${x.line})</small>\n${esc(x.text)}\n`).join('\n')}</pre></div>`:'<div><small>00-overview.md「## 來源」未指定 PM spec 路徑,或檔案不存在</small></div>'}
<div>${MOCKS.map(m=>`<b>${esc(m.path)}</b>${mockView(m)}`).join('')}${(SRC.refs||[]).length?`<b>參考</b><ul>${SRC.refs.map(r=>`<li class="mono">${esc(r.path)}${r.exists?'':' <small>(不存在)</small>'}</li>`).join('')}</ul>`:''}</div></div></details>`;
const chainOf=r=>{const logs=live.filter(e=>e.req===r.id).sort((a,b)=>a.seq-b.seq);
  return logs.map(e=>`<div><span class="n">${esc(e.in)}</span> ─<span class="m">[${esc(e.stage)} ${esc(e.method)}${e.rule?' · '+esc(e.rule):''}]</span>→ <span class="n">${esc(e.out)}</span> <span class="ev">ev=${esc(e.evidence||'?')}${(e.gaps||[]).length?' gap: '+esc(e.gaps.join('; ')):''}${e.note?' · '+esc(e.note):''}</span></div>`).join('')||'<small>(無 log)</small>'};
const logicOf=r=>{const ids=idsOf(r);const cs=cmpsOf(r);for(const c of cs)ids.add(c);
  const g=G.filter(x=>(x.ids||[]).some(i=>ids.has(i))),b=BC.filter(x=>(x.ids||[]).some(i=>ids.has(i)));
  const row=(st,rule,target,ev,act)=>`<tr><td>${badge(st)}</td><td><small>${esc(rule)}</small></td><td><small>${esc(target)}</small></td><td><small>${esc(ev)}${act?'<br>處置:'+esc(act):''}</small></td></tr>`;
  const all=[...g.map(x=>row(x.level,x.rule,(x.ids||[])[0]||'',x.msg,x.action)),...b.map(x=>row(x.status,x.rule,x.target,x.evidence,x.action))];
  const why=status(r)==='PASS'?`所有命中規則皆 PASS/INFO(${b.length} 條邊界、${g.length} 條 Gate)`:(status(r)==='FAIL'?'有規則 FAIL,見下':'有規則 WARN,見下');
  return `<small>${why}</small><table>${all.join('')||'<tr><td><small>無</small></td></tr>'}</table>`};
for(const r of (T.requirements||[])){
  const sec=pmSec(r.source),mk=mocksOf(r),A=artsOf(r),st=status(r);
  const pm=sec?`${loc(pmFile,sec.line)}<br><b>${esc(sec.anchor)} ${esc(sec.title)}</b><pre class="pre" style="color:var(--fg)">${esc(sec.text)}</pre>`:`<small>來源錨點「${esc(r.source)}」在 PM spec 找不到對應段落</small>`;
  const pmMock=mk.map(m=>`<details><summary><small>mock · ${esc(m.path.split('/').pop())}</small></summary>${mockView(m)}</details>`).join('');
  const roles=(T.sa_roles||[]).filter(x=>x.reqs.includes(r.id)),cs=cmpsOf(r);
  const ents=(T.sa_entities||[]).filter(e=>e.en&&cs.some(c=>(cmp[c]?.name||'').includes(e.en)));
  const logs=live.filter(e=>e.req===r.id);
  const tr_=autoOf(r,'TRACE'),sq_=autoOf(r,'SEQ');
  const mid_=`<h4>轉換證據 · 圖</h4>
    ${tr_?`<div class="dg"><pre class="mermaid" data-did="${esc(tr_.id)}">${esc(narrow(tr_.mermaid))}</pre></div>`:'<small>(無自動追溯圖)</small>'}
    ${sq_?`<div class="dg"><pre class="mermaid" data-did="${esc(sq_.id)}">${esc(sq_.mermaid)}</pre></div>`:''}
    <details><summary><b>分析鏈</b> <small>${logs.length} 步 · 角色動作 ${roles.length} · 實體 ${ents.length} · 手寫 SA 圖 ${A.sa.length} · RD 圖 ${A.rd.length}</small></summary>
    ${roles.length?`<small><b>SA3 角色→動作</b></small><ul>${roles.map(x=>`<li><small>${esc(x.role)} → ${esc(x.action)} <i>${esc(x.flow)}</i></small></li>`).join('')}</ul>`:''}
    ${ents.length?`<small><b>SA2 實體</b> ${ents.map(e=>esc(e.name)+'('+esc(e.en)+')').join('、')}</small><br>`:''}
    <small><b>方法論步驟</b></small><div class="chain">${chainOf(r)}</div>
    ${A.sa.map(mer).join('')}${A.rd.map(mer).join('')}</details>
    <details><summary><b>邏輯鏈</b> <small>為什麼是 ${st}</small></summary><div class="tw">${logicOf(r)}</div></details>

const bad=BC.filter(b=>b.status!=='PASS'),ok=BC.filter(b=>b.status==='PASS');
const bcRow=b=>`<tr><td>${esc(b.rule)}</td><td>${esc(b.target)}</td><td>${badge(b.status)}</td><td>${esc(b.evidence)}</td><td>${esc(b.action)}</td></tr>`;
h+=`<section><h2>C. 技術邊界核對 <small>由規則 B1–B8 機械計算 · FAIL ${K.boundary_fail} · WARN ${K.boundary_warn} · PASS ${ok.length}</small></h2><div class="body">`;
h+=bad.length?`<table><tr><th>規則</th><th>目標</th><th>狀態</th><th>證據</th><th>處置</th></tr>${bad.map(bcRow).join('')}</table>`:'<small>無 FAIL/WARN</small>';
h+=`<details><summary>PASS 明細 (${ok.length})</summary><table><tr><th>規則</th><th>目標</th><th>狀態</th><th>證據</th><th>處置</th></tr>${ok.map(bcRow).join('')}</table></details></div></section>`;

const global=(T.artifacts||[]).filter(a=>a.req==='*');
if(global.length){h+=`<section><h2>架構圖 <small>跨需求 ${global.length} 張</small></h2><div class="body">${global.map(mer).join('')}</div></section>`}

h+=`<section><h2>D. 方法論 log <small>${LOG.length} 筆,${superseded.size} 筆被取代 · ev=explicit|inferred|assumed</small></h2><div class="body"><details><summary>展開 log <input type="search" id="lf" placeholder="篩選 REQ / stage / rule / evidence" onclick="event.stopPropagation()"></summary><div class="log" id="logbox">${LOG.map(logLine).join('')}</div></details></div></section>`;

document.getElementById('app').innerHTML=h;
const runMermaid=root=>{if(!window.mermaid)return;
  for(const n of [...root.querySelectorAll('.mermaid:not([data-processed])')].filter(n=>n.offsetParent!==null)){
    if(!n.dataset.src)n.dataset.src=n.textContent;
    mermaid.run({nodes:[n]}).catch(e=>{n.removeAttribute('data-processed');n.classList.remove('mermaid');n.classList.add('pre');n.textContent=n.dataset.src;
      n.insertAdjacentHTML('beforebegin',`<div class="loc" style="color:var(--fail)">圖語法錯誤:${esc(String((e&&(e.message||e.str))||e).split('\n')[0].slice(0,160))}</div>`)})}};
window.__renderVisible=()=>runMermaid(document);
(function(){const list=document.getElementById('audlist');if(!list)return;
  const KEY='specdev-signoff:'+((DATA.trace||{}).feature||'')+':';
  const set=(k,v)=>{try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}};
  let who='';try{who=localStorage.getItem('specdev-reviewer')||''}catch(e){}
  const W=document.getElementById('reviewer');W.value=who;W.addEventListener('input',()=>{who=W.value.trim();try{localStorage.setItem('specdev-reviewer',who)}catch(e){};render()});
  let mode='cmd';
  const filt=f=>{for(const d of list.children){const r=+d.dataset.rank;d.hidden=!(f==='all'||(f==='todo'&&r<6)||d.dataset.phase===f||d.dataset.type===f)}
    for(const b of document.querySelectorAll('.audbar button'))b.classList.toggle('on',b.dataset.f===f)};
  document.querySelectorAll('.audbar button').forEach(b=>b.addEventListener('click',()=>filt(b.dataset.f)));filt('todo');
  list.addEventListener('toggle',e=>{if(e.target.open)runMermaid(e.target)},true);
  const today=new Date().toISOString().slice(0,10);
  const specDir=(DATA.trace||{}).spec_dir||'<spec 目錄>';
  function render(){const rows=[];
    for(const fs of list.querySelectorAll('fieldset.dec')){const v=(fs.querySelector('input[type=radio]:checked')||{}).value||'';const note=fs.querySelector('.note').value.trim();
      set(fs.dataset.id+'@'+fs.dataset.hash,{v,note});
      fs.classList.toggle('bad',v==='rejected'&&!note);
      if(v)rows.push({id:fs.dataset.id,hash:fs.dataset.hash,kind:fs.dataset.kind,tg:fs.dataset.tg,v,note})}
    const ta=document.getElementById('socmd');
    ta.value=rows.length?(mode==='cmd'?rows.map(r=>`python3 spec-dev.py signoff ${specDir} ${r.id} --hash ${r.hash} --by "${who||'審核者'}"${r.v==='rejected'?' --reject':''}${r.note?` --note "${r.note.replace(/"/g,"'")}"`:''}`).join('\n')
      :rows.map(r=>`| ${r.id} | ${r.kind} | ${r.tg} | ${r.v==='approved'?r.hash:''} | ${r.hash} | ${r.v} | ${who} | ${today} | ${r.note.replace(/\|/g,'/')} |`).join('\n')):'';
    document.getElementById('sostat').textContent=rows.length?`${rows.length} 筆判斷${rows.some(r=>r.v==='rejected'&&!r.note)?' · 有退回沒寫備註':''}`:'尚未做任何判斷';}
  list.addEventListener('change',render);list.addEventListener('input',e=>{if(e.target.classList.contains('note'))render()});
  document.getElementById('somd').addEventListener('click',e=>{mode=mode==='cmd'?'md':'cmd';e.target.textContent=mode==='cmd'?'改顯示 md 列':'改顯示指令';render()});
  document.getElementById('socopy').addEventListener('click',()=>{const ta=document.getElementById('socmd');
    (navigator.clipboard?navigator.clipboard.writeText(ta.value):Promise.reject()).then(()=>{document.getElementById('sostat').textContent='已複製'}).catch(()=>{ta.select();document.getElementById('sostat').textContent='請按 Ctrl/⌘+C 複製'})});
  render();
})();
const lk=document.getElementById('lk');
if(lk)lk.addEventListener('input',()=>{const q=lk.value.trim().toLowerCase();const box=document.getElementById('lkout');
  if(q.length<1){box.hidden=true;box.innerHTML='';return}
  const hit=s=>String(s||'').toLowerCase().includes(q);
  const g=GLT.filter(t=>hit(t.term)||hit(t.symbol)||hit(t.definition));
  const n=NMG.filter(x=>hit(x.term)||hit(x.symbol)||NMCOL.some(c=>(x[c]||[]).some(hit)));
  const a=AS.filter(x=>hit(x.heading)||hit(x.text)||hit(x.path));
  box.innerHTML=`<div><small><b>詞彙表</b> ${g.length}</small>${g.length?`<div class="tw"><table><tr><th>名詞</th><th>符號</th><th>定義</th><th>來源</th></tr>${g.map(t=>`<tr><td>${esc(t.term)}</td><td class="loc">${esc(t.symbol)}</td><td><small>${esc(t.definition)}</small></td><td>${loc(t.source,'')}</td></tr>`).join('')}</table></div>`:''}</div>
    <div><small><b>分層命名</b> ${n.length}</small>${n.length?namingTable(n):''}</div>
    <div><small><b>已知資產</b> ${a.length}</small>${a.length?assetList(a.slice(0,30)):''}</div>`;
  box.hidden=false;runMermaid(box)});   // mermaid 載入完成後由頁尾腳本呼叫;展開 details 時再補畫
document.querySelectorAll('tr.row').forEach(tr=>tr.addEventListener('click',()=>{const d=document.querySelector(`tr.detail[data-for="${tr.dataset.id}"]`);d.hidden=!d.hidden;if(!d.hidden)runMermaid(d)}));
document.querySelectorAll('details').forEach(dt=>dt.addEventListener('toggle',()=>{if(dt.open)runMermaid(dt)}));
document.getElementById('lf').addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#logbox div').forEach(d=>d.style.display=d.dataset.k.toLowerCase().includes(q)?'':'none')});
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
(function(){
  function boot(){
    mermaid.initialize({startOnLoad:false,securityLevel:'loose',theme:matchMedia('(prefers-color-scheme:dark)').matches?'dark':'default'});
    if(window.__renderVisible)window.__renderVisible();
  }
  function fail(){
    var n=document.createElement('div');
    n.setAttribute('role','status');
    n.style.cssText='position:sticky;top:0;z-index:9;padding:8px 12px;background:var(--warnbg);color:var(--warn);border-bottom:1px solid var(--line);font-size:13px';
    n.textContent='圖表引擎(mermaid)無法從 CDN 載入,圖以原始碼顯示。封閉網路請用 spec-dev.py all --offline 產生內嵌版面板。';
    document.body.prepend(n);
  }
  if(window.mermaid){boot();return}
  var s=document.createElement('script');
  s.src='https://unpkg.com/mermaid@11.4.1/dist/mermaid.min.js';
  s.onload=function(){window.mermaid?boot():fail()};
  s.onerror=fail;
  document.head.appendChild(s);
})();
</script>
</body>
</html>
