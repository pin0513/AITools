# 流程骨幹。每個 stage:誰執行(llm|tool)、輸入、輸出、用哪些工具(name@version)、放行規則。
# runner(tools/execute/runner_v*.py)照順序跑;llm stage 只做契約檢查(產物存在且合約),tool stage 真的執行。
# gates 只決定該 stage 是否停(stop_on);check.gate 工具與面板永遠算全量 Gate。
version: 2
pipeline: pm-to-rd-spec   # S0 → SA → SV → S1 → S2 → S3 → S4 → S5 → S6
stages:
  - id: S0
    name: Intake
    owner: llm
    inputs:  [pm_spec.md, "mock (optional)"]
    outputs: [00-overview.md, 10-requirements.md]
    methods: [S0 段落切片, 型態判定]
    gates:   [G-S0-sections]
    stop_on: FAIL

  - id: SA
    name: SA Modeling
    owner: llm
    methodology: sa_modeling            # outputs 由 config.sa_modeling.methodology 指到的 rules/methodology/sa/<name>.yaml 決定
    pre_tools: [analyze.extract@1, analyze.glossary@1, analyze.assets@1, analyze.lexicon@1]   # SA0 前置解析(工具層):斷詞、詞頻、glossary-mapping → sa/00-lexicon.md,LLM 從它做 SA1
    inputs:  [10-requirements.md, pm_spec.md, "mock (optional)", "docs (optional)"]
    outputs: []                          # runner 以方法論 steps[*].output 填入(位於 review_dir)
    gates:   [G-SA-steps]
    stop_on: FAIL

  - id: SV
    name: Survey Mapping
    owner: tool+llm
    requires: sa_modeling               # sa_modeling.methodology = none 時與 SA 一起跳過
    inputs:  [review_dir/sa/*.md, codebase, 其他 spec 的 sa/02 與名詞表]
    tools:   [analyze.glossary@1, analyze.survey@1]   # 先抽跨 spec 詞彙表(專案根 glossary.md),再掃 codebase 產 survey-candidates.md;人/LLM 定案 survey-mapping.md
    outputs: [survey-candidates.md, survey-mapping.md]
    gates:   [G-GL-consistency, G-SV-evidence]
    stop_on: FAIL

  - id: S1
    name: Analyze
    owner: llm
    inputs:  [10-requirements.md, review_dir/sa/*.md, review_dir/survey-mapping.md]
    outputs: [10-requirements.md#驗收條件, 10-requirements.md#非功能需求, 20-domain-model.md, method-log.jsonl]
    methods: [M1, M2, M3, M5, M11]
    gates:   [G-M-log, G-M1-post]
    stop_on: FAIL

  - id: S2
    name: Design
    owner: llm
    inputs:  [10-requirements.md, 20-domain-model.md]
    outputs: [30-architecture-c4.md, 40-api-contracts.md, 41-ui-spec.md, 50-data-model.md, method-log.jsonl]   # 40/50 在 api/、41 在 ui/(第二層)
    methods: [M4, M6, M7, M8, M9, M10, M13, M14, M15, M18]
    gates:   [G-S5-extract]
    stop_on: FAIL

  - id: S3
    name: Boundary
    owner: tool
    inputs:  [30-architecture-c4.md, 40-api-contracts.md, 50-data-model.md, method-log.jsonl]
    tools:   [analyze.extract@1, check.boundary@1, check.gate@1, transform.report@1]
    outputs: [boundary-report.md, 90-traceability.md, traceability.json]
    gates:   [G-S3-boundary]
    stop_on: FAIL

  - id: S4
    name: Test
    owner: llm
    inputs:  [10-requirements.md, 30-architecture-c4.md]
    outputs: [60-test-design.md, method-log.jsonl]
    methods: [M12, M16, M17]
    gates:   []
    stop_on: FAIL

  - id: S5
    name: Assemble
    owner: tool
    inputs:  [00-overview.md, 10-requirements.md, 20-domain-model.md, 30-architecture-c4.md, 40-api-contracts.md, 50-data-model.md, 60-test-design.md, method-log.jsonl]
    tools:   [analyze.extract@1, check.boundary@1, check.gate@1, transform.report@1]
    outputs: [traceability.json, 90-traceability.md, boundary-report.md]
    gates:   [G-S5-orphans, G-M-assumed]
    stop_on: FAIL

  - id: S6
    name: Review(spec-reviewer 子系統:看板 + 圖表審計)
    owner: tool+human
    inputs:  [traceability.json, method-log.jsonl, spec-review/sa/*.md, spec-review/audit/signoff.md]
    # 看板先建一次 → 瀏覽器驗證 → 把渲染結果併進審計清單後再建一次(看板上每張圖都帶渲染狀態)
    tools:   [review.versions@1, review.diagrams@1, review.audit@1, transform.panel@1, review.render_check@1, transform.panel@1, transform.render@1]
    outputs: [check-panel.html, audit/audit.json, audit/signoff.md, audit/versions.jsonl, html/]
    gates:   [G-DG-target, G-DG-process, G-DG-consistency, G-SA-tables, G-DG-signoff, G-S6-render, G-RV-threads]
    stop_on: FAIL
