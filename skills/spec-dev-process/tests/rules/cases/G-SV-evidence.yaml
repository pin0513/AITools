rule: G-SV-evidence
cases:
  - name: verified_against_testcase1_codebase
    ctx: {project_root: examples/testcase1-form-system}
    patch: {replace: {survey: [{element: FormSubmission, kind: Aggregate, status: modify, target: x, evidence: "src/api/Forms.Domain/FormSubmission.cs:4", note: ""}]}}
    expect: [{outcome: verified_weak, target: FormSubmission, status: INFO}]
  - name: wrong_line
    ctx: {project_root: examples/testcase1-form-system}
    patch: {replace: {survey: [{element: FormSubmission, kind: Aggregate, status: modify, target: x, evidence: "src/api/Forms.Domain/FormSubmission.cs:1", note: ""}]}}
    expect: [{outcome: line_mismatch, target: FormSubmission, status: FAIL}]
  - name: missing_path
    ctx: {project_root: examples/testcase1-form-system}
    patch: {replace: {survey: [{element: Foo, kind: x, status: existing, target: x, evidence: "src/nope.cs:1", note: ""}]}}
    expect: [{outcome: path_missing, target: Foo, status: FAIL}]
  - name: no_evidence_for_existing
    ctx: {project_root: examples/testcase1-form-system}
    patch: {replace: {survey: [{element: Foo, kind: x, status: existing, target: x, evidence: "", note: ""}]}}
    expect: [{outcome: no_evidence, target: Foo, status: FAIL}]
  - name: bad_status
    ctx: {project_root: examples/testcase1-form-system}
    patch: {replace: {survey: [{element: Foo, kind: x, status: maybe, target: x, evidence: "", note: ""}]}}
    expect: [{outcome: bad_status, target: Foo, status: FAIL}]
  - name: new_but_candidate_found
    ctx:
      project_root: examples/testcase1-form-system
      survey_candidates: {Form: [["src/api/Forms.Domain/Form.cs", 6, "public sealed class Form"]]}
    patch: {replace: {survey: [{element: Form, kind: x, status: new, target: x, evidence: "", note: ""}]}}
    expect: [{outcome: new_but_found, target: Form, status: WARN}]
  - name: new_without_candidate
    ctx: {project_root: examples/testcase1-form-system}
    patch: {replace: {survey: [{element: ReviewRecord, kind: x, status: new, target: x, evidence: "", note: ""}]}}
    expect: []
  - name: chinese_element_without_symbol_is_warn_not_fail
    ctx: {project_root: examples/testcase1-form-system}
    patch: {replace: {survey: [{element: 填寫紀錄, kind: Aggregate, status: modify, target: x, evidence: "src/api/Forms.Domain/FormSubmission.cs:4", note: ""}]}}
    expect: [{outcome: no_symbol, target: 填寫紀錄, status: WARN}]
  - name: chinese_element_with_symbol_in_parens
    ctx: {project_root: examples/testcase1-form-system}
    patch: {replace: {survey: [{element: "填寫紀錄 (FormSubmission)", kind: Aggregate, status: modify, target: x, evidence: "src/api/Forms.Domain/FormSubmission.cs:4", note: ""}]}}
    expect: [{outcome: verified_weak, target: "填寫紀錄 (FormSubmission)", status: INFO}]
  - name: literal_text_pins_the_behavior_line
    ctx: {project_root: examples/testcase1-form-system}
    patch: {replace: {survey: [{element: 必填檢查, kind: Rule, status: existing, target: x, evidence: "src/api/Forms.Domain/FormSubmission.cs:16 \"FIELD_REQUIRED\"", note: ""}]}}
    expect: [{outcome: verified, target: 必填檢查, status: INFO}]
  - name: literal_text_mismatch_fails
    ctx: {project_root: examples/testcase1-form-system}
    patch: {replace: {survey: [{element: 必填檢查, kind: Rule, status: existing, target: x, evidence: "src/api/Forms.Domain/FormSubmission.cs:16 \"FIELD_OPTIONAL\"", note: ""}]}}
    expect: [{outcome: line_mismatch, target: 必填檢查, status: FAIL}]
  - name: chinese_element_resolved_via_glossary
    ctx:
      project_root: examples/testcase1-form-system
      glossary: {terms: {填寫紀錄: {symbol: FormSubmission, specs: [issue-b], definition: "", source: x}}}
    patch: {replace: {survey: [{element: 填寫紀錄, kind: Aggregate, status: modify, target: x, evidence: "src/api/Forms.Domain/FormSubmission.cs:4", note: ""}]}}
    expect: [{outcome: verified_weak, target: 填寫紀錄, status: INFO}]
  - name: chinese_element_resolved_via_sa2
    ctx: {project_root: examples/testcase1-form-system}
    patch:
      replace:
        survey: [{element: 填寫紀錄, kind: Aggregate, status: modify, target: x, evidence: "src/api/Forms.Domain/FormSubmission.cs:4", note: ""}]
        sa_entities: [{name: 填寫紀錄, en: FormSubmission, attrs: "", source: ""}]
    expect: [{outcome: verified_weak, target: 填寫紀錄, status: INFO}]
  # ---- 固定對照組(FEEDBACK v2.7.1,MAYOFORM-1818 的去識別版):PM 宣稱「包含運算子現行已有」,實際 getOperatorList 只有 EQUAL / NOT_EQUAL ----
  - name: control_A_claim_existing_symbol_absent
    ctx: {project_root: tests/fixtures/control-group}
    patch: {replace: {survey: [{element: ContainsOperator, kind: entity, status: existing, target: "", evidence: "web/src/conditions.ts:4", note: ""}]}}
    expect: [{outcome: line_mismatch, target: ContainsOperator, status: FAIL}]
  - name: control_B_function_name_on_declaration_line
    ctx: {project_root: tests/fixtures/control-group}
    patch: {replace: {survey: [{element: getOperatorList, kind: entity, status: existing, target: "", evidence: "web/src/conditions.ts:2", note: ""}]}}
    expect: [{outcome: decl_only, target: getOperatorList, status: WARN}]
  - name: control_C_honest_new
    ctx: {project_root: tests/fixtures/control-group}
    patch: {replace: {survey: [{element: ContainsOperator, kind: entity, status: new, target: "", evidence: "", note: ""}]}}
    expect: []
  - name: control_D_pure_chinese_without_mapping
    ctx: {project_root: tests/fixtures/control-group}
    patch: {replace: {survey: [{element: 包含運算子, kind: entity, status: existing, target: "", evidence: "web/src/conditions.ts:4", note: ""}]}}
    expect: [{outcome: no_symbol, target: 包含運算子, status: WARN}]
  - name: control_D2_pure_chinese_resolved_by_naming_map
    ctx: {project_root: tests/fixtures/control-group}
    patch: {replace: {survey: [{element: 包含運算子, kind: entity, status: existing, target: "", evidence: "web/src/conditions.ts:4", note: ""}],
                      glossary: {naming: [{term: 包含運算子, symbol: ContainsOperator}]}}}
    expect: [{outcome: line_mismatch, target: 包含運算子, status: FAIL}]
  - name: control_D3_pure_chinese_resolved_by_lexicon
    ctx: {project_root: tests/fixtures/control-group}
    patch: {replace: {survey: [{element: 包含運算子, kind: entity, status: existing, target: "", evidence: "web/src/conditions.ts:4", note: ""}],
                      lexicon: {nouns: [{term: 包含運算子, symbol: ContainsOperator}]}}}
    expect: [{outcome: line_mismatch, target: 包含運算子, status: FAIL}]
  - name: control_E_function_name_plus_literal_lock
    ctx: {project_root: tests/fixtures/control-group}
    patch: {replace: {survey: [{element: getOperatorList, kind: entity, status: existing, target: "", evidence: "web/src/conditions.ts:2 \"CONTAINS\"", note: ""}]}}
    expect: [{outcome: line_mismatch, target: getOperatorList, status: FAIL}]
  - name: control_F_chinese_with_symbol
    ctx: {project_root: tests/fixtures/control-group}
    patch: {replace: {survey: [{element: 包含運算子 (ContainsOperator), kind: entity, status: existing, target: "", evidence: "web/src/conditions.ts:4", note: ""}]}}
    expect: [{outcome: line_mismatch, target: 包含運算子 (ContainsOperator), status: FAIL}]
  - name: control_G_real_literal_passes_strong
    ctx: {project_root: tests/fixtures/control-group}
    patch: {replace: {survey: [{element: 不等於運算子 (NotEqualOperator), kind: entity, status: existing, target: "", evidence: "web/src/conditions.ts:5 \"NOT_EQUAL\"", note: ""}]}}
    expect: [{outcome: verified, target: 不等於運算子 (NotEqualOperator), status: INFO}]
  - name: symbol_match_on_body_line_is_weak
    ctx: {project_root: tests/fixtures/control-group}
    patch: {replace: {survey: [{element: NOT_EQUAL, kind: entity, status: existing, target: "", evidence: "web/src/conditions.ts:5", note: ""}]}}
    expect: [{outcome: verified_weak, target: NOT_EQUAL, status: INFO}]
  - name: class_declaration_proves_entity_existence
    ctx: {project_root: tests/fixtures/control-group}
    patch: {replace: {survey: [{element: ConditionForm, kind: entity, status: existing, target: "", evidence: "web/src/conditions.ts:10", note: ""}]}}
    expect: [{outcome: verified_weak, target: ConditionForm, status: INFO}]
  - name: declaration_plus_behavior_line_clears_warning
    ctx: {project_root: tests/fixtures/control-group}
    patch: {replace: {survey: [{element: getOperatorList, kind: entity, status: existing, target: "", evidence: "web/src/conditions.ts:2; web/src/conditions.ts:5 \"NOT_EQUAL\"", note: ""}]}}
    expect: [{outcome: verified, target: getOperatorList, status: INFO}]
